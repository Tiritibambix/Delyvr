<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fraunces:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:      #0a0a0b;
            --border:  #1e1e21;
            --text:    #f2f2f4;
            --muted:   #9898a2;
            --muted2:  #6b6b72;
            --subtle:  #2a2a2e;
            --accent:  #c9a962;
            --accent-h:#dfc07a;
        }

        html.light {
            --bg:      #f5f4f0;
            --border:  #dddbd6;
            --text:    #000000;
            --muted:   #1c1c1c;
            --muted2:  #242424;
            --subtle:  #e8e6e1;
            --accent:  #c9a962;
            --accent-h:#dfc07a;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            color: var(--text);
            font-family: 'Instrument Sans', -apple-system, sans-serif;
        }

        body {
            display: grid;
            grid-template-rows: auto 1fr auto;
            height: 100%;
        }

        .bg-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
            z-index: 0;
        }

        .bg-image.loaded { opacity: 0.35; }
        html.light .bg-image.loaded { opacity: 0.55; }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10,10,11,0.2) 0%, rgba(10,10,11,0.75) 100%);
            z-index: 1;
        }

        html.light .bg-overlay {
            background: rgba(245,244,240,0.4);
        }

        /* HEADER */
        .site-header {
            position: relative;
            z-index: 10;
            padding: 20px 32px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .site-header .logo-wrap {
            text-align: center;
        }

        .site-header img.logo {
            display: inline-block;
            height: auto;
            max-height: 96px;
            max-width: min(380px, 75vw);
            width: auto;
            object-fit: contain;
        }

        /* BODY */
        .content {
            position: relative;
            z-index: 10;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 48px 32px;
            text-align: center;
        }

        .content.visible { display: flex; }

        .eyebrow {
            font-size: 11px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 16px;
            font-weight: 600;
        }
        html.light .eyebrow { color: #6b4e10; }

        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 300;
            letter-spacing: -0.01em;
            line-height: 1.1;
            color: var(--text);
            margin-bottom: 10px;
            opacity: 0;
            transform: translateY(16px);
            animation: fadeUp 0.7s ease 0.1s forwards;
        }

        .meta {
            font-size: 13px;
            color: var(--muted);
            margin-bottom: 40px;
            letter-spacing: 0.04em;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.2s forwards;
        }

        .actions {
            display: flex;
            align-items: center;
            gap: 28px;
            opacity: 0;
            animation: fadeUp 0.7s ease 0.3s forwards;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 9px;
            background: #c9a962;
            color: #0a0a0b;
            text-decoration: none;
            border-radius: 4px;
            padding: 11px 24px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: background 0.2s;
            border: none;
        }

        .download-btn:hover { background: #dfc07a; }
        .download-btn svg { width: 16px; height: 16px; flex-shrink: 0; }

        .preview-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: transparent;
            border: 1px solid #c9a962;
            color: #c9a962;
            text-decoration: none;
            border-radius: 4px;
            padding: 11px 24px;
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: background 0.2s, color 0.2s;
            white-space: nowrap;
        }

        .preview-link:hover { background: rgba(201,169,98,0.12); }
        html.light .preview-link { border-color: #8a6515; color: #8a6515; }
        html.light .preview-link:hover { background: rgba(138,101,21,0.08); }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--muted);
            text-decoration: none;
            font-size: 12px;
            font-weight: 500;
            letter-spacing: 0.04em;
            transition: color 0.2s;
            white-space: nowrap;
        }
        .back-link:hover { color: var(--text); }

        .not-found {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            padding: 48px 32px;
            text-align: center;
        }

        .not-found.active { display: flex; }
        .not-found h1 { font-size: 1.6rem; margin-bottom: 12px; }
        .not-found .meta { margin-bottom: 0; }

        @keyframes fadeUp {
            to { opacity: 1; transform: translateY(0); }
        }

        /* FOOTER */
        .social-footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 20;
            padding: 12px 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            background: rgba(10,10,11,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        html.light .social-footer {
            background: rgba(245,244,240,0.85);
        }
        /* Push content above fixed footer */
        .content, .not-found { padding-bottom: 64px; }

        .social-footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .social-footer-links a {
            color: var(--muted);
            display: flex;
            transition: color 0.2s;
        }

        .social-footer-links a:hover { color: var(--accent); }
        .social-footer-links svg { width: 18px; height: 18px; fill: currentColor; }

        @media (max-width: 480px) {
            .site-header { padding: 16px 20px; }
            .content, .not-found { padding: 32px 24px; }
            .actions { flex-direction: column; gap: 16px; }
        }
    </style>
</head>
<body>
    <img class="bg-image" id="bgImage">
    <div class="bg-overlay"></div>

    <header class="site-header">
        <div class="logo-wrap">
            <img src="/api/logo" alt="Logo" class="logo">
        </div>
    </header>

    <main>
        <div class="content" id="content">
            <div class="eyebrow" id="eyebrowText"></div>
            <h1 id="eventTitle"></h1>
            <p class="meta" id="photoCount"></p>
            <div class="actions">
                <a class="download-btn" id="downloadBtn" href="#">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span id="downloadAllText"></span>
                </a>
                <a class="preview-link" id="previewLink" href="#">
                    <span id="browseText"></span>
                </a>
            </div>
            <a class="back-link" id="backToCollectionBtn" href="#" style="display:none; margin-top: 20px;">
                <span id="backToCollectionText"></span>
            </a>
        </div>

        <div class="not-found" id="notFound">
            <h1 id="notFoundTitle"></h1>
            <p class="meta" id="notFoundText"></p>
        </div>
    </main>

    <footer class="social-footer" id="socialFooter"></footer>

    <script src="/shared.js"></script>
    <script>
        const translations = {
            en: { yourPhotos:'Your Photos', photo:'photo', photos:'photos', downloadAll:'Download All', browseIndividually:'View photos', browseOnly:'View photos', ready:'Your photos are ready', notFoundTitle:'Gallery Not Found', notFoundText:'This gallery may have been removed or the link is incorrect.', backToCollection:'← Back to collection' },
            pt: { yourPhotos:'Suas Fotos', photo:'foto', photos:'fotos', downloadAll:'Baixar Todas', browseIndividually:'Ver as fotos', browseOnly:'Ver as fotos', ready:'Suas fotos estão prontas', notFoundTitle:'Galeria Não Encontrada', notFoundText:'Esta galeria pode ter sido removida ou o link está incorreto.', backToCollection:'← Voltar à coleção' },
            es: { yourPhotos:'Tus Fotos', photo:'foto', photos:'fotos', downloadAll:'Descargar Todas', browseIndividually:'Ver las fotos', browseOnly:'Ver las fotos', ready:'Tus fotos están listas', notFoundTitle:'Galería No Encontrada', notFoundText:'Esta galería puede haber sido eliminada o el enlace es incorrecto.', backToCollection:'← Volver a la colección' },
            it: { yourPhotos:'Le Tue Foto', photo:'foto', photos:'foto', downloadAll:'Scarica Tutte', browseIndividually:'Sfoglia le foto', browseOnly:'Sfoglia le foto', ready:'Le tue foto sono pronte', notFoundTitle:'Galleria Non Trovata', notFoundText:'Questa galleria potrebbe essere stata rimossa o il link non è corretto.', backToCollection:'← Torna alla collezione' },
            fr: { yourPhotos:'Vos Photos', photo:'photo', photos:'photos', downloadAll:'Télécharger', browseIndividually:'Voir les photos', browseOnly:'Voir les photos', ready:'Vos photos sont prêtes', notFoundTitle:'Galerie Introuvable', notFoundText:'Cette galerie a peut-être été supprimée ou le lien est incorrect.', backToCollection:'← Retour à la collection' }
        };

        function getLocale() {
            const lang = (navigator.language || navigator.userLanguage || 'en').split('-')[0].toLowerCase();
            return ['pt','es','it','fr'].includes(lang) ? lang : 'en';
        }

        const locale = getLocale();
        const t = translations[locale];
        document.documentElement.lang = locale;
        document.getElementById('downloadAllText').textContent = t.downloadAll;
        document.getElementById('browseText').textContent = t.browseIndividually;
        document.getElementById('notFoundTitle').textContent = t.notFoundTitle;
        document.getElementById('notFoundText').textContent = t.notFoundText;
        document.getElementById('eyebrowText').textContent = t.ready;

        applyTheme();

        function formatBytes(b) {
            if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
            if (b >= 1048576)    return (b / 1048576).toFixed(0) + ' MB';
            return (b / 1024).toFixed(0) + ' KB';
        }

        const galleryId = window.location.pathname.split('/').pop();
        const fromCollection = new URLSearchParams(window.location.search).get('from');

        async function loadGallery() {
            try {
                const res = await fetch(`/api/gallery/${galleryId}/info`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();

                document.getElementById('content').classList.add('visible');

                const title = (data.eventName && data.eventName !== 'Untitled Event') ? data.eventName : t.yourPhotos;
                document.getElementById('eventTitle').textContent = title;
                document.title = title;

                const count = data.fileCount;
                document.getElementById('photoCount').textContent = `${count} ${count === 1 ? t.photo : t.photos}`;
                document.getElementById('downloadBtn').href = `/api/gallery/${galleryId}/download`;

                if (data.downloadsEnabled === false) {
                    document.getElementById('downloadBtn').style.display = 'none';
                } else if (data.totalSizeBytes) {
                    const sizeLabel = formatBytes(data.totalSizeBytes);
                    document.getElementById('downloadAllText').textContent = `${t.downloadAll} · ${sizeLabel}`;
                }

                const previewHref = fromCollection
                    ? `/preview/${galleryId}?from=${encodeURIComponent(fromCollection)}`
                    : `/preview/${galleryId}`;
                document.getElementById('previewLink').href = previewHref;

                if (fromCollection) {
                    const btn = document.getElementById('backToCollectionBtn');
                    btn.href = `/collection/${encodeURIComponent(fromCollection)}`;
                    document.getElementById('backToCollectionText').textContent = t.backToCollection;
                    btn.style.display = 'inline-flex';
                }

                if (data.background) {
                    const bgImg = document.getElementById('bgImage');
                    bgImg.onload = () => bgImg.classList.add('loaded');
                    bgImg.src = `/api/gallery/${galleryId}/background`;
                }
            } catch (err) {
                document.getElementById('notFound').classList.add('active');
            }
        }

        loadGallery();

        document.addEventListener('contextmenu', (e) => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });

        renderSocialFooter();
    </script>
</body>
</html>
