<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fraunces:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:      #0a0a0b;
            --border:  #1e1e21;
            --text:    #f2f2f4;
            --muted:   #9898a2;
            --subtle:  #2a2a2e;
            --accent:  #c9a962;
            --accent-h:#dfc07a;
        }
        html.light {
            --bg:      #f5f4f0;
            --border:  #dddbd6;
            --text:    #000000;
            --muted:   #1c1c1c;
            --subtle:  #e8e6e1;
            --accent:  #c9a962;
            --accent-h:#dfc07a;
        }

        html, body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Instrument Sans', -apple-system, sans-serif;
            min-height: 100%;
        }

        /* Background */
        .bg-image {
            position: fixed; inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0; transition: opacity 1.2s ease;
            z-index: 0;
        }
        .bg-image.loaded { opacity: 0.2; }
        html.light .bg-image.loaded { opacity: 0.35; }
        .bg-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(10,10,11,0.15) 0%, rgba(10,10,11,0.6) 100%);
            z-index: 1;
        }
        html.light .bg-overlay { background: rgba(245,244,240,0.35); }

        /* Header */
        .site-header {
            position: relative; z-index: 10;
            padding: 24px 32px;
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: center;
        }
        .site-header img.logo {
            display: inline-block;
            height: auto; max-height: 80px;
            max-width: min(320px, 70vw);
            width: auto; object-fit: contain;
        }

        /* Hero */
        .hero-section {
            position: relative; z-index: 10;
            text-align: center;
            padding: 48px 24px 32px;
        }
        .eyebrow {
            font-size: 11px; letter-spacing: 0.18em;
            text-transform: uppercase; color: var(--accent);
            margin-bottom: 14px; font-weight: 600;
        }
        html.light .eyebrow { color: #6b4e10; }
        h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.8rem, 4vw, 2.8rem);
            font-weight: 300; letter-spacing: -0.01em;
            line-height: 1.15; margin-bottom: 10px;
        }
        .hero-meta {
            font-size: 13px; color: var(--muted);
            letter-spacing: 0.04em; margin-bottom: 28px;
        }
        .csv-btn {
            display: inline-flex; align-items: center; gap: 7px;
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
            text-decoration: none;
            border-radius: 4px;
            padding: 9px 18px;
            font-size: 12px; font-weight: 500;
            letter-spacing: 0.05em; text-transform: uppercase;
            transition: border-color 0.2s, color 0.2s;
        }
        .csv-btn:hover { border-color: var(--accent); color: var(--accent); }
        .csv-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

        /* Gallery */
        .gallery-container {
            position: relative; z-index: 10;
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px 24px 100px;
        }
        @media (max-width: 600px) {
            .gallery-container { padding: 12px 12px 100px; }
        }

        .gallery-row {
            display: flex;
            gap: 6px;
            margin-bottom: 6px;
        }

        .photo-card {
            position: relative;
            overflow: hidden;
            background: var(--subtle);
            flex-shrink: 0;
            cursor: default;
        }
        .photo-card img {
            display: block;
            width: 100%; height: 100%;
            object-fit: cover;
            transition: opacity 0.3s;
            opacity: 0;
        }
        .photo-card img.loaded { opacity: 1; }

        /* Rank badge */
        .rank-badge {
            position: absolute;
            top: 8px; left: 8px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 13px; font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 3px 9px;
            border-radius: 3px;
            line-height: 1.5;
            pointer-events: none;
            z-index: 2;
        }
        .rank-badge.gold {
            background: var(--accent);
            color: #0a0a0b;
        }
        .rank-badge.silver {
            background: rgba(180,180,190,0.85);
            color: #0a0a0b;
        }
        .rank-badge.bronze {
            background: rgba(180,120,60,0.85);
            color: #fff;
        }

        /* Vote badge */
        .vote-badge {
            position: absolute;
            bottom: 7px; right: 8px;
            background: rgba(0,0,0,0.55);
            backdrop-filter: blur(4px);
            color: rgba(255,255,255,0.9);
            font-size: 10px; font-weight: 600;
            padding: 2px 7px;
            border-radius: 3px;
            line-height: 1.5;
            pointer-events: none;
            z-index: 2;
        }

        /* Empty / loading */
        .state-msg {
            position: relative; z-index: 10;
            text-align: center;
            padding: 60px 24px;
            color: var(--muted);
            font-size: 15px;
        }

        /* Social footer */
        .social-footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 90;
            padding: 12px 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            background: rgba(10,10,11,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        html.light .social-footer { background: rgba(245,244,240,0.85); }
        .social-footer-links {
            display: flex; align-items: center; justify-content: center; gap: 20px;
        }
        .social-footer-links a { color: var(--muted); display: flex; transition: color 0.2s; }
        .social-footer-links a:hover { color: var(--accent); }
        .social-footer-links svg { width: 18px; height: 18px; fill: currentColor; }
    </style>
</head>
<body>
    <img class="bg-image" id="bgImage">
    <div class="bg-overlay"></div>

    <header class="site-header">
        <img src="/api/logo" alt="Logo" class="logo">
    </header>

    <section class="hero-section" id="heroSection" style="display:none">
        <div class="eyebrow">Client Favorites</div>
        <h1 id="eventTitle"></h1>
        <div class="hero-meta" id="heroMeta"></div>
        <a class="csv-btn" id="csvBtn" href="#" download>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Export CSV
        </a>
    </section>

    <div class="gallery-container" id="galleryContainer" style="display:none">
        <div id="galleryGrid"></div>
    </div>

    <div class="state-msg" id="stateMsg">Loading…</div>

    <footer class="social-footer" id="socialFooter"></footer>

    <script src="/shared.js"></script>
    <script>
        const galleryId = window.location.pathname.split('/').pop();


        // Justified row layout
        function buildRows(photoList, containerWidth, targetHeight, gap) {
            const rows = [];
            let current = [], sumRatio = 0;
            for (const p of photoList) {
                const ratio = (p.width && p.height) ? p.width / p.height : 4 / 3;
                current.push({ photo: p, ratio });
                sumRatio += ratio;
                const gapsWidth = gap * (current.length - 1);
                if (sumRatio * targetHeight + gapsWidth >= containerWidth) {
                    rows.push({ items: current, height: (containerWidth - gapsWidth) / sumRatio });
                    current = []; sumRatio = 0;
                }
            }
            if (current.length) rows.push({ items: current, height: targetHeight });
            return rows;
        }

        function getTargetHeight() {
            const w = window.innerWidth;
            if (w <= 480) return 140;
            if (w <= 900) return 200;
            if (w <= 1400) return 260;
            return 300;
        }

        let _lastPhotos = [];
        function renderGallery(photos) {
            _lastPhotos = photos;
            const grid = document.getElementById('galleryGrid');
            const containerWidth = grid.clientWidth;
            if (!containerWidth) return;

            const gap = 6;
            const targetH = getTargetHeight();
            const rows = buildRows(photos, containerWidth, targetH, gap);

            grid.innerHTML = '';
            let photoIndex = 0;
            rows.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'gallery-row';
                rowEl.style.height = Math.round(row.height) + 'px';

                row.items.forEach(({ photo, ratio }) => {
                    const rank = ++photoIndex;
                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.style.width = Math.round(row.height * ratio) + 'px';
                    card.style.height = Math.round(row.height) + 'px';

                    const badgeClass = rank === 1 ? 'rank-badge gold' : rank === 2 ? 'rank-badge silver' : rank === 3 ? 'rank-badge bronze' : 'rank-badge';

                    const img = document.createElement('img');
                    img.src = photo.thumbnailUrl;
                    img.alt = '';
                    img.loading = 'lazy';
                    img.onload = () => img.classList.add('loaded');

                    card.innerHTML = `<span class="${badgeClass}"># ${rank}</span>
                        <span class="vote-badge">♥ ${photo.votes}</span>`;
                    card.prepend(img);
                    rowEl.appendChild(card);
                });
                grid.appendChild(rowEl);
            });
        }

        async function loadFavorites() {
            try {
                const res = await fetch(`/api/gallery/${galleryId}/favorites-ranked`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();

                document.getElementById('stateMsg').style.display = 'none';
                document.title = `${data.eventName} — Favorites`;
                document.getElementById('eventTitle').textContent = data.eventName;

                const n = data.photos.length;
                document.getElementById('heroMeta').textContent =
                    `${n} favorite photo${n !== 1 ? 's' : ''}, ranked by votes`;
                document.getElementById('csvBtn').href = data.csvUrl;
                document.getElementById('heroSection').style.display = 'block';

                if (data.background) {
                    const bg = document.getElementById('bgImage');
                    bg.onload = () => bg.classList.add('loaded');
                    bg.src = `${data.background}?card=1`;
                }

                if (n === 0) {
                    document.getElementById('stateMsg').textContent = 'No favorites yet.';
                    document.getElementById('stateMsg').style.display = 'block';
                    return;
                }

                document.getElementById('galleryContainer').style.display = 'block';
                renderGallery(data.photos);

            } catch (err) {
                document.getElementById('stateMsg').textContent = 'This page is not available.';
            }
        }

        window.addEventListener('resize', () => {
            if (_lastPhotos.length) renderGallery(_lastPhotos);
        });

        document.addEventListener('contextmenu', e => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });


        applyTheme();
        loadFavorites();
        renderSocialFooter();
    </script>
</body>
</html>
