        applyTheme();

        // This document serves BOTH /preview/:id and /collection/:id. In collection
        // mode it renders the collection index itself and mounts galleries in place
        // on #/gallery/:id — so the audio montage below is never torn down by a
        // navigation, which a separate collection page could not achieve.
        const _pathSegments = window.location.pathname.split('/').filter(Boolean);
        const _isCollectionMode = _pathSegments[0] === 'collection';
        const collectionId = _isCollectionMode ? _pathSegments[1] : null;

        const _params = new URLSearchParams(window.location.search);
        // Still honoured for a gallery opened by direct link from a collection.
        const fromCollection = _params.get('from');
        const critiqueMode = _params.get('critique') === '1';

        // Mutable: reassigned each time a gallery is mounted in collection mode.
        let galleryId = _isCollectionMode ? null : _pathSegments[_pathSegments.length - 1];
        let photos = [];
        let currentPhotoIndex = 0;
        let _collectionData = null;

        // ── VIDEO HELPERS ──
        const VIDEO_EXTENSIONS = ['mp4', 'mov', 'webm', 'm4v'];
        function isVideoPhoto(photo) {
            if (photo.type) return photo.type === 'video';
            const ext = (photo.filename.split('.').pop() || '').toLowerCase();
            return VIDEO_EXTENSIONS.includes(ext);
        }
        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        // Visitor identity — persisted in localStorage, shared across all galleries
        function getVisitorId() {
            let id = localStorage.getItem('delyvr_visitor_id');
            if (!id) {
                id = 'v-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
                localStorage.setItem('delyvr_visitor_id', id);
            }
            return id;
        }
        const visitorId = getVisitorId();

        // Commenter display name — separate from visitorId, optional, self-declared
        function getCommenterName() {
            return localStorage.getItem('delyvr_commenter_name') || '';
        }
        function setCommenterName(name) {
            if (name) localStorage.setItem('delyvr_commenter_name', name);
            else localStorage.removeItem('delyvr_commenter_name');
        }

        // Favorites state — only this visitor's favorites
        let localFavorites = new Set();
        let commentsEnabled = true;

        let _toastTimer = null;
        function showToast(message) {
            const el = document.getElementById('favToast');
            if (!el) return;
            el.textContent = message;
            el.classList.add('visible');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('visible'), 2000);
        }
        function showFavToast(added) {
            showToast(added ? t.favAdded : t.favRemoved);
        }

        async function toggleFavorite(filename) {
            const wasFavorited = localFavorites.has(filename);
            // Optimistic update
            if (wasFavorited) { localFavorites.delete(filename); } else { localFavorites.add(filename); }
            showFavToast(!wasFavorited);

            // Update card button
            const btn = document.querySelector(`.photo-favorite[data-filename="${CSS.escape(filename)}"]`);
            if (btn) {
                btn.classList.toggle('favorited', !wasFavorited);
            }

            // Update lightbox button if same photo is open
            if (photos[currentPhotoIndex] && photos[currentPhotoIndex].filename === filename) {
                const favBtn = document.getElementById('lightboxFavorite');
                favBtn.classList.toggle('favorited', !wasFavorited);
                favBtn.querySelector('svg').setAttribute('fill', wasFavorited ? 'none' : 'white');
                // Sync mobile bar fav button
                const mobileBarFav = document.getElementById('lbMobileFav');
                if (mobileBarFav) {
                    mobileBarFav.classList.toggle('favorited', !wasFavorited);
                    mobileBarFav.querySelector('svg').setAttribute('fill', wasFavorited ? 'none' : '#dc3250');
                }
            }

            // Sync to server
            try {
                await fetch(`/api/gallery/${galleryId}/favorites`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, visitorId })
                });
            } catch (e) {
                // Revert on network error
                if (wasFavorited) { localFavorites.add(filename); } else { localFavorites.delete(filename); }
                if (btn) {
                    btn.classList.toggle('favorited', wasFavorited);
                }
            }
        }

        function toggleFavoriteFromLightbox() {
            const photo = photos[currentPhotoIndex];
            if (photo) toggleFavorite(photo.filename);
        }

        // ── COMMENTS ──
        let _commentDrawerFilename = null;
        let _commentDrawerComments = [];

        function setCommentButtonsVisible(visible) {
            const display = visible ? '' : 'none';
            document.getElementById('lightboxCommentBtn').style.display = display;
            const mobileBtn = document.getElementById('lbMobileComment');
            if (mobileBtn) mobileBtn.style.display = display;
        }

        function updateCommentButtonBadges(count) {
            [document.getElementById('lightboxCommentCount'), document.getElementById('lbMobileCommentCount')].forEach(el => {
                if (!el) return;
                el.textContent = count > 0 ? (count > 99 ? '99+' : String(count)) : '';
                el.classList.toggle('visible', count > 0);
            });
        }

        // Updates the grid badge, the lightbox button badge (if viewing this photo),
        // and the in-memory photos[] cache so subsequent re-renders stay correct.
        function updateCommentBadge(filename, count) {
            const photo = photos.find(p => p.filename === filename);
            if (photo) photo.commentCount = count;

            const card = document.querySelector(`.photo-card[data-filename="${CSS.escape(filename)}"]`);
            if (card) {
                let badge = card.querySelector('.comment-count-badge');
                if (count > 0) {
                    if (!badge) {
                        badge = document.createElement('div');
                        badge.className = 'comment-count-badge';
                        badge.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span></span>';
                        card.appendChild(badge);
                    }
                    badge.querySelector('span').textContent = count;
                } else if (badge) {
                    badge.remove();
                }
            }

            if (photos[currentPhotoIndex] && photos[currentPhotoIndex].filename === filename) {
                updateCommentButtonBadges(count);
            }
        }

        function formatRelativeTime(iso) {
            const diffMs = Date.now() - new Date(iso).getTime();
            const mins = Math.floor(diffMs / 60000);
            if (mins < 1) return locale === 'fr' ? 'À l\'instant' : 'Just now';
            if (mins < 60) return `${mins}m`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d`;
            return new Date(iso).toLocaleDateString(locale);
        }

        // Built via textContent only — comment text/name are free-form user input,
        // never inserted as innerHTML.
        function renderCommentRow(c) {
            const row = document.createElement('div');
            row.className = 'comment-row';
            const head = document.createElement('div');
            head.className = 'comment-row-head';
            const nameEl = document.createElement('span');
            nameEl.className = 'comment-row-name';
            nameEl.textContent = c.name || t.commentGuest;
            const timeEl = document.createElement('span');
            timeEl.className = 'comment-row-time';
            timeEl.textContent = formatRelativeTime(c.createdAt);
            head.appendChild(nameEl);
            head.appendChild(timeEl);
            const textEl = document.createElement('div');
            textEl.className = 'comment-row-text';
            textEl.textContent = c.text;
            row.appendChild(head);
            row.appendChild(textEl);
            return row;
        }

        function refreshCommentNameUI() {
            const name = getCommenterName();
            const asRow = document.getElementById('commentAsRow');
            const nameInput = document.getElementById('commentNameInput');
            if (name) {
                document.getElementById('commentAsText').textContent = name;
                asRow.style.display = 'flex';
                nameInput.style.display = 'none';
            } else {
                asRow.style.display = 'none';
                nameInput.style.display = '';
            }
        }
        document.getElementById('commentChangeNameBtn').addEventListener('click', () => {
            document.getElementById('commentAsRow').style.display = 'none';
            const nameInput = document.getElementById('commentNameInput');
            nameInput.style.display = '';
            nameInput.value = getCommenterName();
            nameInput.focus();
        });
        document.getElementById('commentTextInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitComment();
            }
        });

        // Drawer geometry. The photo is NEVER resized when the drawer opens:
        // the lightbox reserves no space, the content is shifted left instead.
        const DRAWER_WIDTH = 300;
        const DRAWER_SHIFT = DRAWER_WIDTH / 2; // re-centres content in the space left over

        function isDrawerMobile() {
            return window.matchMedia('(max-width: 768px), (max-height: 500px)').matches;
        }

        // Shifts .lightbox-content left so the drawer doesn't sit on top of the
        // photo — without touching its size (a transform doesn't affect layout).
        // Clamped to the free margin actually available on the left, otherwise a
        // very wide photo would be pushed off the left edge of the screen.
        function updateDrawerShift() {
            const content = document.querySelector('.lightbox-content');
            if (!content) return;
            const open = document.getElementById('lightbox').classList.contains('drawer-open');
            content.style.transform = '';               // measure untransformed
            if (!open || isDrawerMobile()) return;
            const left = content.getBoundingClientRect().left;
            const shift = Math.min(DRAWER_SHIFT, Math.max(0, left));
            if (shift > 0) content.style.transform = `translateX(-${shift}px)`;
        }

        function openCommentDrawer() {
            if (!commentsEnabled) return;
            const photo = photos[currentPhotoIndex];
            if (!photo) return;
            _commentDrawerFilename = photo.filename;
            document.getElementById('commentDrawer').classList.add('open');
            // Backdrop on mobile only — on desktop it would dim the very photo
            // we are keeping visible next to the thread.
            if (isDrawerMobile()) document.getElementById('commentDrawerBackdrop').classList.add('open');
            document.getElementById('lightbox').classList.add('drawer-open');
            updateDrawerShift();
            refreshCommentNameUI();
            loadCommentsForCurrentPhoto();
        }

        function closeCommentDrawer() {
            document.getElementById('commentDrawer').classList.remove('open');
            document.getElementById('commentDrawerBackdrop').classList.remove('open');
            document.getElementById('lightbox').classList.remove('drawer-open');
            updateDrawerShift();
        }

        // Recompute the shift whenever the content box changes size — covers the
        // async preview load, switching photos and window resizes in one place.
        // A transform doesn't alter the observed box, so this can't loop.
        if (window.ResizeObserver) {
            const _lbContent = document.querySelector('.lightbox-content');
            if (_lbContent) new ResizeObserver(() => updateDrawerShift()).observe(_lbContent);
        }

        function renderCommentDrawerList() {
            const list = document.getElementById('commentDrawerList');
            list.innerHTML = '';
            document.getElementById('commentDrawerTitle').textContent = `${t.comments} (${_commentDrawerComments.length})`;
            if (_commentDrawerComments.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'comment-empty';
                empty.textContent = t.commentEmpty;
                list.appendChild(empty);
                return;
            }
            _commentDrawerComments.forEach(c => list.appendChild(renderCommentRow(c)));
            list.scrollTop = list.scrollHeight;
        }

        async function loadCommentsForCurrentPhoto() {
            const filename = _commentDrawerFilename;
            try {
                const res = await fetch(`/api/gallery/${galleryId}/comments-public?filename=${encodeURIComponent(filename)}`);
                const json = res.ok ? await res.json() : { comments: [] };
                if (_commentDrawerFilename !== filename) return; // navigated away while loading
                _commentDrawerComments = json.comments || [];
            } catch (e) {
                if (_commentDrawerFilename !== filename) return;
                _commentDrawerComments = [];
            }
            renderCommentDrawerList();
        }

        async function submitComment() {
            const textInput = document.getElementById('commentTextInput');
            const text = textInput.value.trim();
            if (!text || !_commentDrawerFilename) return;
            const filename = _commentDrawerFilename;
            const nameInput = document.getElementById('commentNameInput');
            const name = (nameInput.style.display !== 'none' ? nameInput.value.trim() : getCommenterName()) || '';

            const optimistic = { id: 'tmp-' + Date.now(), name: name || null, text, createdAt: new Date().toISOString() };
            _commentDrawerComments.push(optimistic);
            renderCommentDrawerList();
            textInput.value = '';
            updateCommentBadge(filename, _commentDrawerComments.length);

            try {
                const res = await fetch(`/api/gallery/${galleryId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, visitorId, name, text })
                });
                if (!res.ok) throw new Error('failed');
                const json = await res.json();
                const idx = _commentDrawerComments.findIndex(c => c.id === optimistic.id);
                if (idx !== -1 && json.comment) _commentDrawerComments[idx] = json.comment;
                if (_commentDrawerFilename === filename) renderCommentDrawerList();
                if (name) { setCommenterName(name); refreshCommentNameUI(); }
                showToast(t.commentPosted);
            } catch (e) {
                _commentDrawerComments = _commentDrawerComments.filter(c => c.id !== optimistic.id);
                if (_commentDrawerFilename === filename) renderCommentDrawerList();
                updateCommentBadge(filename, _commentDrawerComments.length);
                showToast(t.commentError);
            }
        }

        // Switching galleries in collection mode reuses this same document, so
        // anything the previous gallery hid or left open has to be put back
        // explicitly. The window/document listeners are attached once and read
        // module state, so they are deliberately NOT re-attached here — doing so
        // would stack a new handler per gallery.
        function resetGalleryViewState() {
            photos = [];
            currentPhotoIndex = 0;
            localFavorites = new Set();
            _commentDrawerFilename = null;
            _commentDrawerComments = [];
            closeLightbox();
            resetZoom();
            closeCommentDrawer();
            document.getElementById('notFound').classList.remove('active');
            document.getElementById('loadingState').style.display = '';
            document.getElementById('galleryGrid').innerHTML = '';
            const heroBg = document.getElementById('heroBg');
            heroBg.classList.remove('loaded');
            heroBg.removeAttribute('src');
            // A previous gallery with downloads disabled hid these — restore them,
            // the new gallery decides for itself below.
            ['downloadAllBtn', 'lightboxDownload', 'lbMobileDownload'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = '';
            });
            window.scrollTo(0, 0);
        }

        async function loadGallery() {
            resetGalleryViewState();
            try {
                // Get gallery info
                const infoRes = await fetch(`/api/gallery/${galleryId}/info`);
                if (!infoRes.ok) throw new Error('Not found');
                const info = await infoRes.json();

                // Finalize locale from the gallery's resolved client language
                locale = resolveClientLocale(info.clientLanguage);
                t = translations[locale];
                applyStaticTranslations();

                // Get photos list
                const photosRes = await fetch(`/api/gallery/${galleryId}/photos`);
                if (!photosRes.ok) throw new Error('Failed to load photos');
                const data = await photosRes.json();
                
                photos = data.photos;
                commentsEnabled = data.commentsEnabled !== false;
                setCommentButtonsVisible(commentsEnabled);

                // Hide loading, show content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('heroSection').style.display = 'flex';
                document.getElementById('actionsBar').style.display = 'flex';
                placeAudioButton(); // hero/bar exist now — dock the control into them

                // Critique mode indicator
                if (critiqueMode) {
                    document.getElementById('critiqueIndicator').style.display = 'inline-flex';
                }

                // Back to collection. In collection mode this is a hash change, not a
                // navigation — the document (and the montage) must stay alive.
                if (_isCollectionMode || fromCollection) {
                    const backBtn = document.getElementById('backToCollection');
                    backBtn.href = _isCollectionMode
                        ? '#'
                        : `/collection/${fromCollection}${critiqueMode ? '?critique=1' : ''}`;
                    document.getElementById('backToCollectionText').textContent = t.backToCollection;
                    backBtn.style.display = 'inline-flex';
                }
                document.getElementById('galleryContainer').style.display = 'block';

                // Set title
                const title = (info.eventName && info.eventName !== 'Untitled Event') 
                    ? info.eventName 
                    : t.yourPhotos;
                document.getElementById('eventTitle').textContent = title;
                document.title = title;

                // Set download all button
                document.getElementById('downloadAllBtn').href = `/api/gallery/${galleryId}/download`;

                // Hide download controls if downloads are disabled
                const downloadsEnabled = info.downloadsEnabled !== false;
                if (!downloadsEnabled) {
                    document.getElementById('downloadAllBtn').style.display = 'none';
                    document.getElementById('lightboxDownload').style.display = 'none';
                    const mobileBarDl = document.getElementById('lbMobileDownload');
                    if (mobileBarDl) mobileBarDl.style.display = 'none';
                }

                // Load background
                if (info.background) {
                    const heroBg = document.getElementById('heroBg');
                    heroBg.onload = () => heroBg.classList.add('loaded');
                    heroBg.src = `/api/gallery/${galleryId}/background`;
                }

                // Load this visitor's favorites from server
                try {
                    const favRes = await fetch(`/api/gallery/${galleryId}/favorites-public?visitorId=${encodeURIComponent(visitorId)}`);
                    if (favRes.ok) {
                        const favData = await favRes.json();
                        localFavorites = new Set(favData.favorites || []);
                    } else if (favRes.status === 404) {
                        // Gallery deleted — clean up localStorage
                        localStorage.removeItem('delyvr_visitor_id');
                    }
                } catch (e) { /* non-blocking */ }

                // Montage precedence: a collection that has its own track owns the
                // soundtrack and must not be interrupted when a gallery opens. Only
                // when it has none does the gallery's own montage play — which is
                // also the case for a gallery opened on its own.
                if (!collectionOwnsMontage()) {
                    setMontage(info.audio, info.eventName, `/api/gallery/${galleryId}/background?card=1`);
                }

                // Render gallery
                renderGallery(downloadsEnabled);

            } catch (err) {
                console.error(err);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('notFound').classList.add('active');
            }
        }

        // Track downloadsEnabled for resize re-renders
        let _lastDownloadsEnabled = true;

        function getColCount() {
            const w = window.innerWidth;
            if (w >= 1400) return 4;
            if (w >= 900)  return 3;
            if (w >= 560)  return 2;
            return 1;
        }

        function getTargetRowHeight() {
            const w = window.innerWidth;
            if (w <= 480) return 140;
            if (w <= 900) return 180;
            if (w <= 1400) return 240;
            return 280;
        }

        function getRowGap() {
            const w = window.innerWidth;
            if (w <= 480) return 2;
            if (w <= 900) return 4;
            return 10;
        }

        // Build rows: greedily add photos until summed aspect ratio exceeds
        // what fits at target height, then scale the row height so the total
        // width matches the container (minus the internal gaps).
        function buildRows(photoList, containerWidth, targetHeight, gap) {
            const rows = [];
            let current = [];
            let sumRatio = 0;

            for (const p of photoList) {
                const w = p.width || 4;
                const h = p.height || 3;
                const ratio = w / h;
                current.push({ photo: p, ratio });
                sumRatio += ratio;

                const gapsWidth = gap * (current.length - 1);
                const rowWidthAtTarget = sumRatio * targetHeight + gapsWidth;

                if (rowWidthAtTarget >= containerWidth) {
                    // Scale to fit container exactly
                    const scaledHeight = (containerWidth - gapsWidth) / sumRatio;
                    rows.push({ items: current, height: scaledHeight });
                    current = [];
                    sumRatio = 0;
                }
            }

            // Last partial row: keep target height (don't stretch widows)
            if (current.length > 0) {
                rows.push({ items: current, height: targetHeight });
            }

            return rows;
        }

        function renderGallery(downloadsEnabled = true) {
            _lastDownloadsEnabled = downloadsEnabled;
            const grid = document.getElementById('galleryGrid');

            const container = document.getElementById('galleryContainer');
            // Use the container's client width (accounts for its padding)
            const style = getComputedStyle(container);
            const padL = parseFloat(style.paddingLeft) || 0;
            const padR = parseFloat(style.paddingRight) || 0;
            const containerWidth = container.clientWidth - padL - padR;

            grid.innerHTML = '';

            const targetHeight = getTargetRowHeight();
            const gap = getRowGap();
            const rows = buildRows(photos, containerWidth, targetHeight, gap);

            let photoIndex = 0;
            rows.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'gallery-row';
                rowEl.style.height = row.height + 'px';

                row.items.forEach(({ photo, ratio }) => {
                    const index = photoIndex++;
                    const isFav = localFavorites.has(photo.filename);

                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.dataset.filename = photo.filename;
                    card.style.width = (row.height * ratio) + 'px';
                    card.style.height = row.height + 'px';
                    card.onclick = () => openLightbox(index);

                    const favClass = isFav ? 'favorited' : '';
                    const downloadBtn = downloadsEnabled ? `
                            <a class="photo-download" href="/api/gallery/${galleryId}/download/${encodeURIComponent(photo.filename)}" onclick="event.stopPropagation();" download>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>` : '';

                    const isVideo = isVideoPhoto(photo);
                    const mediaExtra = isVideo
                        ? `<div class="video-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
                           ${photo.duration ? `<span class="video-duration">${formatDuration(photo.duration)}</span>` : ''}`
                        : (photo.animated ? `<span class="gif-badge">GIF</span>` : '');
                    const commentBadge = (photo.commentCount > 0) ? `
                        <div class="comment-count-badge">
                            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
                            ${photo.commentCount}
                        </div>` : '';

                    card.innerHTML = `
                        <div class="loading"></div>
                        <img data-src="${photo.thumbnailUrl}" alt="">
                        ${mediaExtra}
                        ${commentBadge}
                        ${critiqueMode ? `<span class="photo-number">${index + 1}</span>` : ''}
                        <div class="photo-overlay">
                            <span class="photo-name"></span>
                            <button class="photo-favorite ${favClass}" data-filename="" data-index="${index}" aria-label="Add to favorites">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            ${downloadBtn}
                        </div>`;

                    card.querySelector('.photo-name').textContent = photo.filename;
                    const favBtn = card.querySelector('.photo-favorite');
                    favBtn.dataset.filename = photo.filename;
                    favBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleFavorite(favBtn.dataset.filename);
                    });

                    const img = card.querySelector('img');
                    img.onload = function() {
                        this.classList.add('loaded');
                        const loader = this.previousElementSibling;
                        if (loader) loader.style.display = 'none';
                    };

                    rowEl.appendChild(card);
                });

                grid.appendChild(rowEl);
            });

            lazyLoadImages();
        }

        // Re-layout on resize (debounced) — only when width actually changes,
        // since the justified grid only depends on width, but mobile browsers
        // also fire resize when the address bar collapses/expands on scroll
        // (height-only change).
        let _resizeTimer = null;
        let _lastGalleryWidth = window.innerWidth;
        window.addEventListener('resize', () => {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(() => {
                if (window.innerWidth === _lastGalleryWidth) return;
                _lastGalleryWidth = window.innerWidth;
                if (photos && photos.length > 0) {
                    renderGallery(_lastDownloadsEnabled);
                }
            }, 150);
        });

        function lazyLoadImages() {
            const images = document.querySelectorAll('.photo-card img[data-src]');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: '200px' });

            images.forEach(img => observer.observe(img));
        }

        // Le rappel clavier se replie dans l'icône clavier persistante après un
        // court instant — sur petit écran (13") il chevauche sinon la photo en
        // permanence. L'icône reste cliquable pour le faire réapparaître.
        let _kbHintTimer = null;
        function showKbHint() {
            clearTimeout(_kbHintTimer);
            document.getElementById('kbHint').classList.remove('folded');
            _kbHintTimer = setTimeout(foldKbHint, 4000);
        }
        function foldKbHint() {
            clearTimeout(_kbHintTimer);
            document.getElementById('kbHint').classList.add('folded');
            const btn = document.getElementById('kbToggleBtn');
            btn.classList.remove('pulse');
            requestAnimationFrame(() => btn.classList.add('pulse'));
            setTimeout(() => btn.classList.remove('pulse'), 600);
        }
        function toggleKbHint() {
            const folded = document.getElementById('kbHint').classList.contains('folded');
            if (folded) showKbHint(); else foldKbHint();
        }

        let _socialHintTimer = null;
        function showSocialHint() {
            clearTimeout(_socialHintTimer);
            document.getElementById('lightboxSocialLinks').classList.remove('folded');
            _socialHintTimer = setTimeout(foldSocialHint, 4000);
        }
        function foldSocialHint() {
            clearTimeout(_socialHintTimer);
            document.getElementById('lightboxSocialLinks').classList.add('folded');
            const btn = document.getElementById('lightboxSocialToggleBtn');
            btn.classList.remove('pulse');
            requestAnimationFrame(() => btn.classList.add('pulse'));
            setTimeout(() => btn.classList.remove('pulse'), 600);
        }
        function toggleSocialWidget() {
            const folded = document.getElementById('lightboxSocialLinks').classList.contains('folded');
            if (folded) showSocialHint(); else foldSocialHint();
        }
        function populateLightboxSocialLinks() {
            const widget = document.getElementById('lightboxSocialWidget');
            const target = document.getElementById('lightboxSocialLinks');
            const sourceLinks = document.querySelector('#socialFooter .social-footer-links');
            if (!sourceLinks || sourceLinks.children.length === 0) {
                widget.style.display = 'none';
                return;
            }
            target.innerHTML = sourceLinks.innerHTML;
            widget.style.display = 'flex';
            if (_isMobileLB()) {
                target.classList.add('folded');
            } else {
                showSocialHint();
            }
        }

        function openLightbox(index) {
            currentPhotoIndex = index;
            if (typeof resetZoom === 'function') resetZoom();
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
            placeAudioButton(); // move the control inside .lightbox (survives fullscreen)
            showKbHint();
            populateLightboxSocialLinks();
            // Mobile : initialiser les dots et afficher l'overlay
            if (window.innerWidth <= 768) {
                buildDots();
                showLbBars();
                scheduleLbHide();
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
            const videoEl = document.getElementById('lightboxVideo');
            if (videoEl) videoEl.pause();
            closeCommentDrawer();
            if (typeof resetZoom === 'function') resetZoom();
            clearTimeout(_kbHintTimer);
            clearTimeout(_socialHintTimer);
            // Quitter le plein écran si actif
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            clearTimeout(_lbHideTimer);
            placeAudioButton(); // back to the page chrome
        }

        function navigateLightbox(direction) {
            currentPhotoIndex += direction;
            if (currentPhotoIndex < 0) currentPhotoIndex = photos.length - 1;
            if (currentPhotoIndex >= photos.length) currentPhotoIndex = 0;
            if (typeof resetZoom === 'function') resetZoom();
            // Animation slide sur mobile
            if (window.innerWidth <= 768) {
                const img = document.getElementById('lightboxImg');
                const cls = direction > 0 ? 'slide-left' : 'slide-right';
                img.classList.remove('slide-left', 'slide-right');
                void img.offsetWidth; // reflow
                img.classList.add(cls);
                setTimeout(() => img.classList.remove(cls), 250);
                updateDots();
            }
            updateLightbox();
            // Réafficher les barres brièvement après navigation
            if (window.innerWidth <= 768) {
                showLbBars();
                scheduleLbHide();
            }
        }

        // Preload adjacent previews so navigation feels instant
        function preloadAdjacentPreviews(index) {
            const offsets = [-1, 1];
            offsets.forEach(offset => {
                const i = (index + offset + photos.length) % photos.length;
                if (photos[i] && !isVideoPhoto(photos[i])) {
                    const img = new Image();
                    img.src = photos[i].previewUrl || photos[i].url;
                }
            });
        }

        function updateLightbox() {
            const photo = photos[currentPhotoIndex];
            const downloadUrl = `/api/gallery/${galleryId}/download/${encodeURIComponent(photo.filename)}`;

            // On desktop the drawer is pinned: it stays open across photos (peer
            // critique reading) and simply reloads the new photo's thread. On
            // mobile it still closes on navigation, as before.
            const drawerOpen = document.getElementById('commentDrawer').classList.contains('open');
            if (drawerOpen && !isDrawerMobile()) {
                _commentDrawerFilename = photo.filename;
                loadCommentsForCurrentPhoto();
            } else {
                closeCommentDrawer();
            }
            updateCommentButtonBadges(photo.commentCount || 0);

            if (critiqueMode) {
                const num = document.getElementById('lbCritiqueNum');
                if (num) { num.textContent = `# ${currentPhotoIndex + 1}`; num.style.display = 'block'; }
            }

            const imgEl = document.getElementById('lightboxImg');
            const videoEl = document.getElementById('lightboxVideo');
            if (isVideoPhoto(photo)) {
                imgEl.style.display = 'none';
                imgEl.src = '';
                videoEl.style.display = '';
                videoEl.poster = photo.thumbnailUrl;
                if (!videoEl.src.endsWith(photo.url)) videoEl.src = photo.url;
                videoEl.pause();
            } else {
                videoEl.style.display = 'none';
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load();
                imgEl.style.display = '';
                imgEl.src = photo.previewUrl || photo.url;
            }

            // Preload neighbours in background
            preloadAdjacentPreviews(currentPhotoIndex);

            // Sync mobile overlay elements

            const lbMobileDl = document.getElementById('lbMobileDownload');
            if (lbMobileDl) lbMobileDl.href = `/api/gallery/${galleryId}/download/${encodeURIComponent(photo.filename)}`;

            // Desktop download button
            document.getElementById('lightboxDownload').href = downloadUrl;
            document.getElementById('lightboxDownload').setAttribute('download', photo.filename);

            // Mobile bar download link
            const mobileBarDl = document.getElementById('lbMobileDownload');
            if (mobileBarDl) {
                mobileBarDl.href = downloadUrl;
                mobileBarDl.setAttribute('download', photo.filename);
            }

            // Fav state — desktop button
            const isFav = localFavorites.has(photo.filename);
            const favBtn = document.getElementById('lightboxFavorite');
            favBtn.classList.toggle('favorited', isFav);
            favBtn.querySelector('svg').setAttribute('fill', isFav ? 'white' : 'none');

            // Fav state — mobile bar button
            const mobileBarFav = document.getElementById('lbMobileFav');
            if (mobileBarFav) {
                mobileBarFav.classList.toggle('favorited', isFav);
                mobileBarFav.querySelector('svg').setAttribute('fill', isFav ? '#dc3250' : 'none');
            }
        }

        // Keyboard navigation — capture phase so arrows reach us even when a
        // focused <video> would otherwise intercept them for seeking.
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('active')) return;
            // Let arrow/Escape keys behave normally while typing in the comment drawer
            // (cursor movement, dismissing an IME, etc.) instead of navigating/closing.
            if (e.target.closest('#commentDrawer')) {
                if (e.key === 'Escape') closeCommentDrawer();
                return;
            }
            // Don't hijack browser/OS shortcuts that happen to share these letters (Cmd+F, Ctrl+S, ...).
            if (e.ctrlKey || e.metaKey || e.altKey) return;

            const key = e.key.toLowerCase();
            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
            if (key === 's') toggleFullscreen();
            if (key === 'c') openCommentDrawer();
            if (key === 'f') toggleFavoriteFromLightbox();
            if (key === 'd' && _lastDownloadsEnabled) document.getElementById('lightboxDownload').click();
        }, { capture: true });

        // Close lightbox on background click
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        // ── MOBILE LIGHTBOX — JS pinch-zoom via CSS transform, swipe nav, bars, fullscreen ──
        // Strategy: handle all touch gestures ourselves using CSS transforms on the image.
        // Native visual-viewport zoom is disabled by browsers inside requestFullscreen(),
        // so relying on it breaks pinch-zoom in fullscreen. JS transforms work identically
        // in normal and fullscreen modes.
        const lightbox = document.getElementById('lightbox');

        // Zoom & pan state
        let _zoomScale = 1;
        let _panX = 0, _panY = 0;

        // Touch-gesture tracking
        let _t0StartX = 0, _t0StartY = 0;
        let _panBaseX = 0, _panBaseY = 0;
        let _pinchStartDist = 0, _pinchStartScale = 1;
        let _pinchMidX = 0, _pinchMidY = 0;
        let _isPinching = false, _isPanning = false;
        const MAX_ZOOM = 5;

        // Bar state
        let _lbHideTimer = null;
        let _lbBarsVisible = true;
        let _wasGesture = false;

        function _isMobileLB() {
            return window.matchMedia('(max-width: 768px), (max-height: 500px)').matches;
        }

        function _isZoomed() { return _zoomScale > 1.05; }

        function _applyZoomTransform() {
            const img = document.getElementById('lightboxImg');
            if (!img) return;
            img.style.transform = _isZoomed()
                ? `translate(${_panX}px, ${_panY}px) scale(${_zoomScale})`
                : '';
        }

        function _clampPan() {
            const img = document.getElementById('lightboxImg');
            if (!img) return;
            const cw = img.clientWidth, ch = img.clientHeight;
            const nw = img.naturalWidth || cw, nh = img.naturalHeight || ch;
            const imgAsp = nw / nh, conAsp = cw / ch;
            const rw = imgAsp > conAsp ? cw : ch * imgAsp;
            const rh = imgAsp > conAsp ? cw / imgAsp : ch;
            const maxX = Math.max(0, (rw * _zoomScale - cw) / 2);
            const maxY = Math.max(0, (rh * _zoomScale - ch) / 2);
            _panX = Math.max(-maxX, Math.min(maxX, _panX));
            _panY = Math.max(-maxY, Math.min(maxY, _panY));
        }

        function resetZoom() {
            _zoomScale = 1; _panX = 0; _panY = 0;
            _isPinching = false; _isPanning = false;
            _applyZoomTransform();
        }

        function showLbBars() {
            const top = document.getElementById('lbTopBar');
            const bot = document.getElementById('lbBottomBar');
            const social = document.getElementById('lightboxSocialWidget');
            if (top) top.classList.remove('hidden');
            if (bot) bot.classList.remove('hidden');
            if (social) social.classList.remove('hidden');
            _lbBarsVisible = true;
        }

        function hideLbBars() {
            const top = document.getElementById('lbTopBar');
            const bot = document.getElementById('lbBottomBar');
            const social = document.getElementById('lightboxSocialWidget');
            if (top) top.classList.add('hidden');
            if (bot) bot.classList.add('hidden');
            if (social) social.classList.add('hidden');
            _lbBarsVisible = false;
        }

        function scheduleLbHide() {
            clearTimeout(_lbHideTimer);
            _lbHideTimer = setTimeout(hideLbBars, 3000);
        }

        // Tap sur la zone image : toggle visibilité barres
        lightbox.addEventListener('click', (e) => {
            if (!_isMobileLB()) return;
            if (_wasGesture) { _wasGesture = false; return; }
            if (e.target.closest('#lightboxVideo')) return;
            if (e.target.closest('.lb-top-bar') || e.target.closest('.lb-bottom-bar')) return;
            if (e.target.closest('#lightboxSocialWidget')) return;
            if (e.target.closest('#commentDrawer')) return;
            if (_lbBarsVisible) {
                hideLbBars();
                clearTimeout(_lbHideTimer);
            } else {
                showLbBars();
                scheduleLbHide();
            }
        });

        lightbox.addEventListener('touchstart', (e) => {
            if (!_isMobileLB()) return;
            if (e.target.closest('#commentDrawer')) return;
            const isVideo = isVideoPhoto(photos[currentPhotoIndex]);

            if (!isVideo && e.touches.length === 2) {
                _wasGesture = true;
                _isPinching = true;
                _isPanning = false;
                _pinchStartDist = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
                _pinchStartScale = _zoomScale;
                _panBaseX = _panX;
                _panBaseY = _panY;
                // Midpoint of the two fingers, relative to the image natural center.
                // The lightbox fills the full viewport, so the image center is at
                // (innerWidth/2, innerHeight/2) before any pan is applied.
                _pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - window.innerWidth / 2;
                _pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - window.innerHeight / 2;
                return;
            }

            if (e.touches.length !== 1) return;
            _isPinching = false;
            // Always record the single-touch start position, even for video —
            // touchend's swipe-nav calc needs it, and pinch/pan don't apply to video.
            _t0StartX = e.touches[0].clientX;
            _t0StartY = e.touches[0].clientY;
            if (!isVideo && _isZoomed()) {
                _isPanning = true;
                _panBaseX = _panX;
                _panBaseY = _panY;
            } else {
                _isPanning = false;
            }
        }, { passive: true });

        lightbox.addEventListener('touchmove', (e) => {
            if (!_isMobileLB()) return;
            if (e.target.closest('#commentDrawer')) return;
            if (isVideoPhoto(photos[currentPhotoIndex])) return;

            if (_isPinching && e.touches.length >= 2) {
                const dist = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
                const s1 = Math.max(1, Math.min(MAX_ZOOM, _pinchStartScale * (dist / _pinchStartDist)));
                // Zoom toward the pinch midpoint: keep the point under the fingers fixed.
                // Formula: panNew = mid + (panBase - mid) * s1/s0
                _panX = _pinchMidX + (_panBaseX - _pinchMidX) * s1 / _pinchStartScale;
                _panY = _pinchMidY + (_panBaseY - _pinchMidY) * s1 / _pinchStartScale;
                _zoomScale = s1;
                _clampPan();
                _applyZoomTransform();
                e.preventDefault();
                return;
            }

            if (_isPanning && e.touches.length === 1 && _isZoomed()) {
                _panX = _panBaseX + (e.touches[0].clientX - _t0StartX);
                _panY = _panBaseY + (e.touches[0].clientY - _t0StartY);
                _clampPan();
                _applyZoomTransform();
                e.preventDefault();
            }
        }, { passive: false });

        lightbox.addEventListener('touchend', (e) => {
            if (!_isMobileLB()) return;
            if (e.target.closest('#commentDrawer')) return;

            if (_isPinching) {
                if (e.touches.length < 2) {
                    _isPinching = false;
                    if (_zoomScale < 1.05) resetZoom();
                    // Transition to pan if one finger still held
                    if (e.touches.length === 1) {
                        _t0StartX = e.touches[0].clientX;
                        _t0StartY = e.touches[0].clientY;
                        _panBaseX = _panX;
                        _panBaseY = _panY;
                        _isPanning = _isZoomed();
                    }
                }
                return;
            }

            if (_isPanning) {
                _isPanning = false;
                _wasGesture = true;
                return;
            }

            // Swipe nav — only when not zoomed
            if (!_isZoomed() && e.changedTouches.length === 1 && e.touches.length === 0) {
                const dx = e.changedTouches[0].clientX - _t0StartX;
                const dy = e.changedTouches[0].clientY - _t0StartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
                    _wasGesture = true;
                    navigateLightbox(dx > 0 ? -1 : 1);
                }
            }
        }, { passive: true });

        // Dots indicateur
        function buildDots() {
            const container = document.getElementById('lbDots');
            if (!container || !photos.length) return;
            const max = Math.min(photos.length, 9);
            container.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const d = document.createElement('div');
                d.className = 'lb-dot' + (i === currentPhotoIndex ? ' active' : '');
                container.appendChild(d);
            }
        }

        function updateDots() {
            const container = document.getElementById('lbDots');
            if (!container) return;
            const dots = container.querySelectorAll('.lb-dot');
            dots.forEach((d, i) => d.classList.toggle('active', i === currentPhotoIndex));
        }

        function toggleFullscreen() {
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
            if (!fsEl) {
                const req = lightbox.requestFullscreen || lightbox.webkitRequestFullscreen;
                if (req) req.call(lightbox).catch(() => {});
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) exit.call(document).catch(() => {});
            }
        }

        // Changer l'icône fullscreen selon l'état + reset zoom (layout change)
        document.addEventListener('fullscreenchange', () => {
            resetZoom();
            const inFS = !!document.fullscreenElement;
            const expandPath = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round"/>';
            const compressPath = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 0 2-2h3M3 16h3a2 2 0 0 0 2 2v3" stroke-linecap="round" stroke-linejoin="round"/>';
            const newPath = inFS ? compressPath : expandPath;
            ['lbFsIcon', 'desktopFsIcon'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = newPath;
            });
        });



        // ══════════════════════════════════════════════════════════════════
        // COLLECTION INDEX + AUDIO MONTAGE (collection mode only)
        // ══════════════════════════════════════════════════════════════════
        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = String(str);
            return d.innerHTML;
        }

        function _formatBytes(b) {
            if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
            if (b >= 1048576)    return (b / 1048576).toFixed(0) + ' MB';
            return (b / 1024).toFixed(0) + ' KB';
        }

        let _collDownloadUrl = '';
        function downloadCollection() {
            if (_collDownloadUrl) window.location.href = _collDownloadUrl;
        }

        // Copies the standalone gallery link (not the hash route), since that is
        // what a visitor would share with someone outside the collection.
        function copyGalleryCustomerLink(btn, gid) {
            const url = new URL('/preview/' + gid, window.location.href).href;
            navigator.clipboard.writeText(url).then(() => {
                btn.classList.add('copied');
                setTimeout(() => btn.classList.remove('copied'), 1800);
            });
        }

        async function loadCollectionIndex() {
            try {
                const res = await fetch(`/api/collection/${collectionId}`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();
                _collectionData = data;

                locale = resolveClientLocale(data.clientLanguage);
                t = translations[locale];
                applyStaticTranslations();

                document.getElementById('loadingState').style.display = 'none';
                document.title = data.name || 'Collection';
                document.getElementById('collectionTitle').textContent = data.name || '';

                const totalPhotos = (data.galleries || []).reduce((s, g) => s + (g.fileCount || 0), 0);
                const galleryCount = (data.galleries || []).length;
                document.getElementById('collectionMeta').textContent =
                    `${galleryCount} ${galleryCount === 1 ? t.gallery : t.galleries} · ${totalPhotos} ${totalPhotos === 1 ? t.photo : t.photos}`;

                if (data.background) {
                    const bg = document.getElementById('collBgImage');
                    bg.onload = () => bg.classList.add('loaded');
                    bg.src = `/api/collection/${collectionId}/background`;
                }

                const collDownloads = data.downloadsEnabled !== false;
                if (collDownloads && (data.galleries || []).some(g => g.downloadsEnabled !== false)) {
                    _collDownloadUrl = `/api/collection/${collectionId}/download`;
                    document.getElementById('collDownloadText').textContent =
                        t.downloadAll + (data.totalSizeBytes ? ' · ' + _formatBytes(data.totalSizeBytes) : '');
                    document.getElementById('collDownloadWrap').style.display = 'flex';
                }

                const grid = document.getElementById('galleriesGrid');
                grid.innerHTML = '';
                (data.galleries || []).forEach(gallery => {
                    const card = document.createElement('div');
                    card.className = 'gallery-card';
                    const count = gallery.fileCount || 0;
                    const cover = gallery.background
                        ? `<img src="/api/gallery/${escapeHtml(gallery.id)}/background?card=1" alt="" loading="lazy">`
                        : `<div class="gallery-card-cover-placeholder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg></div>`;
                    const dlBtn = gallery.downloadsEnabled !== false
                        ? `<a class="btn-card-dl" href="/api/gallery/${escapeHtml(gallery.id)}/download" onclick="event.stopPropagation()">
                               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                               <span>${t.download}</span></a>`
                        : '';
                    // Hash link, not ../preview/: staying in this document is what
                    // keeps the montage playing when a gallery opens.
                    card.innerHTML = `
                        <a class="gallery-card-cover" href="#/gallery/${escapeHtml(gallery.id)}">
                            ${cover}
                            <div class="gallery-card-cover-overlay"><span>${t.browse}</span></div>
                        </a>
                        <div class="gallery-card-body">
                            <div class="gallery-card-info">
                                <div class="gallery-card-name">${escapeHtml(gallery.eventName || 'Untitled')}</div>
                                <div class="gallery-card-meta">${count} ${count === 1 ? t.photo : t.photos}</div>
                            </div>
                            <div class="gallery-card-actions">
                                <button class="btn-card-icon" title="${t.copyLink}" onclick="event.stopPropagation(); copyGalleryCustomerLink(this, '${escapeHtml(gallery.id)}')">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                    <span>${t.copyLink}</span>
                                </button>
                                ${dlBtn}
                            </div>
                        </div>`;
                    grid.appendChild(card);
                });

                setMontage(data.audio, data.name, `/api/collection/${collectionId}/background?card=1`);
            } catch (err) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('notFoundTitle').textContent = t.collectionNotFoundTitle;
                document.getElementById('notFoundText').textContent = t.collectionNotFoundText;
                document.getElementById('notFound').classList.add('active');
            }
        }

        // ── Audio montage ─────────────────────────────────────────────────
        // preload="none" so a ~90 MB track costs nothing until asked for, and
        // playback never starts on its own — the first play must be a gesture,
        // which is also what every browser requires.
        let _montageReady = false;
        let _montageWired = false;
        let _montageSrc = null;

        // Listeners are attached exactly once. setMontage() may be called on every
        // gallery mount, and re-attaching would stack one handler set per gallery.
        function wireMontageOnce() {
            if (_montageWired) return;
            const el = document.getElementById('montageAudio');
            const btn = document.getElementById('audioPlayer');
            el.addEventListener('timeupdate', () => {
                if (!el.duration) return;
                btn.style.setProperty('--audio-progress', String((el.currentTime / el.duration) * 100));
            });
            el.addEventListener('play', updateMontageButton);
            el.addEventListener('pause', updateMontageButton);
            el.addEventListener('ended', () => {
                btn.style.setProperty('--audio-progress', '0');
                updateMontageButton();
            });
            _montageWired = true;
        }

        // Loads (or clears) the montage. Passing the track that is already loaded is
        // a no-op — that guard is what keeps a collection montage playing untouched
        // while the visitor moves from gallery to gallery.
        function setMontage(audio, title, artworkUrl) {
            const el = document.getElementById('montageAudio');
            const btn = document.getElementById('audioPlayer');
            if (!audio || !audio.url) {
                el.pause();
                el.removeAttribute('src');
                btn.classList.remove('visible');
                btn.style.setProperty('--audio-progress', '0');
                _montageReady = false;
                _montageSrc = null;
                return;
            }
            if (_montageSrc === audio.url) return; // already playing this one — leave it alone

            wireMontageOnce();
            _montageSrc = audio.url;
            el.src = audio.url;
            btn.style.setProperty('--audio-progress', '0');
            btn.classList.add('visible');
            _montageReady = true;
            updateMontageButton();

            // Lock-screen / notification controls. Scrubbing and skipping live
            // there, which is why the in-page control stays a single button.
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: audio.filename || title || 'Montage',
                    artist: title || '',
                    artwork: artworkUrl ? [{ src: artworkUrl, sizes: '800x800', type: 'image/jpeg' }] : []
                });
                navigator.mediaSession.setActionHandler('play', () => el.play().catch(() => {}));
                navigator.mediaSession.setActionHandler('pause', () => el.pause());
            }
        }

        // True when the collection owns the soundtrack: it then wins over any
        // gallery's own montage, so playback stays continuous across galleries.
        function collectionOwnsMontage() {
            return !!(_isCollectionMode && _collectionData && _collectionData.audio);
        }

        function updateMontageButton() {
            const el = document.getElementById('montageAudio');
            const playing = !el.paused && !el.ended;
            document.getElementById('audioIconPlay').style.display  = playing ? 'none' : 'block';
            document.getElementById('audioIconPause').style.display = playing ? 'block' : 'none';
            const btn = document.getElementById('audioPlayer');
            btn.title = playing ? t.pauseMontage : t.playMontage;
            btn.setAttribute('aria-label', btn.title);
        }

        function toggleMontage() {
            if (!_montageReady) return;
            const el = document.getElementById('montageAudio');
            if (el.paused) el.play().catch(() => {});
            else el.pause();
        }

        // Docks the audio button into whichever chrome is currently on screen. Moving a
        // single element keeps one state and one progress ring, and re-parenting a
        // <button> has no effect on the <audio> (which never moves), so playback is
        // never interrupted. Crucially, the lightbox hosts are INSIDE .lightbox — the
        // fullscreen element — so the control survives fullscreen instead of vanishing.
        function placeAudioButton() {
            const btn = document.getElementById('audioPlayer');
            if (!btn) return;
            const lb = document.getElementById('lightbox');
            let host;
            if (lb && lb.classList.contains('active')) {
                // Deliberately NOT _isMobileLB(): that also matches (max-height: 500px),
                // but .lb-mobile-overlay only renders at (max-width: 768px). Using the
                // wrong one would park the button in a hidden bar on a landscape phone.
                const barsRendered = window.matchMedia('(max-width: 768px)').matches;
                host = document.getElementById(barsRendered ? 'lbBottomBar' : 'lbAudioSlotDesktop');
            } else {
                const collView = document.getElementById('collectionView');
                if (collView && collView.style.display !== 'none') {
                    host = document.getElementById('collAudioSlot');
                } else {
                    // Once the sticky bar reaches the top it replaces the hero cluster.
                    const bar = document.getElementById('actionsBar');
                    const stuck = bar && bar.style.display !== 'none'
                        && bar.getBoundingClientRect().top <= 0;
                    host = document.getElementById(stuck ? 'barAudioSlot' : 'heroAudioSlot');
                }
            }
            // Guard: this runs on every scroll event — only touch the DOM on a real change.
            if (host && btn.parentElement !== host) host.appendChild(btn);
        }

        // ── ROUTING ───────────────────────────────────────────────────────
        // Gallery mode (/preview/:id) has no routes — the gallery is the page.
        // Collection mode (/collection/:id) shows the index, and #/gallery/:id
        // mounts a gallery in this very document, which is what keeps the audio
        // montage playing across galleries.
        function currentGalleryFromHash() {
            const m = (location.hash || '').match(/^#\/gallery\/([0-9a-fA-F-]{36})$/);
            return m ? m[1] : null;
        }

        function renderRoute() {
            if (!_isCollectionMode) return;
            const gid = currentGalleryFromHash();
            if (gid) {
                document.getElementById('collectionView').style.display = 'none';
                if (gid !== galleryId) {
                    galleryId = gid;
                    loadGallery();
                }
            } else {
                ['heroSection', 'actionsBar', 'galleryContainer'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.style.display = 'none';
                });
                document.getElementById('notFound').classList.remove('active');
                closeLightbox();
                galleryId = null;   // force a reload if the same gallery is reopened
                // Back on the index: restore the collection's montage (a no-op when
                // it is already the loaded track, so it keeps playing) or clear the
                // gallery-specific one that was playing.
                setMontage(
                    collectionOwnsMontage() ? _collectionData.audio : null,
                    _collectionData ? _collectionData.name : '',
                    `/api/collection/${collectionId}/background?card=1`
                );
                document.getElementById('collectionView').style.display = 'block';
                document.title = (_collectionData && _collectionData.name) || document.title;
                window.scrollTo(0, 0);
                placeAudioButton(); // index is visible again — move the control back to it
                updateFooterVisibility();
            }
        }

        window.addEventListener('hashchange', renderRoute);

        // Load the collection first so the montage and the index exist before a
        // deep-linked #/gallery/:id mounts on top of them.
        if (_isCollectionMode) {
            loadCollectionIndex().then(renderRoute);
        } else {
            loadGallery();
        }

        // Disable right-click on images to prevent casual saving
        document.addEventListener('contextmenu', (e) => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });

        renderSocialFooter();

        // Le footer reste masqué sur le hero plein écran et n'apparaît qu'au scroll.
        function updateFooterVisibility() {
            // #socialFooter sits after this script in the document, so the very
            // first (synchronous) call runs before it exists — and renderRoute
            // calls this too. Guard rather than throw at the end of every load.
            const footer = document.getElementById('socialFooter');
            if (footer) footer.classList.toggle('visible', window.scrollY > 100);
            // The audio button follows the chrome: hero cluster until the sticky bar
            // takes over. placeAudioButton() no-ops unless the host actually changed.
            placeAudioButton();
        }
        window.addEventListener('scroll', updateFooterVisibility, { passive: true });
        // Desktop <-> mobile swaps the lightbox host, so re-place on resize too.
        window.addEventListener('resize', placeAudioButton);
        updateFooterVisibility();
    </script>
    <footer class="social-footer" id="socialFooter"></footer>
    <div id="favToast"></div>
</body>
</html>
