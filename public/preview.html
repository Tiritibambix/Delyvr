<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fraunces:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-tertiary: #1c1c1f;
            --text-primary: #f2f2f4;
            --text-secondary: #9898a2;
            --accent: #c9a962;
            --accent-hover: #dfc07a;
            --border: #2d2d30;
        }

        html.light {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f0f2;
            --text-primary: #000000;
            --text-secondary: #1c1c1c;
            --accent: #c9a962;
            --accent-hover: #dfc07a;
            --border: #d1d1d6;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 100vh;
            height: 100svh; /* viewport mobile minimal — figé, ne grandit pas quand la barre d'adresse se cache au scroll */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .hero-bg.loaded {
            opacity: 1;
        }

        .hero-logo {
            position: absolute;
            top: 24px;
            left: 24px;
            max-height: 48px;
            width: auto;
            z-index: 2;
            filter: drop-shadow(0 1px 4px rgba(0,0,0,0.5));
        }

        .hero h1 {
            position: absolute;
            bottom: 28px;
            left: 28px;
            z-index: 2;
            max-width: calc(100vw - 56px);
            font-family: 'Fraunces', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.01em;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.55);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-actions {
            position: absolute;
            bottom: 28px;
            right: 28px;
            z-index: 2;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        @media (max-width: 480px) {
            .hero-logo { top: 16px; left: 16px; max-height: 36px; }
            .hero h1 {
                bottom: 70px;
                left: 16px;
                max-width: calc(100vw - 32px);
                font-size: 1.6rem;
            }
            .hero-actions {
                bottom: 16px;
                left: 16px;
                right: 16px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }
        }

        /* Actions Bar */
        .actions-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg-primary) 90%, transparent);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }

        .back-to-collection {
            margin-right: auto;
        }

        @media (max-width: 768px) {
            .actions-bar {
                padding: 10px 12px;
                gap: 8px;
                backdrop-filter: none;
                background: color-mix(in srgb, var(--bg-primary) 97%, transparent);
            }
            .back-to-collection {
                flex: 1;
                justify-content: center;
                min-width: 0;
                padding: 9px 12px;
                font-size: 11px;
            }
            .back-to-collection {
                margin-right: 0;
            }
        }



        .show-gallery-btn,
        .back-to-collection {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.6);
            color: rgba(255,255,255,0.92);
            text-decoration: none;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .show-gallery-btn:hover,
        .back-to-collection:hover {
            background: rgba(255,255,255,0.12);
        }

        /* .show-gallery-btn n'est jamais soumis au thème clair : il vit toujours
           sur la photo de couverture non assombrie, donc il garde la même
           couleur claire que le titre, quel que soit le thème du site. */
        html.light .back-to-collection {
            border-color: rgba(0,0,0,0.55);
            color: rgba(0,0,0,0.85);
            text-shadow: none;
        }

        html.light .back-to-collection:hover {
            background: rgba(0,0,0,0.06);
        }

        .back-to-collection svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        .download-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: #c9a962;
            color: #0a0a0b;
            text-decoration: none;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .download-all-btn:hover { background: #dfc07a; }

        .download-all-btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* Critique mode */
        .photo-number {
            position: absolute;
            bottom: 6px; left: 6px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 7px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        .video-badge {
            position: absolute;
            top: 6px; right: 6px;
            width: 26px; height: 26px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: none;
            z-index: 4;
        }
        .video-badge svg { width: 13px; height: 13px; }
        .video-duration {
            position: absolute;
            bottom: 6px; right: 6px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 7px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        .gif-badge {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.5;
            letter-spacing: 0.06em;
        }
        .comment-count-badge {
            position: absolute;
            top: 6px; left: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 7px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        .comment-count-badge svg { width: 11px; height: 11px; }
        .critique-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            padding: 7px 12px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            white-space: nowrap;
        }
        html.light .critique-indicator { color: #8a6515; border-color: #8a6515; }
        .lb-critique-num {
            position: absolute;
            top: 14px; left: 16px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 1020;
            pointer-events: none;
            display: none;
        }

        /* Favorites toast */
        #favToast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: rgba(20,20,22,0.92);
            color: #fff;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 2000;
            white-space: nowrap;
        }
        html.light #favToast { background: rgba(40,40,44,0.92); }
        #favToast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        @media (max-width: 768px) {
            .gallery-container {
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .gallery-container {
                padding: 8px;
            }
        }

        .gallery-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .gallery-grid { gap: 4px; }
        }

        @media (max-width: 480px) {
            .gallery-grid { gap: 2px; }
        }

        .gallery-row {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .gallery-row { gap: 4px; }
        }

        @media (max-width: 480px) {
            .gallery-row { gap: 2px; }
        }

        .photo-card {
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }

        .photo-card:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .photo-card img.loaded {
            opacity: 1;
        }

        .photo-card .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-card .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.7) 0%,
                transparent 50%
            );
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px;
        }

        @media (max-width: 768px) {
            .photo-overlay {
                opacity: 0.6;
            }
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        .photo-name {
            display: none;
        }

        .photo-favorite {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .photo-favorite:hover {
            color: #dc3250;
        }

        .photo-favorite.favorited {
            color: #dc3250;
        }

        .photo-favorite svg {
            width: 16px;
            height: 16px;
            transition: fill 0.2s;
        }

        .photo-favorite.favorited svg {
            fill: #dc3250;
        }

        .lightbox-favorite-btn {
            position: absolute;
            top: 110px;
            right: 20px;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 1010;
        }

        @media (max-width: 768px) {
            .lightbox-favorite-btn {
                display: none;
            }
        }

        .lightbox-favorite-btn:hover {
            color: #dc3250;
        }

        .lightbox-fullscreen-btn {
            position: absolute;
            top: 50px;
            right: 20px;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 1010;
        }
        .lightbox-fullscreen-btn svg { width: 16px; height: 16px; }
        .lightbox-fullscreen-btn:hover {
            color: var(--accent);
        }
        @media (max-width: 768px) {
            .lightbox-fullscreen-btn { display: none; }
        }

        .lightbox-comment-btn {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 1010;
        }
        .lightbox-comment-btn svg { width: 16px; height: 16px; }
        .lightbox-comment-btn:hover {
            color: var(--accent);
        }
        @media (max-width: 768px) {
            .lightbox-comment-btn { display: none; }
        }
        .lb-comment-count {
            position: absolute;
            top: -4px; right: -4px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            background: var(--accent);
            color: #1a1a1a;
            border-radius: 9px;
            font-size: 10px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .lb-comment-count.visible { display: flex; }
        .lb-btn .lb-comment-count { background: var(--accent); color: #1a1a1a; }

        .lightbox-favorite-btn.favorited {
            color: #dc3250;
        }

        .lightbox-favorite-btn svg {
            width: 16px;
            height: 16px;
            transition: fill 0.2s;
        }

        .lightbox-favorite-btn.favorited svg {
            fill: #dc3250;
        }

        /* Mobile action bar — visible only on mobile */
        /* ── MOBILE LIGHTBOX OVERLAY ── */
        /* Floating overlay : actions auto-hide après 3s, réapparaissent au tap */
        /* absolute, not fixed: this is a descendant of .lightbox, which is itself
           `position: fixed; inset: 0`, so the geometry is identical — but a `fixed`
           descendant of a top-layer (fullscreen) element does not resolve reliably
           across engines, which is what made the favorite/download bar vanish in
           mobile fullscreen. Anchoring to .lightbox follows it into fullscreen. */
        .lb-mobile-overlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 1015;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .lb-mobile-overlay { display: block; }
        }

        /* Barre du haut : fermer + plein écran */
        .lb-top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: auto;
            transition: opacity 0.35s;
        }

        /* Barre du bas : fav + télécharger + compteur */
        .lb-bottom-bar {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            right: 20px;
            left: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
            transition: opacity 0.35s;
        }

        .lightbox:fullscreen .lb-bottom-bar,
        .lightbox:-webkit-full-screen .lb-bottom-bar {
            bottom: calc(28px + env(safe-area-inset-bottom));
        }

        .lb-top-bar.hidden,
        .lb-bottom-bar.hidden,
        #lightboxSocialWidget.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Boutons overlay */
        .lb-btn {
            position: relative;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .lb-btn:active { background: rgba(201,169,98,0.5); }
        .lb-btn svg { width: 20px; height: 20px; }

        .lb-btn.fav-active { border-color: #dc3250; }
        .lb-btn.fav-active svg { fill: #dc3250; stroke: #dc3250; }

        /* Compteur photo */
        .lb-counter {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        /* Indicateur de swipe (points) */
        .lb-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .lb-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transition: background 0.2s, transform 0.2s;
        }
        .lb-dot.active {
            background: #fff;
            transform: scale(1.3);
        }

        /* Comment drawer */
        .comment-drawer-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1029;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .comment-drawer-backdrop.open {
            opacity: 1;
            pointer-events: auto;
        }
        .comment-drawer {
            position: fixed;
            top: 0; right: 0;
            /* Kept narrow on purpose: the drawer stays pinned open on desktop and
               must eat as little of the photo as possible (see updateDrawerShift). */
            width: 300px;
            height: 100vh;
            background: var(--bg-secondary);
            border-left: 1px solid var(--border);
            z-index: 1030;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transform: translateX(100%);
            transition: transform 0.25s ease;
        }
        .comment-drawer.open { transform: translateX(0); }
        @media (max-width: 768px), (max-height: 500px) {
            .comment-drawer {
                top: auto; right: 0; left: 0; bottom: 0;
                width: auto;
                height: 70vh;
                border-left: none;
                border-top: 1px solid var(--border);
                border-radius: 16px 16px 0 0;
                transform: translateY(100%);
            }
            .comment-drawer.open { transform: translateY(0); }
        }
        .comment-drawer-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .comment-drawer-header span {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
        }
        .comment-drawer-close {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 22px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }
        .comment-drawer-list {
            flex: 1;
            overflow-y: auto;
            touch-action: pan-y;
            padding: 16px 18px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            scrollbar-width: none;
        }
        .comment-drawer-list::-webkit-scrollbar {
            display: none;
        }
        .comment-row-head {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 8px;
            margin-bottom: 3px;
        }
        .comment-row-name {
            font-weight: 600;
            font-size: 12.5px;
            color: var(--text-primary);
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .comment-row-time {
            font-size: 11px;
            color: var(--text-secondary);
            white-space: nowrap;
            flex-shrink: 0;
        }
        .comment-row-text {
            font-size: 13px;
            line-height: 1.5;
            color: var(--text-primary);
            word-break: break-word;
            white-space: pre-wrap;
        }
        .comment-empty {
            text-align: center;
            color: var(--text-secondary);
            font-size: 13px;
            padding: 32px 16px;
        }
        .comment-drawer-footer {
            flex-shrink: 0;
            padding: 12px 16px 16px;
            border-top: 1px solid var(--border);
        }
        .comment-as-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;

        /* Animation slide swipe */
        .lightbox-img.slide-left {
            animation: slideLeft 0.22s ease;
        }
        .lightbox-img.slide-right {
            animation: slideRight 0.22s ease;
        }
        @keyframes slideLeft {
            from { opacity: 1; transform: translateX(0); }
            50%  { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideRight {
            from { opacity: 1; transform: translateX(0); }

        /* Lightbox */
        .lightbox {
            position: fixed;

        /* Pinned drawer: the photo keeps its exact size and is shifted left by JS.
           The next arrow moves clear of the drawer so it stays clickable. */
        .lightbox-content { transition: transform 0.25s ease; }
        .lightbox.drawer-open .lightbox-next { right: 320px; }

        .lightbox-content {

        /* Desktop-only: fullscreen mode resizes the lightbox content to fill the
           entire screen. On mobile the lightbox is already viewport-sized via the
           mobile media query, so we MUST NOT override it here — switching to 100vh
           creates a 100dvh vs 100vh mismatch with <pinch-zoom> on Android in
           fullscreen, which breaks pinch-zoom-element's bound checks. */
        @media (min-width: 769px) and (min-height: 501px) {
            .lightbox:fullscreen .lightbox-content,
            .lightbox:-webkit-full-screen .lightbox-content {
                position: fixed;
                top: 0; left: 0;
                width: calc(100vw - 56px);
                height: 100vh;
                max-width: none;
                max-height: none;
            }
            .lightbox:fullscreen .lightbox-img,
            .lightbox:-webkit-full-screen .lightbox-img {

        /* ══════════════════════════════════════════════════════════════════
           COLLECTION INDEX VIEW
           This document serves both /preview/:id and /collection/:id. The
           collection index lives here (rather than the gallery view moving to
           collection.html) so the <audio> element below survives navigating
           between galleries — a montage must not stop when a gallery opens.
           Ported from the old collection.html; `.download-all-btn` already

        ══════════════════════════════════════════════════════════════════ */
        .bg-image {

        .site-header {

        /* ── Audio montage player ──────────────────────────────────────────
           Deliberately a single 44px control: the smallest thing that can start
           and stop playback. Scrubbing, skipping and the track title are handed
           to the OS media controls via the Media Session API instead of costing
           screen space. The progress ring is a conic gradient, so it takes no
           layout at all. z-index sits above the lightbox layer (1000–1030) so
           playback can be stopped even while a photo is open. */
        /* The audio button is docked into existing chrome, never floating: a floating
           position collided with the hero title, the photos, the footer and the
           lightbox's "@" widget, and being a sibling of .lightbox made it vanish in
           fullscreen. placeAudioButton() moves this one element between hosts; the
           styling is per-host so it matches whatever cluster it currently sits in. */
        .audio-player {
            position: relative;
            display: none; align-items: center; justify-content: center;
            padding: 0; background: none; border: none;
            color: inherit; cursor: pointer;
        }
        .audio-player.visible { display: inline-flex; }
        .audio-player svg { position: relative; z-index: 1; }
        /* Progress ring — costs no layout, adapts to whatever size the host gives. */
        .audio-player::before {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(var(--accent) calc(var(--audio-progress, 0) * 1%), transparent 0);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
                    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
            pointer-events: none;
        }

        /* Collection index host — centred under the header. The margin lives on the
           button, not the wrapper, so nothing takes space when there is no montage
           (the button is display:none then). */
        .coll-audio-wrap { display: flex; justify-content: center; position: relative; z-index: 10; }
        .coll-audio-wrap .audio-player { margin-top: 20px; }

        /* Hero + sticky actions bar + collection index: a bordered round icon, sized
           like the buttons it sits next to. */
        .hero-actions .audio-player,
        .coll-audio-wrap .audio-player,
        .actions-bar .audio-player {
            width: 34px; height: 34px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff; background: rgba(0,0,0,0.25);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            transition: background 0.2s, border-color 0.2s;
        }
        .hero-actions .audio-player:hover,
        .coll-audio-wrap .audio-player:hover,
        .actions-bar .audio-player:hover { background: rgba(0,0,0,0.45); border-color: #fff; }
        .hero-actions .audio-player svg,
        .coll-audio-wrap .audio-player svg,
        .actions-bar .audio-player svg { width: 14px; height: 14px; }
        html.light .actions-bar .audio-player {
            border-color: var(--border); color: var(--text); background: transparent;
        }
        html.light .actions-bar .audio-player:hover { background: var(--bg2); border-color: var(--muted); }

        /* Lightbox desktop: bare 20px icon continuing the right-hand control stack. */
        .lightbox .audio-player {
            position: absolute; top: 170px; right: 20px;
            width: 20px; height: 20px;
            color: rgba(255,255,255,0.7);
            transition: color 0.2s;
        }
        .lightbox .audio-player:hover { color: #fff; }
        .lightbox .audio-player svg { width: 18px; height: 18px; }
        /* Lightbox mobile: a normal .lb-bottom-bar entry, so it inherits the bar's
           auto-hide for free. Reset the absolute placement used on desktop. */
        .lb-bottom-bar .audio-player {
            position: relative; top: auto; right: auto;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(0,0,0,0.45); color: #fff;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .lb-bottom-bar .audio-player svg { width: 20px; height: 20px; }

        </button>

        function scrollToGallery() {
            const gallery = document.getElementById('galleryContainer');
            const actionsBar = document.querySelector('.actions-bar');
            const offset = actionsBar ? actionsBar.offsetHeight : 0;
            const top = gallery.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top, behavior: 'smooth' });
