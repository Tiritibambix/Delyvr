<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fraunces:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-tertiary: #1c1c1f;
            --text-primary: #f2f2f4;
            --text-secondary: #9898a2;
            --accent: #c9a962;
            --accent-hover: #dfc07a;
            --border: #2d2d30;
        }

        html.light {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f0f2;
            --text-primary: #000000;
            --text-secondary: #1c1c1c;
            --accent: #c9a962;
            --accent-hover: #dfc07a;
            --border: #d1d1d6;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 33vh;
            min-height: 200px;
            max-height: 320px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        @media (max-width: 768px) {
            .hero {
                height: 20vh;
                min-height: 140px;
                max-height: 200px;
            }
        }

        @media (max-height: 600px) and (orientation: landscape) {
            .hero {
                height: 12vh;
                min-height: 80px;
                max-height: 120px;
            }
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .hero-bg.loaded {
            opacity: 0.5;
        }

        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(10, 10, 11, 0.2) 0%,
                rgba(10, 10, 11, 0.7) 70%,
                rgba(10, 10, 11, 1) 100%
            );
        }

        html.light .hero-overlay {
            background: linear-gradient(
                to bottom,
                rgba(250, 250, 250, 0.1) 0%,
                rgba(250, 250, 250, 0.6) 70%,
                rgba(250, 250, 250, 1) 100%
            );
        }

        .hero-content {
            position: relative;
            z-index: 10;
            text-align: center;
            padding: 24px;
        }


        .hero h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 600;
            letter-spacing: -0.02em;
            margin-bottom: 8px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease forwards;
        }

        .hero-meta {
            color: var(--text-secondary);
            font-size: 1rem;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease 0.1s forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Actions Bar */
        .actions-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg-primary) 90%, transparent);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }

        .back-to-collection {
            margin-right: auto;
        }

        @media (max-width: 768px) {
            .actions-bar {
                padding: 10px 12px;
                gap: 8px;
            }
            .back-to-collection,
            .download-all-btn {
                flex: 1;
                justify-content: center;
                min-width: 0;
                padding: 9px 12px;
                font-size: 11px;
            }
            .back-to-collection {
                margin-right: 0;
            }
        }



        .back-to-collection {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            background: transparent;
            border: 1px solid #c9a962;
            color: #c9a962;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .back-to-collection:hover { background: rgba(201,169,98,0.12); }
        html.light .back-to-collection { border-color: #8a6515; color: #8a6515; }
        html.light .back-to-collection:hover { background: rgba(138,101,21,0.08); }

        .back-to-collection svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .download-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 20px;
            background: #c9a962;
            color: #0a0a0b;
            text-decoration: none;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            border: none;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .download-all-btn:hover { background: #dfc07a; }

        .download-all-btn svg {
            width: 15px;
            height: 15px;
        }

        /* Critique mode */
        .photo-number {
            position: absolute;
            bottom: 6px; left: 6px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 7px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        .video-badge {
            position: absolute;
            top: 6px; right: 6px;
            width: 26px; height: 26px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: none;
            z-index: 4;
        }
        .video-badge svg { width: 13px; height: 13px; }
        .video-duration {
            position: absolute;
            bottom: 6px; right: 6px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 7px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        .critique-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            padding: 7px 12px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            white-space: nowrap;
        }
        html.light .critique-indicator { color: #8a6515; border-color: #8a6515; }
        .lb-critique-num {
            position: absolute;
            top: 14px; left: 16px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 1020;
            pointer-events: none;
            display: none;
        }

        /* Favorites toast */
        #favToast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: rgba(20,20,22,0.92);
            color: #fff;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 2000;
            white-space: nowrap;
        }
        html.light #favToast { background: rgba(40,40,44,0.92); }
        #favToast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        @media (max-width: 768px) {
            .gallery-container {
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .gallery-container {
                padding: 8px;
            }
        }

        .gallery-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .gallery-grid { gap: 4px; }
        }

        @media (max-width: 480px) {
            .gallery-grid { gap: 2px; }
        }

        .gallery-row {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .gallery-row { gap: 4px; }
        }

        @media (max-width: 480px) {
            .gallery-row { gap: 2px; }
        }

        .photo-card {
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
        }

        .photo-card:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .photo-card img.loaded {
            opacity: 1;
        }

        .photo-card .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-card .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.7) 0%,
                transparent 50%
            );
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px;
        }

        @media (max-width: 768px) {
            .photo-overlay {
                opacity: 0.6;
            }
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        .photo-name {
            display: none;
        }

        .photo-favorite {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
            border: none;
            border-radius: 50%;
            color: white;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .photo-favorite:hover {
            background: rgba(255,255,255,0.25);
            transform: scale(1.1);
        }

        .photo-favorite.favorited {
            background: rgba(220, 50, 80, 0.85);
            color: white;
        }

        .photo-favorite svg {
            width: 18px;
            height: 18px;
            transition: fill 0.2s;
        }

        .photo-favorite.favorited svg {
            fill: white;
        }

        .lightbox-favorite-btn {
            position: absolute;
            top: 20px;
            right: 140px;
            width: 48px;
            height: 48px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 1010;
        }

        @media (max-width: 768px) {
            .lightbox-favorite-btn {
                display: none;
            }
        }

        .lightbox-favorite-btn:hover {
            background: var(--bg-secondary);
            border-color: #dc3250;
            color: #dc3250;
        }

        .lightbox-fullscreen-btn {
            position: absolute;
            top: 20px;
            right: 200px;
            width: 48px;
            height: 48px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 1010;
        }
        .lightbox-fullscreen-btn svg { width: 18px; height: 18px; }
        .lightbox-fullscreen-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--accent);
        }
        @media (max-width: 768px) {
            .lightbox-fullscreen-btn { display: none; }
        }

        .lightbox-favorite-btn.favorited {
            background: #dc3250;
            border-color: #dc3250;
            color: white;
        }

        .lightbox-favorite-btn svg {
            width: 20px;
            height: 20px;
            transition: fill 0.2s;
        }

        .lightbox-favorite-btn.favorited svg {
            fill: white;
        }

        /* Mobile action bar — visible only on mobile */
        /* ── MOBILE LIGHTBOX OVERLAY ── */
        /* Floating overlay : actions auto-hide après 3s, réapparaissent au tap */
        .lb-mobile-overlay {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 1015;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .lb-mobile-overlay { display: block; }
        }

        /* Barre du haut : fermer + plein écran */
        .lb-top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: auto;
            transition: opacity 0.35s;
        }

        /* Barre du bas : fav + télécharger + compteur */
        .lb-bottom-bar {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            padding-bottom: max(16px, env(safe-area-inset-bottom));
            background: linear-gradient(to top, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: auto;
            transition: opacity 0.35s;
        }

        .lb-top-bar.hidden,
        .lb-bottom-bar.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Boutons overlay */
        .lb-btn {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .lb-btn:active { background: rgba(201,169,98,0.5); }
        .lb-btn svg { width: 20px; height: 20px; }

        .lb-btn.fav-active { border-color: #dc3250; }
        .lb-btn.fav-active svg { fill: #dc3250; stroke: #dc3250; }

        /* Compteur photo */
        .lb-counter {
            font-size: 13px;
            color: rgba(255,255,255,0.8);
            font-variant-numeric: tabular-nums;
            text-shadow: 0 1px 3px rgba(0,0,0,0.6);
        }

        /* Indicateur de swipe (points) */
        .lb-dots {
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .lb-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: rgba(255,255,255,0.35);
            transition: background 0.2s, transform 0.2s;
        }
        .lb-dot.active {
            background: #fff;
            transform: scale(1.3);
        }



        /* Animation slide swipe */
        .lightbox-img.slide-left {
            animation: slideLeft 0.22s ease;
        }
        .lightbox-img.slide-right {
            animation: slideRight 0.22s ease;
        }
        @keyframes slideLeft {
            from { opacity: 1; transform: translateX(0); }
            50%  { opacity: 0; transform: translateX(-40px); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes slideRight {
            from { opacity: 1; transform: translateX(0); }
            50%  { opacity: 0; transform: translateX(40px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        .photo-download {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            background: var(--accent);
            color: var(--bg-primary);
            border-radius: 50%;
            text-decoration: none;
            transition: all 0.2s;
            flex-shrink: 0;
        }

        .photo-download:hover {
            background: var(--accent-hover);
            transform: scale(1.1);
        }

        .photo-download svg {
            width: 18px;
            height: 18px;
        }

        /* Lightbox */
        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 1000;
            background: rgba(0, 0, 0, 0.92);
            display: none;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .lightbox.active {
            display: flex;
            opacity: 1;
        }

        @media (max-width: 768px), (max-height: 500px) {
            .lightbox.active { touch-action: none; }
        }

        .lightbox-close {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 48px;
            height: 48px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 1010;
        }

        @media (max-width: 768px) {
            .lightbox-close {
                display: none;
            }
        }

        .lightbox-close:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }

        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 48px;
            height: 48px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-primary);
            font-size: 1.25rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 1010;
        }

        @media (max-width: 768px), (max-height: 500px) {
            .lightbox-nav {
                display: none;
            }
        }

        .lightbox-nav:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
        }

        .lightbox-prev {
            left: 20px;
        }

        .lightbox-next {
            right: 20px;
        }

        .lightbox-content {
            position: relative;
            max-width: calc(100vw - 160px);
            max-height: calc(100vh - 80px);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1005;
        }

        .lightbox-img {
            max-width: 100%;
            max-height: calc(100vh - 80px);
            object-fit: contain;
            border-radius: 4px;
        }

        @media (max-width: 768px), (max-height: 500px) {
            .lightbox-content {
                position: fixed;
                top: 0; left: 0;
                width: 100vw;
                height: 100dvh;
                max-width: none;
                max-height: none;
                display: flex;
                align-items: center;
                justify-content: center;
                padding: 0;
                z-index: 1001;
            }
            .lightbox-img {
                width: auto;
                height: auto;
                max-width: 100vw;
                max-height: 100dvh;
                border-radius: 0;
                display: block;
            }
            .lightbox-close,
            .lightbox-nav,
            .lightbox-download-btn,
            .lightbox-favorite-btn {
                display: none !important;
            }
        }

        /* Desktop-only: fullscreen mode resizes the lightbox content to fill the
           entire screen. On mobile the lightbox is already viewport-sized via the
           mobile media query, so we MUST NOT override it here — switching to 100vh
           creates a 100dvh vs 100vh mismatch with <pinch-zoom> on Android in
           fullscreen, which breaks pinch-zoom-element's bound checks. */
        @media (min-width: 769px) and (min-height: 501px) {
            .lightbox:fullscreen .lightbox-content,
            .lightbox:-webkit-full-screen .lightbox-content {
                position: fixed;
                top: 0; left: 0;
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
            }
            .lightbox:fullscreen .lightbox-img,
            .lightbox:-webkit-full-screen .lightbox-img {
                width: 100vw;
                height: 100vh;
                max-width: none;
                max-height: none;
                object-fit: contain;
            }
        }

        .lightbox-download-btn {
            position: absolute;
            top: 20px;
            right: 80px;
            width: 48px;
            height: 48px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 1010;
            text-decoration: none;
        }

        @media (max-width: 768px) {
            .lightbox-download-btn {
                display: none;
            }
        }

        .lightbox-download-btn:hover {
            background: var(--bg-secondary);
            border-color: var(--accent);
            color: var(--accent);
        }

        .lightbox-download-btn svg {
            width: 20px;
            height: 20px;
        }

        /* Not Found */
        .not-found {
            display: none;
            text-align: center;
            padding: 100px 24px;
        }

        .not-found.active {
            display: block;
        }

        .not-found h1 {
            font-family: 'Fraunces', serif;
            font-size: 2rem;
            margin-bottom: 12px;
        }

        .not-found p {
            color: var(--text-secondary);
        }

        /* Loading State */
        .loading-state {
            text-align: center;
            padding: 100px 24px;
            color: var(--text-secondary);
        }

        /* Responsive — handled by mobile lightbox block above */

        /* Social footer */
        /* Keyboard shortcut hint — desktop only */
        #kbHint {
            position: fixed;
            bottom: 20px;
            right: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 11px;
            color: rgba(255,255,255,0.7);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s;
            z-index: 1020;
        }
        #kbHint.visible { opacity: 1; }
        .kb-key {
            background: rgba(255,255,255,0.12);
            border: 1px solid rgba(255,255,255,0.25);
            border-radius: 3px;
            padding: 2px 6px;
            font-size: 10px;
            font-family: inherit;
            color: #fff;
        }
        @media (max-width: 768px), (hover: none) {
            #kbHint { display: none; }
        }

        .social-footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 90;
            padding: 12px 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            background: rgba(10,10,11,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        html.light .social-footer { background: rgba(245,244,240,0.85); }
        /* Avoid footer overlapping last gallery row */
        .gallery-container { padding-bottom: 64px; }

        .social-footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            flex-wrap: wrap;

        .social-footer-links a {

            display: flex;
            align-items: center;

        .social-footer-links a:hover {
            color: var(--accent);
        }

        .social-footer-links svg {
            width: 20px;
            height: 20px;
            fill: currentColor;
        }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero" id="heroSection" style="display: none;">
        <img class="hero-bg" id="heroBg">
        <div class="hero-overlay"></div>
<div class="hero-content">
            <h1 id="eventTitle"></h1>
            <p class="hero-meta" id="heroMeta"></p>
        </div>
    </section>

    <!-- Actions Bar -->
    <div class="actions-bar" id="actionsBar" style="display: none;">
        <a class="back-to-collection" id="backToCollection" href="#" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5m0 0l7 7m-7-7l7-7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="backToCollectionText"></span>
        </a>
        <span class="critique-indicator" id="critiqueIndicator" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Critique
        </span>
        <a class="download-all-btn" id="downloadAllBtn" href="#">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="downloadAllText"></span>
        </a>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-container" id="galleryContainer" style="display: none;">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <!-- Desktop Controls -->
        <button class="lightbox-close" onclick="closeLightbox()">×</button>
        <button class="lightbox-fullscreen-btn" id="desktopFsBtn" onclick="toggleFullscreen()" title="Fullscreen">
            <svg id="desktopFsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <a class="lightbox-download-btn" id="lightboxDownload" href="#" download title="Download">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </a>
        <button class="lightbox-favorite-btn" id="lightboxFavorite" onclick="toggleFavoriteFromLightbox()" title="Favorite" aria-label="Add to favorites">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </button>
        <button class="lightbox-nav lightbox-prev" onclick="navigateLightbox(-1)">‹</button>
        <button class="lightbox-nav lightbox-next" onclick="navigateLightbox(1)">›</button>

        <!-- Photo -->
        <div class="lightbox-content">
            <img class="lightbox-img" id="lightboxImg">
            <video class="lightbox-img" id="lightboxVideo" controls playsinline style="display:none"></video>
            <div class="lb-critique-num" id="lbCritiqueNum"></div>
        </div>

        <!-- Keyboard hint — inside lightbox so it survives fullscreen -->
        <div id="kbHint">
            <span class="kb-key">←</span><span class="kb-key">→</span>
            navigate
            <span style="margin-left:6px" class="kb-key">Esc</span>
            close
        </div>

        <!-- Mobile Overlay (portrait + landscape) -->
        <div class="lb-mobile-overlay" id="lbMobileOverlay">
            <!-- Barre haute : fermer + plein écran -->
            <div class="lb-top-bar" id="lbTopBar">
                <button class="lb-btn" onclick="closeLightbox()" aria-label="Fermer">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <span class="lb-counter" id="lbCounter"></span>
                <button class="lb-btn" id="lbFullscreenBtn" onclick="toggleFullscreen()" aria-label="Plein écran">
                    <svg id="lbFsIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
            </div>
            <!-- Barre basse : fav + télécharger -->
            <div class="lb-bottom-bar" id="lbBottomBar">
                <button class="lb-btn" id="lbMobileFav" onclick="toggleFavoriteFromLightbox()" aria-label="Add to favorites">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <a class="lb-btn" id="lbMobileDownload" href="#" download aria-label="Télécharger">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </a>
            </div>
        </div>
    </div>

    <!-- Loading State -->
    <div class="loading-state" id="loadingState"></div>

    <!-- Not Found -->
    <div class="not-found" id="notFound">
        <h1 id="notFoundTitle"></h1>
        <p id="notFoundText"></p>
    </div>

    <script src="/shared.js"></script>
    <script>
        // Internationalization
        const translations = {
            en: {
                yourPhotos: 'Your Photos',
                photo: 'photo',
                photos: 'photos',
                downloadAll: 'Download All',
                download: 'Download',
                clickToPreview: 'Click any photo to preview',
                loadingGallery: 'Loading gallery...',
                notFoundTitle: 'Gallery Not Found',
                notFoundText: 'This gallery may have been removed or the link is incorrect.',
                backToCollection: '← Back to collection',
                favAdded: '♥ Saved to favorites',
                favRemoved: 'Removed from favorites'
            },
            pt: {
                yourPhotos: 'Suas Fotos',
                photo: 'foto',
                photos: 'fotos',
                downloadAll: 'Baixar Todas',
                download: 'Baixar',
                clickToPreview: 'Clique em qualquer foto para visualizar',
                loadingGallery: 'Carregando galeria...',
                notFoundTitle: 'Galeria Não Encontrada',
                notFoundText: 'Esta galeria pode ter sido removida ou o link está incorreto.',
                backToCollection: '← Voltar à coleção',
                favAdded: '♥ Salvo nos favoritos',
                favRemoved: 'Removido dos favoritos'
            },
            es: {
                yourPhotos: 'Tus Fotos',
                photo: 'foto',
                photos: 'fotos',
                downloadAll: 'Descargar Todas',
                download: 'Descargar',
                clickToPreview: 'Haz clic en cualquier foto para ver',
                loadingGallery: 'Cargando galería...',
                notFoundTitle: 'Galería No Encontrada',
                notFoundText: 'Esta galería puede haber sido eliminada o el enlace es incorrecto.',
                backToCollection: '← Volver a la colección',
                favAdded: '♥ Guardado en favoritos',
                favRemoved: 'Eliminado de favoritos'
            },
            it: {
                yourPhotos: 'Le Tue Foto',
                photo: 'foto',
                photos: 'foto',
                downloadAll: 'Scarica Tutte',
                download: 'Scarica',
                clickToPreview: 'Clicca su una foto per visualizzarla',
                loadingGallery: 'Caricamento galleria...',
                notFoundTitle: 'Galleria Non Trovata',
                notFoundText: 'Questa galleria potrebbe essere stata rimossa o il link non è corretto.',
                backToCollection: '← Torna alla collezione',
                favAdded: '♥ Salvato nei preferiti',
                favRemoved: 'Rimosso dai preferiti'
            },
            fr: {
                yourPhotos: 'Vos Photos',
                photo: 'photo',
                photos: 'photos',
                downloadAll: 'Tout Télécharger',
                download: 'Télécharger',
                clickToPreview: 'Cliquez sur une photo pour l\'aperçu',
                loadingGallery: 'Chargement de la galerie...',
                notFoundTitle: 'Galerie Introuvable',
                notFoundText: 'Cette galerie a peut-être été supprimée ou le lien est incorrect.',
                backToCollection: 'Retour à la collection',
                favAdded: '♥ Ajouté aux favoris',
                favRemoved: 'Retiré des favoris'
            }
        };

        function getLocale() {
            const lang = navigator.language || navigator.userLanguage;
            const shortLang = lang.split('-')[0].toLowerCase();
            
            if (shortLang === 'pt') return 'pt';
            if (shortLang === 'es') return 'es';
            if (shortLang === 'it') return 'it';
            if (shortLang === 'fr') return 'fr';
            return 'en';
        }

        const locale = getLocale();
        const t = translations[locale];

        // Set HTML lang attribute
        document.documentElement.lang = locale;

        // Set static translations
        document.getElementById('downloadAllText').textContent = t.downloadAll;
        document.getElementById('loadingState').textContent = t.loadingGallery;
        document.getElementById('notFoundTitle').textContent = t.notFoundTitle;
        document.getElementById('notFoundText').textContent = t.notFoundText;


        applyTheme();

        const galleryId = window.location.pathname.split('/').pop();
        const _params = new URLSearchParams(window.location.search);
        const fromCollection = _params.get('from');
        const critiqueMode = _params.get('critique') === '1';
        let photos = [];
        let currentPhotoIndex = 0;

        // ── VIDEO HELPERS ──
        const VIDEO_EXTENSIONS = ['mp4', 'mov', 'webm', 'm4v'];
        function isVideoPhoto(photo) {
            if (photo.type) return photo.type === 'video';
            const ext = (photo.filename.split('.').pop() || '').toLowerCase();
            return VIDEO_EXTENSIONS.includes(ext);
        }
        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        // Visitor identity — persisted in localStorage, shared across all galleries
        function getVisitorId() {
            let id = localStorage.getItem('delyvr_visitor_id');
            if (!id) {
                id = 'v-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
                localStorage.setItem('delyvr_visitor_id', id);
            }
            return id;
        }
        const visitorId = getVisitorId();

        // Favorites state — only this visitor's favorites
        let localFavorites = new Set();

        let _favToastTimer = null;
        function showFavToast(added) {
            const el = document.getElementById('favToast');
            if (!el) return;
            el.textContent = added ? t.favAdded : t.favRemoved;
            el.classList.add('visible');
            clearTimeout(_favToastTimer);
            _favToastTimer = setTimeout(() => el.classList.remove('visible'), 2000);
        }

        async function toggleFavorite(filename) {
            const wasFavorited = localFavorites.has(filename);
            // Optimistic update
            if (wasFavorited) { localFavorites.delete(filename); } else { localFavorites.add(filename); }
            showFavToast(!wasFavorited);

            // Update card button
            const btn = document.querySelector(`.photo-favorite[data-filename="${CSS.escape(filename)}"]`);
            if (btn) {
                btn.classList.toggle('favorited', !wasFavorited);
                btn.querySelector('svg').setAttribute('fill', wasFavorited ? 'none' : 'white');
            }

            // Update lightbox button if same photo is open
            if (photos[currentPhotoIndex] && photos[currentPhotoIndex].filename === filename) {
                const favBtn = document.getElementById('lightboxFavorite');
                favBtn.classList.toggle('favorited', !wasFavorited);
                favBtn.querySelector('svg').setAttribute('fill', wasFavorited ? 'none' : 'white');
                // Sync mobile bar fav button
                const mobileBarFav = document.getElementById('lbMobileFav');
                if (mobileBarFav) {
                    mobileBarFav.classList.toggle('favorited', !wasFavorited);
                    mobileBarFav.querySelector('svg').setAttribute('fill', wasFavorited ? 'none' : '#dc3250');
                }
            }

            // Sync to server
            try {
                await fetch(`/api/gallery/${galleryId}/favorites`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, visitorId })
                });
            } catch (e) {
                // Revert on network error
                if (wasFavorited) { localFavorites.add(filename); } else { localFavorites.delete(filename); }
                if (btn) {
                    btn.classList.toggle('favorited', wasFavorited);
                    btn.querySelector('svg').setAttribute('fill', wasFavorited ? 'white' : 'none');
                }
            }
        }

        function toggleFavoriteFromLightbox() {
            const photo = photos[currentPhotoIndex];
            if (photo) toggleFavorite(photo.filename);
        }

        async function loadGallery() {
            try {
                // Get gallery info
                const infoRes = await fetch(`/api/gallery/${galleryId}/info`);
                if (!infoRes.ok) throw new Error('Not found');
                const info = await infoRes.json();

                // Get photos list
                const photosRes = await fetch(`/api/gallery/${galleryId}/photos`);
                if (!photosRes.ok) throw new Error('Failed to load photos');
                const data = await photosRes.json();
                
                photos = data.photos;

                // Hide loading, show content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('heroSection').style.display = 'flex';
                document.getElementById('actionsBar').style.display = 'flex';

                // Critique mode indicator
                if (critiqueMode) {
                    document.getElementById('critiqueIndicator').style.display = 'inline-flex';
                }

                // Show back-to-collection button if ?from= param is present
                if (fromCollection) {
                    const backBtn = document.getElementById('backToCollection');
                    backBtn.href = `/collection/${fromCollection}${critiqueMode ? '?critique=1' : ''}`;
                    document.getElementById('backToCollectionText').textContent = t.backToCollection;
                    backBtn.style.display = 'inline-flex';
                }
                document.getElementById('galleryContainer').style.display = 'block';

                // Set title
                const title = (info.eventName && info.eventName !== 'Untitled Event') 
                    ? info.eventName 
                    : t.yourPhotos;
                document.getElementById('eventTitle').textContent = title;
                document.title = title;

                // Set meta
                const count = photos.length;
                const photoWord = count === 1 ? t.photo : t.photos;
                document.getElementById('heroMeta').textContent = `${count} ${photoWord} • ${t.clickToPreview}`;


                // Set download all button
                document.getElementById('downloadAllBtn').href = `/api/gallery/${galleryId}/download`;

                // Hide download controls if downloads are disabled
                const downloadsEnabled = info.downloadsEnabled !== false;
                if (!downloadsEnabled) {
                    document.getElementById('downloadAllBtn').style.display = 'none';
                    document.getElementById('lightboxDownload').style.display = 'none';
                    const mobileBarDl = document.getElementById('lbMobileDownload');
                    if (mobileBarDl) mobileBarDl.style.display = 'none';
                }

                // Load background
                if (info.background) {
                    const heroBg = document.getElementById('heroBg');
                    heroBg.onload = () => heroBg.classList.add('loaded');
                    heroBg.src = `/api/gallery/${galleryId}/background`;
                }

                // Load this visitor's favorites from server
                try {
                    const favRes = await fetch(`/api/gallery/${galleryId}/favorites-public?visitorId=${encodeURIComponent(visitorId)}`);
                    if (favRes.ok) {
                        const favData = await favRes.json();
                        localFavorites = new Set(favData.favorites || []);
                    } else if (favRes.status === 404) {
                        // Gallery deleted — clean up localStorage
                        localStorage.removeItem('delyvr_visitor_id');
                    }
                } catch (e) { /* non-blocking */ }

                // Render gallery
                renderGallery(downloadsEnabled);

            } catch (err) {
                console.error(err);
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('notFound').classList.add('active');
            }
        }

        // Track downloadsEnabled for resize re-renders
        let _lastDownloadsEnabled = true;

        function getColCount() {
            const w = window.innerWidth;
            if (w >= 1400) return 4;
            if (w >= 900)  return 3;
            if (w >= 560)  return 2;
            return 1;
        }

        function getTargetRowHeight() {
            const w = window.innerWidth;
            if (w <= 480) return 140;
            if (w <= 900) return 180;
            if (w <= 1400) return 240;
            return 280;
        }

        function getRowGap() {
            const w = window.innerWidth;
            if (w <= 480) return 2;
            if (w <= 900) return 4;
            return 10;
        }

        // Build rows: greedily add photos until summed aspect ratio exceeds
        // what fits at target height, then scale the row height so the total
        // width matches the container (minus the internal gaps).
        function buildRows(photoList, containerWidth, targetHeight, gap) {
            const rows = [];
            let current = [];
            let sumRatio = 0;

            for (const p of photoList) {
                const w = p.width || 4;
                const h = p.height || 3;
                const ratio = w / h;
                current.push({ photo: p, ratio });
                sumRatio += ratio;

                const gapsWidth = gap * (current.length - 1);
                const rowWidthAtTarget = sumRatio * targetHeight + gapsWidth;

                if (rowWidthAtTarget >= containerWidth) {
                    // Scale to fit container exactly
                    const scaledHeight = (containerWidth - gapsWidth) / sumRatio;
                    rows.push({ items: current, height: scaledHeight });
                    current = [];
                    sumRatio = 0;
                }
            }

            // Last partial row: keep target height (don't stretch widows)
            if (current.length > 0) {
                rows.push({ items: current, height: targetHeight });
            }

            return rows;
        }

        function renderGallery(downloadsEnabled = true) {
            _lastDownloadsEnabled = downloadsEnabled;
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';

            const container = document.getElementById('galleryContainer');
            // Use the container's client width (accounts for its padding)
            const style = getComputedStyle(container);
            const padL = parseFloat(style.paddingLeft) || 0;
            const padR = parseFloat(style.paddingRight) || 0;
            const containerWidth = container.clientWidth - padL - padR;

            const targetHeight = getTargetRowHeight();
            const gap = getRowGap();
            const rows = buildRows(photos, containerWidth, targetHeight, gap);

            let photoIndex = 0;
            rows.forEach(row => {
                const rowEl = document.createElement('div');
                rowEl.className = 'gallery-row';
                rowEl.style.height = row.height + 'px';

                row.items.forEach(({ photo, ratio }) => {
                    const index = photoIndex++;
                    const isFav = localFavorites.has(photo.filename);

                    const card = document.createElement('div');
                    card.className = 'photo-card';
                    card.style.width = (row.height * ratio) + 'px';
                    card.style.height = row.height + 'px';
                    card.onclick = () => openLightbox(index);

                    const favFill = isFav ? 'white' : 'none';
                    const favClass = isFav ? 'favorited' : '';
                    const downloadBtn = downloadsEnabled ? `
                            <a class="photo-download" href="/api/gallery/${galleryId}/download/${encodeURIComponent(photo.filename)}" onclick="event.stopPropagation();" download>
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 4v12m0 0l-4-4m4 4l4-4" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </a>` : '';

                    const isVideo = isVideoPhoto(photo);
                    const mediaExtra = isVideo
                        ? `<div class="video-badge"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></div>
                           ${photo.duration ? `<span class="video-duration">${formatDuration(photo.duration)}</span>` : ''}`
                        : '';

                    card.innerHTML = `
                        <div class="loading"></div>
                        <img data-src="${photo.thumbnailUrl}" alt="">
                        ${mediaExtra}
                        ${critiqueMode ? `<span class="photo-number">${index + 1}</span>` : ''}
                        <div class="photo-overlay">
                            <span class="photo-name"></span>
                            <button class="photo-favorite ${favClass}" data-filename="" data-index="${index}" aria-label="Add to favorites">
                                <svg viewBox="0 0 24 24" fill="${favFill}" stroke="currentColor" stroke-width="2">
                                    <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" stroke-linecap="round" stroke-linejoin="round"/>
                                </svg>
                            </button>
                            ${downloadBtn}
                        </div>`;

                    card.querySelector('.photo-name').textContent = photo.filename;
                    const favBtn = card.querySelector('.photo-favorite');
                    favBtn.dataset.filename = photo.filename;
                    favBtn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        toggleFavorite(favBtn.dataset.filename);
                    });

                    const img = card.querySelector('img');
                    img.onload = function() {
                        this.classList.add('loaded');
                        const loader = this.previousElementSibling;
                        if (loader) loader.style.display = 'none';
                    };

                    rowEl.appendChild(card);
                });

                grid.appendChild(rowEl);
            });

            lazyLoadImages();
        }

        // Re-layout on resize (debounced)
        let _resizeTimer = null;
        window.addEventListener('resize', () => {
            clearTimeout(_resizeTimer);
            _resizeTimer = setTimeout(() => {
                if (photos && photos.length > 0) {
                    renderGallery(_lastDownloadsEnabled);
                }
            }, 150);
        });

        function lazyLoadImages() {
            const images = document.querySelectorAll('.photo-card img[data-src]');
            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        const img = entry.target;
                        img.src = img.dataset.src;
                        observer.unobserve(img);
                    }
                });
            }, { rootMargin: '200px' });

            images.forEach(img => observer.observe(img));
        }

        function openLightbox(index) {
            currentPhotoIndex = index;
            if (typeof resetZoom === 'function') resetZoom();
            updateLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.body.style.overflow = 'hidden';
            document.getElementById('kbHint').classList.add('visible');
            // Mobile : initialiser les dots et afficher l'overlay
            if (window.innerWidth <= 768) {
                buildDots();
                showLbBars();
                scheduleLbHide();
            }
        }

        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
            document.body.style.overflow = '';
            if (typeof resetZoom === 'function') resetZoom();
            document.getElementById('kbHint').classList.remove('visible');
            // Quitter le plein écran si actif
            if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
            clearTimeout(_lbHideTimer);
        }

        function navigateLightbox(direction) {
            currentPhotoIndex += direction;
            if (currentPhotoIndex < 0) currentPhotoIndex = photos.length - 1;
            if (currentPhotoIndex >= photos.length) currentPhotoIndex = 0;
            if (typeof resetZoom === 'function') resetZoom();
            // Animation slide sur mobile
            if (window.innerWidth <= 768) {
                const img = document.getElementById('lightboxImg');
                const cls = direction > 0 ? 'slide-left' : 'slide-right';
                img.classList.remove('slide-left', 'slide-right');
                void img.offsetWidth; // reflow
                img.classList.add(cls);
                setTimeout(() => img.classList.remove(cls), 250);
                updateDots();
            }
            updateLightbox();
            // Réafficher les barres brièvement après navigation
            if (window.innerWidth <= 768) {
                showLbBars();
                scheduleLbHide();
            }
        }

        // Preload adjacent previews so navigation feels instant
        function preloadAdjacentPreviews(index) {
            const offsets = [-1, 1];
            offsets.forEach(offset => {
                const i = (index + offset + photos.length) % photos.length;
                if (photos[i] && !isVideoPhoto(photos[i])) {
                    const img = new Image();
                    img.src = photos[i].previewUrl || photos[i].url;
                }
            });
        }

        function updateLightbox() {
            const photo = photos[currentPhotoIndex];
            const downloadUrl = `/api/gallery/${galleryId}/download/${encodeURIComponent(photo.filename)}`;

            if (critiqueMode) {
                const num = document.getElementById('lbCritiqueNum');
                if (num) { num.textContent = `# ${currentPhotoIndex + 1}`; num.style.display = 'block'; }
            }

            const imgEl = document.getElementById('lightboxImg');
            const videoEl = document.getElementById('lightboxVideo');
            if (isVideoPhoto(photo)) {
                imgEl.style.display = 'none';
                imgEl.src = '';
                videoEl.style.display = '';
                videoEl.poster = photo.thumbnailUrl;
                if (!videoEl.src.endsWith(photo.url)) videoEl.src = photo.url;
                videoEl.pause();
            } else {
                videoEl.style.display = 'none';
                videoEl.pause();
                videoEl.removeAttribute('src');
                videoEl.load();
                imgEl.style.display = '';
                imgEl.src = photo.previewUrl || photo.url;
            }

            // Preload neighbours in background
            preloadAdjacentPreviews(currentPhotoIndex);

            // Sync mobile overlay elements

            const lbMobileDl = document.getElementById('lbMobileDownload');
            if (lbMobileDl) lbMobileDl.href = `/api/gallery/${galleryId}/download/${encodeURIComponent(photo.filename)}`;

            // Desktop download button
            document.getElementById('lightboxDownload').href = downloadUrl;
            document.getElementById('lightboxDownload').setAttribute('download', photo.filename);

            // Mobile bar download link
            const mobileBarDl = document.getElementById('lbMobileDownload');
            if (mobileBarDl) {
                mobileBarDl.href = downloadUrl;
                mobileBarDl.setAttribute('download', photo.filename);
            }

            // Fav state — desktop button
            const isFav = localFavorites.has(photo.filename);
            const favBtn = document.getElementById('lightboxFavorite');
            favBtn.classList.toggle('favorited', isFav);
            favBtn.querySelector('svg').setAttribute('fill', isFav ? 'white' : 'none');

            // Fav state — mobile bar button
            const mobileBarFav = document.getElementById('lbMobileFav');
            if (mobileBarFav) {
                mobileBarFav.classList.toggle('favorited', isFav);
                mobileBarFav.querySelector('svg').setAttribute('fill', isFav ? '#dc3250' : 'none');
            }
        }

        // Keyboard navigation
        document.addEventListener('keydown', (e) => {
            const lightbox = document.getElementById('lightbox');
            if (!lightbox.classList.contains('active')) return;

            if (e.key === 'Escape') closeLightbox();
            if (e.key === 'ArrowLeft') navigateLightbox(-1);
            if (e.key === 'ArrowRight') navigateLightbox(1);
        });

        // Close lightbox on background click
        document.getElementById('lightbox').addEventListener('click', (e) => {
            if (e.target.id === 'lightbox') {
                closeLightbox();
            }
        });

        // ── MOBILE LIGHTBOX — JS pinch-zoom via CSS transform, swipe nav, bars, fullscreen ──
        // Strategy: handle all touch gestures ourselves using CSS transforms on the image.
        // Native visual-viewport zoom is disabled by browsers inside requestFullscreen(),
        // so relying on it breaks pinch-zoom in fullscreen. JS transforms work identically
        // in normal and fullscreen modes.
        const lightbox = document.getElementById('lightbox');

        // Zoom & pan state
        let _zoomScale = 1;
        let _panX = 0, _panY = 0;

        // Touch-gesture tracking
        let _t0StartX = 0, _t0StartY = 0;
        let _panBaseX = 0, _panBaseY = 0;
        let _pinchStartDist = 0, _pinchStartScale = 1;
        let _pinchMidX = 0, _pinchMidY = 0;
        let _isPinching = false, _isPanning = false;
        const MAX_ZOOM = 5;

        // Bar state
        let _lbHideTimer = null;
        let _lbBarsVisible = true;
        let _wasGesture = false;

        function _isMobileLB() {
            return window.matchMedia('(max-width: 768px), (max-height: 500px)').matches;
        }

        function _isZoomed() { return _zoomScale > 1.05; }

        function _applyZoomTransform() {
            const img = document.getElementById('lightboxImg');
            if (!img) return;
            img.style.transform = _isZoomed()
                ? `translate(${_panX}px, ${_panY}px) scale(${_zoomScale})`
                : '';
        }

        function _clampPan() {
            const img = document.getElementById('lightboxImg');
            if (!img) return;
            const cw = img.clientWidth, ch = img.clientHeight;
            const nw = img.naturalWidth || cw, nh = img.naturalHeight || ch;
            const imgAsp = nw / nh, conAsp = cw / ch;
            const rw = imgAsp > conAsp ? cw : ch * imgAsp;
            const rh = imgAsp > conAsp ? cw / imgAsp : ch;
            const maxX = Math.max(0, (rw * _zoomScale - cw) / 2);
            const maxY = Math.max(0, (rh * _zoomScale - ch) / 2);
            _panX = Math.max(-maxX, Math.min(maxX, _panX));
            _panY = Math.max(-maxY, Math.min(maxY, _panY));
        }

        function resetZoom() {
            _zoomScale = 1; _panX = 0; _panY = 0;
            _isPinching = false; _isPanning = false;
            _applyZoomTransform();
        }

        function showLbBars() {
            const top = document.getElementById('lbTopBar');
            const bot = document.getElementById('lbBottomBar');
            if (top) top.classList.remove('hidden');
            if (bot) bot.classList.remove('hidden');
            _lbBarsVisible = true;
        }

        function hideLbBars() {
            const top = document.getElementById('lbTopBar');
            const bot = document.getElementById('lbBottomBar');
            if (top) top.classList.add('hidden');
            if (bot) bot.classList.add('hidden');
            _lbBarsVisible = false;
        }

        function scheduleLbHide() {
            clearTimeout(_lbHideTimer);
            _lbHideTimer = setTimeout(hideLbBars, 3000);
        }

        // Tap sur la zone image : toggle visibilité barres
        lightbox.addEventListener('click', (e) => {
            if (!_isMobileLB()) return;
            if (_wasGesture) { _wasGesture = false; return; }
            if (e.target.closest('#lightboxVideo')) return;
            if (e.target.closest('.lb-top-bar') || e.target.closest('.lb-bottom-bar')) return;
            if (_lbBarsVisible) {
                hideLbBars();
                clearTimeout(_lbHideTimer);
            } else {
                showLbBars();
                scheduleLbHide();
            }
        });

        lightbox.addEventListener('touchstart', (e) => {
            if (!_isMobileLB()) return;
            if (isVideoPhoto(photos[currentPhotoIndex])) return;

            if (e.touches.length === 2) {
                _wasGesture = true;
                _isPinching = true;
                _isPanning = false;
                _pinchStartDist = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
                _pinchStartScale = _zoomScale;
                _panBaseX = _panX;
                _panBaseY = _panY;
                // Midpoint of the two fingers, relative to the image natural center.
                // The lightbox fills the full viewport, so the image center is at
                // (innerWidth/2, innerHeight/2) before any pan is applied.
                _pinchMidX = (e.touches[0].clientX + e.touches[1].clientX) / 2 - window.innerWidth / 2;
                _pinchMidY = (e.touches[0].clientY + e.touches[1].clientY) / 2 - window.innerHeight / 2;
                return;
            }

            if (e.touches.length !== 1) return;
            _isPinching = false;
            _t0StartX = e.touches[0].clientX;
            _t0StartY = e.touches[0].clientY;
            if (_isZoomed()) {
                _isPanning = true;
                _panBaseX = _panX;
                _panBaseY = _panY;
            } else {
                _isPanning = false;
            }
        }, { passive: true });

        lightbox.addEventListener('touchmove', (e) => {
            if (!_isMobileLB()) return;
            if (isVideoPhoto(photos[currentPhotoIndex])) return;

            if (_isPinching && e.touches.length >= 2) {
                const dist = Math.hypot(
                    e.touches[1].clientX - e.touches[0].clientX,
                    e.touches[1].clientY - e.touches[0].clientY
                );
                const s1 = Math.max(1, Math.min(MAX_ZOOM, _pinchStartScale * (dist / _pinchStartDist)));
                // Zoom toward the pinch midpoint: keep the point under the fingers fixed.
                // Formula: panNew = mid + (panBase - mid) * s1/s0
                _panX = _pinchMidX + (_panBaseX - _pinchMidX) * s1 / _pinchStartScale;
                _panY = _pinchMidY + (_panBaseY - _pinchMidY) * s1 / _pinchStartScale;
                _zoomScale = s1;
                _clampPan();
                _applyZoomTransform();
                e.preventDefault();
                return;
            }

            if (_isPanning && e.touches.length === 1 && _isZoomed()) {
                _panX = _panBaseX + (e.touches[0].clientX - _t0StartX);
                _panY = _panBaseY + (e.touches[0].clientY - _t0StartY);
                _clampPan();
                _applyZoomTransform();
                e.preventDefault();
            }
        }, { passive: false });

        lightbox.addEventListener('touchend', (e) => {
            if (!_isMobileLB()) return;

            if (_isPinching) {
                if (e.touches.length < 2) {
                    _isPinching = false;
                    if (_zoomScale < 1.05) resetZoom();
                    // Transition to pan if one finger still held
                    if (e.touches.length === 1) {
                        _t0StartX = e.touches[0].clientX;
                        _t0StartY = e.touches[0].clientY;
                        _panBaseX = _panX;
                        _panBaseY = _panY;
                        _isPanning = _isZoomed();
                    }
                }
                return;
            }

            if (_isPanning) {
                _isPanning = false;
                _wasGesture = true;
                return;
            }

            // Swipe nav — only when not zoomed
            if (!_isZoomed() && e.changedTouches.length === 1 && e.touches.length === 0) {
                const dx = e.changedTouches[0].clientX - _t0StartX;
                const dy = e.changedTouches[0].clientY - _t0StartY;
                if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 45) {
                    _wasGesture = true;
                    navigateLightbox(dx > 0 ? -1 : 1);
                }
            }
        }, { passive: true });

        // Dots indicateur
        function buildDots() {
            const container = document.getElementById('lbDots');
            if (!container || !photos.length) return;
            const max = Math.min(photos.length, 9);
            container.innerHTML = '';
            for (let i = 0; i < max; i++) {
                const d = document.createElement('div');
                d.className = 'lb-dot' + (i === currentPhotoIndex ? ' active' : '');
                container.appendChild(d);
            }
        }

        function updateDots() {
            const container = document.getElementById('lbDots');
            if (!container) return;
            const dots = container.querySelectorAll('.lb-dot');
            dots.forEach((d, i) => d.classList.toggle('active', i === currentPhotoIndex));
        }

        function toggleFullscreen() {
            const fsEl = document.fullscreenElement || document.webkitFullscreenElement;
            if (!fsEl) {
                const req = lightbox.requestFullscreen || lightbox.webkitRequestFullscreen;
                if (req) req.call(lightbox).catch(() => {});
            } else {
                const exit = document.exitFullscreen || document.webkitExitFullscreen;
                if (exit) exit.call(document).catch(() => {});
            }
        }

        // Changer l'icône fullscreen selon l'état + reset zoom (layout change)
        document.addEventListener('fullscreenchange', () => {
            resetZoom();
            const inFS = !!document.fullscreenElement;
            const expandPath = '<path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" stroke-linecap="round" stroke-linejoin="round"/>';
            const compressPath = '<path d="M8 3v3a2 2 0 0 1-2 2H3m18 0h-3a2 2 0 0 1-2-2V3m0 18v-3a2 2 0 0 0 2-2h3M3 16h3a2 2 0 0 0 2 2v3" stroke-linecap="round" stroke-linejoin="round"/>';
            const newPath = inFS ? compressPath : expandPath;
            ['lbFsIcon', 'desktopFsIcon'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.innerHTML = newPath;
            });
        });



        // Load gallery on page load
        loadGallery();

        // Disable right-click on images to prevent casual saving
        document.addEventListener('contextmenu', (e) => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });

        renderSocialFooter();
    </script>
    <footer class="social-footer" id="socialFooter"></footer>
    <div id="favToast"></div>
</body>
</html>
