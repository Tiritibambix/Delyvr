<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Photos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fraunces:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-primary: #0a0a0b;
            --bg-secondary: #141416;
            --bg-tertiary: #1c1c1f;
            --text-primary: #f2f2f4;
            --text-secondary: #9898a2;
            --accent: #c9a962;
            --accent-hover: #dfc07a;
            --border: #2d2d30;
        }

        html.light {
            --bg-primary: #fafafa;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f0f0f2;
            --text-primary: #000000;
            --text-secondary: #1c1c1c;
            --accent: #c9a962;
            --accent-hover: #dfc07a;
            --border: #d1d1d6;
        }

        body {
            font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
        }

        /* Hero Section */
        .hero {
            position: relative;
            height: 100vh;
            height: 100svh; /* viewport mobile minimal — figé, ne grandit pas quand la barre d'adresse se cache au scroll */
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .hero-bg {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            opacity: 0;
            /* `transform` is deliberately NOT in this transition list: the scroll
               parallax (updateHeroParallax) writes it once per frame, and a
               transition there would lag every frame behind the scroll. Keep this
               to opacity only. `inset: 0` is likewise load-bearing — see the
               parallax comment in the script for why no extra height is needed. */
            transition: opacity 1s ease;
        }

        .hero-bg.loaded {
            opacity: 1;
        }

        /* A drop-shadow alone cannot make a pale logo readable on a pale photo: it can
           only outline the glyph, so a white mark on a white sky stays a smudge however
           hard the shadow is pushed. Verified by rendering the real logo at 48px over
           white, pale sand and skin tones with four shadow strengths; even the heaviest
           read as a dark halo around nothing.
           This scrim is the part that actually works. It is deliberately TOP-ONLY and
           short, so the hero keeps the undimmed full-bleed look it was designed around:
           on a dark cover it is barely perceptible, on a bright one it is what makes the
           logo legible. Strength is one number, the first stop's alpha. z-index 1 puts it
           above .hero-bg (which has none) and below the logo/title/buttons at z-index 2,
           and it is pinned to the hero box so the parallax slides the photo underneath. */
        .hero::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 170px;
            z-index: 1;
            pointer-events: none;
            background: linear-gradient(to bottom,
                rgba(0,0,0,0.50) 0%,
                rgba(0,0,0,0.22) 45%,
                transparent 100%);
        }

        .hero-logo {
            position: absolute;
            top: 24px;
            left: 24px;
            max-height: 48px;
            width: auto;
            z-index: 2;
            /* The hero cover is undimmed and full-bleed, so a pale logo can sink straight
               into a bright photo. First layer matches the house value used by `.hero h1`
               below; the second is a tight, un-offset layer that separates thin SVG
               strokes, which a soft offset shadow alone leaves ambiguous.
               Note: drop-shadow() follows the alpha channel, so on an opaque JPEG logo
               this reads as a rectangular halo rather than hugging the glyph. /api/logo
               serves six formats and never tells the client which, so that case cannot be
               detected here, and the halo still separates the logo from the photo.
               The scrim above now does the heavy lifting, so this stays moderate: pushed
               harder it reads as a dirty ring rather than as depth. */
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7)) drop-shadow(0 0 8px rgba(0,0,0,0.45));
        }

        .hero h1 {
            position: absolute;
            bottom: 28px;
            left: 28px;
            z-index: 2;
            max-width: calc(100vw - 56px);
            font-family: 'Fraunces', serif;
            font-size: clamp(2rem, 5vw, 3rem);
            font-weight: 300;
            letter-spacing: -0.01em;
            color: #fff;
            text-shadow: 0 2px 6px rgba(0,0,0,0.55);
            opacity: 0;
            transform: translateY(20px);
            animation: fadeUp 0.8s ease forwards;
        }

        @keyframes fadeUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .hero-actions {
            position: absolute;
            bottom: 28px;
            right: 28px;
            z-index: 2;
            display: flex;
            /* flex-end, not center: keeps "Show Gallery" level with "Download All"
               instead of centring it against the two-high audio/download column. */
            align-items: flex-end;
            gap: 12px;
        }

        /* align-items: stretch is what makes the audio button exactly as wide as the
           download button — "same size" comes from the layout, not a hard-coded width,
           which also means the button never resizes between its play and pause labels. */
        .hero-actions-stack {
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
        }
        /* Both buttons are now the same width, so they must align their contents the
           same way — left-aligned text in a stretched gold button reads as a bug.
           The audio button already centres (base .audio-player rule). */
        .hero-actions-stack .download-all-btn { justify-content: center; }

        @media (max-width: 480px) {
            .hero-logo { top: 16px; left: 16px; max-height: 36px; }
            .hero h1 {
                bottom: 70px;
                left: 16px;
                max-width: calc(100vw - 32px);
                font-size: 1.6rem;
            }
            .hero-actions {
                bottom: 16px;
                left: 16px;
                right: 16px;
                flex-wrap: wrap;
                justify-content: flex-end;
            }
            /* `bottom: 70px` above was tuned to clear ONE row of buttons. With a
               montage the cluster is two rows tall (audio stacked over download), so
               the title needs more clearance — but only then, hence :has() (already
               used for the same kind of test on #ssAudioSlot further down).
               The button is a descendant of .hero only while it is parked in the hero:
               once placeAudioButton() moves it to the sticky bar the selector stops
               matching and the title returns to 70px, with no JS involved. */
            .hero:has(.audio-player.visible) h1 { bottom: 118px; }
        }

        /* Actions Bar */
        .actions-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: color-mix(in srgb, var(--bg-primary) 90%, transparent);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            flex-direction: row;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
        }

        .back-to-collection {
            margin-right: auto;
        }

        @media (max-width: 768px) {
            .actions-bar {
                /* 10px side padding and a 6px gutter rather than 12/8: the bar carries up
                   to four items on a phone and every pixel here is one the labels keep. */
                padding: 10px 10px;
                gap: 6px;
                backdrop-filter: none;
                background: color-mix(in srgb, var(--bg-primary) 97%, transparent);
            }
            /* Layout only. The padding and font-size that used to live here were DEAD:
               this media query sits before the shared `.show-gallery-btn, .back-to-collection,
               .slideshow-btn` rule set, a media query adds no specificity, and at equal
               specificity the later rule wins. The link therefore rendered at 13px/18px
               instead of 11px/12px, wasting 43px of a bar that was already overflowing.
               The real mobile sizing now lives in one block AFTER that rule set. */
            /* `margin-right: auto` from the rule above is what keeps the back link
               pinned LEFT while the bar itself is `justify-content: flex-end`. Do not
               reset it here, and do not give this link `flex: 0 0 auto` without it: the
               whole bar then bunches to the right. It used to carry `flex: 1` too, which
               made sense only while the bar was overflowing and the link had to absorb
               the excess; now that the labels fit, growing it would just stretch an
               arrow across the bar. */
            .back-to-collection {
                min-width: 0;
            }
        }



        .show-gallery-btn,
        .back-to-collection,
        .slideshow-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.6);
            color: rgba(255,255,255,0.92);
            text-decoration: none;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s, border-color 0.2s, color 0.2s;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .show-gallery-btn:hover,
        .back-to-collection:hover,
        .slideshow-btn:hover {
            background: rgba(255,255,255,0.12);
        }

        /* .show-gallery-btn n'est jamais soumis au thème clair : il vit toujours
           sur la photo de couverture non assombrie, donc il garde la même
           couleur claire que le titre, quel que soit le thème du site. */
        html.light .back-to-collection,
        html.light .slideshow-btn {
            border-color: rgba(0,0,0,0.55);
            color: rgba(0,0,0,0.85);
            text-shadow: none;
        }

        html.light .back-to-collection:hover,
        html.light .slideshow-btn:hover {
            background: rgba(0,0,0,0.06);
        }

        .back-to-collection svg,
        .slideshow-btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }


        .download-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 18px;
            background: #c9a962;
            color: #0a0a0b;
            text-decoration: none;
            border-radius: 3px;
            font-size: 13px;
            font-weight: 500;
            font-family: inherit;
            border: none;
            cursor: pointer;
            transition: background 0.2s;
            white-space: nowrap;
        }

        .download-all-btn:hover { background: #dfc07a; }

        .download-all-btn svg {
            width: 14px;
            height: 14px;
            flex-shrink: 0;
        }

        /* Critique mode */
        .photo-number {
            position: absolute;
            bottom: 6px; left: 6px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 7px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        .video-badge {
            position: absolute;
            top: 6px; right: 6px;
            width: 26px; height: 26px;
            background: rgba(0,0,0,0.6);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            pointer-events: none;
            z-index: 4;
        }
        .video-badge svg { width: 13px; height: 13px; }
        .video-duration {
            position: absolute;
            bottom: 6px; right: 6px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 7px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        .gif-badge {
            position: absolute;
            top: 6px; right: 6px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 10px;
            font-weight: 700;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 6px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.5;
            letter-spacing: 0.06em;
        }
        .comment-count-badge {
            position: absolute;
            top: 6px; left: 6px;
            display: flex;
            align-items: center;
            gap: 3px;
            background: rgba(0,0,0,0.62);
            color: #fff;
            font-size: 11px;
            font-weight: 600;
            font-variant-numeric: tabular-nums;
            font-family: 'Instrument Sans', sans-serif;
            padding: 2px 7px;
            border-radius: 3px;
            pointer-events: none;
            z-index: 4;
            line-height: 1.6;
            letter-spacing: 0.03em;
        }
        .comment-count-badge svg { width: 11px; height: 11px; }
        .critique-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--accent);
            padding: 7px 12px;
            border: 1px solid var(--accent);
            border-radius: 4px;
            white-space: nowrap;
        }
        html.light .critique-indicator { color: #8a6515; border-color: #8a6515; }
        .lb-critique-num {
            position: absolute;
            top: 14px; left: 16px;
            background: rgba(0,0,0,0.55);
            color: #fff;
            font-size: 14px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            padding: 4px 10px;
            border-radius: 4px;
            z-index: 1020;
            pointer-events: none;
            display: none;
        }

        /* Favorites toast */
        #favToast {
            position: fixed;
            bottom: 28px;
            left: 50%;
            transform: translateX(-50%) translateY(12px);
            background: rgba(20,20,22,0.92);
            color: #fff;
            padding: 9px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
            letter-spacing: 0.02em;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s, transform 0.2s;
            z-index: 2000;
            white-space: nowrap;
        }
        html.light #favToast { background: rgba(40,40,44,0.92); }
        #favToast.visible {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        /* Gallery Grid */
        .gallery-container {
            max-width: 1600px;
            margin: 0 auto;
            padding: 24px;
        }

        @media (max-width: 768px) {
            .gallery-container {
                padding: 12px;
            }
        }

        @media (max-width: 480px) {
            .gallery-container {
                padding: 8px;
            }
        }

        .gallery-grid {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .gallery-grid { gap: 4px; }
        }

        @media (max-width: 480px) {
            .gallery-grid { gap: 2px; }
        }

        .gallery-row {
            display: flex;
            gap: 10px;
        }

        @media (max-width: 900px) {
            .gallery-row { gap: 4px; }
        }

        @media (max-width: 480px) {
            .gallery-row { gap: 2px; }
        }

        .photo-card {
            position: relative;
            overflow: hidden;
            background: var(--bg-secondary);
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            flex-shrink: 0;
            /* Per-gallery setting (galleries.corner_style, default 'square'),
               applied by applyGalleryAppearance(). Unset here is 0px, the exact
               shape every gallery already had before this setting existed. */
            border-radius: var(--photo-radius, 0px);
        }

        .photo-card:hover {
            transform: scale(1.01);
            box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
        }

        .photo-card img {
            width: 100%;
            height: 100%;
            display: block;
            object-fit: cover;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .photo-card img.loaded {
            opacity: 1;
        }

        .photo-card .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-card .loading::after {
            content: '';
            width: 24px;
            height: 24px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(0, 0, 0, 0.7) 0%,
                transparent 50%
            );
            opacity: 0;
            transition: opacity 0.3s;
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 8px;
            padding: 12px;
        }

        @media (max-width: 768px) {
            .photo-overlay {
                opacity: 0.6;
            }
        }

        .photo-card:hover .photo-overlay {
            opacity: 1;
        }

        .photo-name {
            display: none;
        }

        .photo-favorite {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            transition: color 0.2s;
            flex-shrink: 0;
        }

        .photo-favorite:hover {
            color: #dc3250;
        }

        .photo-favorite.favorited {
            color: #dc3250;
        }

        .photo-favorite svg {
            width: 16px;
            height: 16px;
            transition: fill 0.2s;
        }

        .photo-favorite.favorited svg {
            fill: #dc3250;
        }

        .lightbox-favorite-btn {
            position: absolute;
            top: 110px;
            right: 20px;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 1010;
        }

        @media (max-width: 768px) {
            .lightbox-favorite-btn {
                display: none;
            }
        }

        .lightbox-favorite-btn:hover {
            color: #dc3250;
        }

        .lightbox-fullscreen-btn {
            position: absolute;
            top: 50px;
            right: 20px;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 1010;
        }
        .lightbox-fullscreen-btn svg { width: 16px; height: 16px; }
        .lightbox-fullscreen-btn:hover {
            color: var(--accent);
        }
        @media (max-width: 768px) {
            .lightbox-fullscreen-btn { display: none; }
        }

        .lightbox-comment-btn {
            position: absolute;
            top: 80px;
            right: 20px;
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: var(--text-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
            z-index: 1010;
        }
        .lightbox-comment-btn svg { width: 16px; height: 16px; }
        .lightbox-comment-btn:hover {
            color: var(--accent);
        }
        @media (max-width: 768px) {
            .lightbox-comment-btn { display: none; }
        }
        .lb-comment-count {
            position: absolute;
            top: -4px; right: -4px;
            min-width: 18px;
            height: 18px;
            padding: 0 4px;
            background: var(--accent);
            color: #1a1a1a;
            border-radius: 9px;
            font-size: 10px;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            display: none;
            align-items: center;
            justify-content: center;
            line-height: 1;
        }
        .lb-comment-count.visible { display: flex; }
        .lb-btn .lb-comment-count { background: var(--accent); color: #1a1a1a; }

        .lightbox-favorite-btn.favorited {
            color: #dc3250;
        }

        .lightbox-favorite-btn svg {
            width: 16px;
            height: 16px;
            transition: fill 0.2s;
        }

        .lightbox-favorite-btn.favorited svg {
            fill: #dc3250;
        }

        /* Mobile action bar — visible only on mobile */
        /* ── MOBILE LIGHTBOX OVERLAY ── */
        /* Floating overlay : actions auto-hide après 3s, réapparaissent au tap */
        /* absolute, not fixed: this is a descendant of .lightbox, which is itself
           `position: fixed; inset: 0`, so the geometry is identical — but a `fixed`
           descendant of a top-layer (fullscreen) element does not resolve reliably
           across engines, which is what made the favorite/download bar vanish in
           mobile fullscreen. Anchoring to .lightbox follows it into fullscreen. */
        .lb-mobile-overlay {
            display: none;
            position: absolute;
            inset: 0;
            z-index: 1015;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .lb-mobile-overlay { display: block; }
        }

        /* Barre du haut : fermer + plein écran */
        .lb-top-bar {
            position: absolute;
            top: 0; left: 0; right: 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 16px;
            padding-top: max(12px, env(safe-area-inset-top));
            background: linear-gradient(to bottom, rgba(0,0,0,0.7) 0%, transparent 100%);
            pointer-events: auto;
            transition: opacity 0.35s;
        }

        /* Barre du bas : fav + télécharger + compteur */
        .lb-bottom-bar {
            position: absolute;
            bottom: calc(20px + env(safe-area-inset-bottom));
            right: 20px;
            left: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            pointer-events: auto;
            transition: opacity 0.35s;
        }

        .lightbox:fullscreen .lb-bottom-bar,
        .lightbox:-webkit-full-screen .lb-bottom-bar {
            bottom: calc(28px + env(safe-area-inset-bottom));
        }

        .lb-top-bar.hidden,
        .lb-bottom-bar.hidden,
        #lightboxSocialWidget.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* Boutons overlay */
        .lb-btn {
            position: relative;
            width: 44px; height: 44px;
            border-radius: 50%;
            background: rgba(0,0,0,0.45);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.15);
            color: #fff;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            font-family: inherit;
            text-decoration: none;
            transition: background 0.2s;
            -webkit-tap-highlight-color: transparent;
        }
        .lb-btn:active { background: rgba(201,169,98,0.5); }
        .lb-btn svg { width: 20px; height: 20px; }

        .lb-btn.fav-active { border-color: #dc3250; }
        .lb-btn.fav-active svg { fill: #dc3250; stroke: #dc3250; }

        /* ══════════════════════════════════════════════════════════════════
           SLIDESHOW

           A separate overlay, NOT a mode of .lightbox. The lightbox carries
           pinch-zoom-toward-midpoint, swipe nav, the comment drawer and its own
           fullscreen handling; overloading it would put all of that at risk for
           no gain. The two share nothing but the audio button host.

           Same rule as .lightbox: nothing inside here may be `position: fixed`.
           This element is what requestFullscreen() is called on, and a fixed
           descendant of a top-layer element does not resolve reliably across
           engines. .slideshow is itself fixed/inset:0, so absolute children get
           identical geometry in both normal and fullscreen mode.
           ══════════════════════════════════════════════════════════════════ */
        .slideshow {
            position: fixed;
            inset: 0;
            z-index: 1200; /* above .lightbox (1000) — the two are never open together, but this keeps intent explicit */
            background: #000;
            display: none;
            overflow: hidden;
        }
        .slideshow.active { display: block; }
        .slideshow.hide-cursor { cursor: none; }

        .ss-stage { position: absolute; inset: 0; }

        /* One <img> layer per slide. Layers are appended (so the incoming one paints
           on top by DOM order) and the outgoing one is removed once the animation has
           run — which is also why the entry animation is a keyframe and not a
           transition: a fresh element has no previous value to transition from. */
        .ss-img {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
            opacity: 0;
        }
        .ss-img.ss-fade { animation: ssFadeIn 600ms ease-out forwards; }
        .ss-img.ss-slide { animation: ssSlideIn 350ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .ss-img.ss-slide.ss-rev { animation-name: ssSlideInRev; }

        /* Ken Burns fills the frame instead of fitting it — a slow push on a letterboxed
           image would just drift the bars around. Two animations run at once: the 600ms
           crossfade and the 8s movement. */
        .ss-img.ss-kenburns { object-fit: cover; }
        .ss-img.ss-kenburns.ss-ko0 { animation: ssFadeIn 600ms ease-out forwards, ssKb0 8s ease-out forwards; }
        .ss-img.ss-kenburns.ss-ko1 { animation: ssFadeIn 600ms ease-out forwards, ssKb1 8s ease-out forwards; }
        .ss-img.ss-kenburns.ss-ko2 { animation: ssFadeIn 600ms ease-out forwards, ssKb2 8s ease-out forwards; }
        .ss-img.ss-kenburns.ss-ko3 { animation: ssFadeIn 600ms ease-out forwards, ssKb3 8s ease-out forwards; }

        @keyframes ssFadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes ssSlideIn {
            from { opacity: 0; transform: translateX(30%); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes ssSlideInRev {
            from { opacity: 0; transform: translateX(-30%); }
            to   { opacity: 1; transform: translateX(0); }
        }
        @keyframes ssKb0 { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(-1%, -1%); } }
        @keyframes ssKb1 { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(1%, -1%); } }
        @keyframes ssKb2 { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(-1%, 1%); } }
        @keyframes ssKb3 { from { transform: scale(1) translate(0, 0); } to { transform: scale(1.12) translate(1%, 1%); } }

        /* Progress bar. Re-created per slide so the animation restarts from 0 — and
           removed on pause rather than paused in place, so a paused slideshow shows no
           bar at all instead of a misleading frozen one. */
        .ss-progress {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgba(255,255,255,0.7);
            transform: scaleX(0);
            transform-origin: left center;
            z-index: 3;
        }
        .ss-progress.running { animation: ssProgress linear forwards; }
        @keyframes ssProgress { from { transform: scaleX(0); } to { transform: scaleX(1); } }

        .ss-toolbar {

            bottom: 0;
            left: 0;
            right: 0;
            z-index: 4;
            display: flex;

        /* Desktop-only: fullscreen mode resizes the lightbox content to fill the

        @media (min-width: 769px) and (min-height: 501px) {

        #lightboxSocialLinks svg { width: 16px; height: 16px; fill: currentColor; }
        .lightbox-social-toggle-btn {
            width: 20px;
            height: 20px;
            background: none;
            border: none;
            color: rgba(255,255,255,0.7);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: color 0.2s;
        }
        .lightbox-social-toggle-btn svg { width: 16px; height: 16px; }
        .lightbox-social-toggle-btn:hover { color: var(--accent); }
        .lightbox-social-toggle-btn.pulse { animation: kbPulse 0.5s ease; }

        @media (max-width: 768px) {
            #lightboxSocialWidget {
                bottom: calc(20px + env(safe-area-inset-bottom, 0px));
                left: 20px;
                right: auto;
            }
            .lightbox-social-toggle-btn {
                width: 44px;
                height: 44px;
                border-radius: 50%;
                background: rgba(0,0,0,0.45);
                backdrop-filter: blur(8px);
                border: 1px solid rgba(255,255,255,0.15);
            }
            .lightbox-social-toggle-btn svg { width: 20px; height: 20px; }
            #lightboxSocialLinks a { width: 44px; height: 44px; }
            #lightboxSocialLinks svg { width: 20px; height: 20px; }
        }

        .social-footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 90;
            padding: 10px 20px;
            border-top: 1px solid var(--border);
            text-align: center;
            background: rgba(10,10,11,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .social-footer.visible { opacity: 1; pointer-events: auto; }
        html.light .social-footer { background: rgba(245,244,240,0.85); }
        /* Avoid footer overlapping last gallery row */
        .gallery-container { padding-bottom: 64px; }

        .social-footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 17px;
            flex-wrap: wrap;
        }

        .social-footer-links a {
            color: var(--text-secondary);
            transition: color 0.2s;
            display: flex;
            align-items: center;
        }

        .social-footer-links a:hover {
            color: var(--accent);
        }

        .social-footer-links svg {
            width: 17px;
            height: 17px;
            fill: currentColor;
        }

        /* ══════════════════════════════════════════════════════════════════
           COLLECTION INDEX VIEW
           This document serves both /preview/:id and /collection/:id. The
           collection index lives here (rather than the gallery view moving to
           collection.html) so the <audio> element below survives navigating
           between galleries — a montage must not stop when a gallery opens.
           Ported from the old collection.html; `.download-all-btn` already
           exists here for the hero, so the index one is `.coll-download-btn`.
        ══════════════════════════════════════════════════════════════════ */
        .bg-image {
            position: fixed; inset: 0; width: 100%; height: 100%;
            object-fit: cover; opacity: 0;
            transition: opacity 1.2s ease; z-index: 0; pointer-events: none;
        }
        .bg-image.loaded { opacity: 0.3; }
        html.light .bg-image.loaded { opacity: 0.45; }
        .bg-overlay {
            position: fixed; inset: 0;
            background: linear-gradient(to bottom, rgba(10,10,11,0.15) 0%, rgba(10,10,11,0.7) 100%);
            z-index: 1; pointer-events: none;
        }
        html.light .bg-overlay { background: rgba(245,244,240,0.35); }

        .site-header {
            position: relative; z-index: 10;
            border-bottom: 1px solid var(--border);
            padding: 20px 32px; text-align: center; overflow: hidden;
        }
        .logo-wrap { text-align: center; margin-bottom: 20px; }
        .logo {
            display: inline-block; height: auto; max-height: 96px;
            max-width: min(380px, 75vw); width: auto; object-fit: contain;
            /* Same value as .hero-logo, kept in sync deliberately. This sits over
               .bg-image too, at milder risk (the cover runs at 30% opacity under
               .bg-overlay), so no scrim is needed here, only the shadow. */
            filter: drop-shadow(0 1px 3px rgba(0,0,0,0.7)) drop-shadow(0 0 8px rgba(0,0,0,0.45));
        }
        .collection-title {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 300; letter-spacing: -0.01em;
            color: var(--text); margin-bottom: 6px;
            opacity: 0; transform: translateY(12px);
            animation: fadeUp 0.6s ease 0.1s forwards;
        }
        .collection-meta {
            font-size: 12px; color: var(--muted); letter-spacing: 0.06em;
            opacity: 0; animation: fadeUp 0.6s ease 0.2s forwards;
        }
        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        .coll-download-wrap {
            padding: 20px 32px 0; display: flex; justify-content: center;
            position: relative; z-index: 10;
        }
        .coll-download-btn {
            display: inline-flex; align-items: center; gap: 8px;
            background: #c9a962; border: none; color: #0a0a0b;
            padding: 10px 18px; font-size: 13px; border-radius: 3px;
            cursor: pointer; font-family: inherit; font-weight: 500;
            transition: background 0.2s;
        }
        .coll-download-btn:hover { background: #dfc07a; }
        .coll-download-btn svg { width: 14px; height: 14px; }

        .galleries-container {
            max-width: 1100px; margin: 0 auto; padding: 32px;
            position: relative; z-index: 10;
        }
        .galleries-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; padding-bottom: 64px; }
        @media (max-width: 800px) { .galleries-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; } }
        @media (max-width: 480px) { .galleries-grid { grid-template-columns: 1fr; gap: 12px; } }

        .gallery-card {
            background: var(--bg2); border: 1px solid var(--border);
            border-radius: 6px; overflow: hidden;
            display: flex; flex-direction: column; transition: border-color 0.2s;
        }
        .gallery-card:hover { border-color: var(--border2); }
        .gallery-card-cover {
            display: block; position: relative; aspect-ratio: 3 / 2;
            overflow: hidden; cursor: pointer; background: var(--bg3);
            text-decoration: none; flex-shrink: 0;
        }
        .gallery-card-cover img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.35s ease; }
        .gallery-card-cover:hover img { transform: scale(1.03); }
        .gallery-card-cover-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        .gallery-card-cover-placeholder svg { width: 32px; height: 32px; color: var(--border2); }
        .gallery-card-cover-overlay {
            position: absolute; inset: 0; background: rgba(10,10,11,0.45);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .gallery-card-cover:hover .gallery-card-cover-overlay { opacity: 1; }
        .gallery-card-cover-overlay span {
            font-size: 12px; font-weight: 600; letter-spacing: 0.1em;
            text-transform: uppercase; color: #fff;
        }
        .gallery-card-body { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
        .gallery-card-info { flex: 1; }
        .gallery-card-name {
            font-size: 14px; font-weight: 500; color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px;
        }
        .gallery-card-meta { font-size: 11px; color: var(--muted); letter-spacing: 0.03em; }
        .gallery-card-actions { display: flex; gap: 7px; align-items: center; }
        .btn-card-icon, .btn-card-dl {
            flex: 1; height: 32px;
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            border-radius: 3px; cursor: pointer;
            font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
            text-transform: uppercase; font-family: inherit;
            text-decoration: none; white-space: nowrap;
        }
        .btn-card-icon {
            background: transparent; border: 1px solid var(--border2); color: var(--muted);
            transition: color 0.15s, border-color 0.15s;
        }
        .btn-card-icon:hover { color: var(--text); border-color: var(--muted); }
        .btn-card-dl { background: #c9a962; border: none; color: #0a0a0b; transition: background 0.15s; }
        .btn-card-dl:hover { background: #dfc07a; }
        .btn-card-icon svg, .btn-card-dl svg { width: 13px; height: 13px; flex-shrink: 0; }
        .btn-card-icon.copied { color: #52a878; border-color: #52a878; }

        /* ── Audio montage player ──────────────────────────────────────────
           Deliberately a single 44px control: the smallest thing that can start
           and stop playback. Scrubbing, skipping and the track title are handed
           to the OS media controls via the Media Session API instead of costing
           screen space. The progress ring is a conic gradient, so it takes no
           layout at all. z-index sits above the lightbox layer (1000–1030) so
           playback can be stopped even while a photo is open. */
        /* The audio button is docked into existing chrome, never floating: a floating
           position collided with the hero title, the photos, the footer and the
           lightbox's "@" widget, and being a sibling of .lightbox made it vanish in
           fullscreen. placeAudioButton() moves this one element between hosts; the
           styling is per-host so it matches whatever cluster it currently sits in. */
        .audio-player {
            position: relative;
            display: none; align-items: center; justify-content: center;
            padding: 0; background: none; border: none;
            color: inherit; cursor: pointer;
        }
        .audio-player.visible { display: inline-flex; }
        .audio-player svg { position: relative; z-index: 1; }
        /* Fade-in when placeAudioButton() re-parents the button between clusters, so it
           eases in instead of snapping into the sticky bar. The duration lives here and
           nowhere else: the JS re-parents synchronously and only toggles the class, so
           there is no timer to keep in sync. */
        .audio-player { transition: opacity 0.14s ease, transform 0.14s ease; }
        .audio-player.audio-moving { opacity: 0; transform: scale(0.85); }
        /* Progress ring — costs no layout, adapts to whatever size the host gives. */
        .audio-player::before {
            content: ''; position: absolute; inset: -4px; border-radius: 50%;
            background: conic-gradient(var(--accent) calc(var(--audio-progress, 0) * 1%), transparent 0);
            -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
                    mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 2px));
            pointer-events: none;
        }

        /* Collection index host — centred under the header. The margin lives on the
           button, not the wrapper, so nothing takes space when there is no montage
           (the button is display:none then). */
        .coll-audio-wrap { display: flex; justify-content: center; position: relative; z-index: 10; }
        .coll-audio-wrap .audio-player { margin-top: 20px; }

        /* ── Wide labelled variant: hero, sticky bar, collection index ───────
           A 34px unlabelled circle between two wide labelled buttons went unnoticed,
           and the montage is the feature most worth noticing. All three page-chrome
           hosts share this form, deliberately: the sticky bar takes over from the hero
           on scroll, and letting the button shrink into a circle at that handoff made
           it visibly morph mid-page. It stays the same control throughout.
           Only the lightbox / slideshow hosts below keep an icon, and there they have
           no choice (20px over the photo, a column of 44px circles, a 34px toolbar).
           Metrics mirror .download-all-btn so the hero pair stacks as one unit. */
        .hero-actions .audio-player,
        .actions-bar .audio-player,
        .coll-audio-wrap .audio-player {
            gap: 8px;
            padding: 10px 18px;
            border-radius: 3px;
            border: 1px solid rgba(255,255,255,0.35);
            color: #fff; background: rgba(0,0,0,0.25);
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            font-family: inherit; font-size: 13px; font-weight: 500;
            white-space: nowrap;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
            overflow: hidden; /* clips the progress bar to the rounded corners */
            /* Same note as above: re-declare the fade or placeAudioButton() stops
               easing when it re-parents the button into this host. */
            transition: background 0.2s, border-color 0.2s, opacity 0.14s ease, transform 0.14s ease;
        }
        .hero-actions .audio-player:hover,
        .actions-bar .audio-player:hover,
        .coll-audio-wrap .audio-player:hover { background: rgba(0,0,0,0.45); border-color: #fff; }
        /* "un tout petit peu plus gros" — 16px instead of the 14px the icon hosts use. */
        .hero-actions .audio-player svg,
        .actions-bar .audio-player svg,
        .coll-audio-wrap .audio-player svg { width: 16px; height: 16px; }
        /* Full width ONLY in the hero stack, where it has to match the download button.
           On the collection index .coll-audio-wrap is a page-wide centring flex box, so
           100% there would stretch the button across the whole page. */
        .hero-actions .audio-player { width: 100%; }

        /* The label exists in the three page-chrome hosts; in the lightbox and the
           slideshow the button is icon-only and the name lives in its title/aria-label. */
        .audio-player .audio-btn-label { display: none; }
        .hero-actions .audio-player .audio-btn-label,
        .actions-bar .audio-player .audio-btn-label,
        .coll-audio-wrap .audio-player .audio-btn-label { display: inline; }

        /* The circular ::before ring cannot survive a wide button: border-radius: 50%
           plus a radial-gradient(farthest-side) mask turn it into an ellipse of uneven
           thickness. Replaced by a 2px bar along the bottom edge, driven by the SAME
           --audio-progress property — the idiom .ss-progress already uses for the
           slideshow (2px, scaleX, origin left). */
        .hero-actions .audio-player::before,
        .actions-bar .audio-player::before,
        .coll-audio-wrap .audio-player::before { display: none; }
        .hero-actions .audio-player::after,
        .actions-bar .audio-player::after,
        .coll-audio-wrap .audio-player::after {
            content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 2px;
            background: var(--accent);
            transform: scaleX(calc(var(--audio-progress, 0) / 100));
            transform-origin: left center;
            pointer-events: none;
        }
        /* The sticky bar is the one host that follows the site theme (the hero and the
           collection index always sit on a photo). text-shadow has to go with it: the
           wide variant carries one for legibility over a photo, and dark text on a light
           bar with a dark glow reads as smudged — same treatment as .slideshow-btn. */
        html.light .actions-bar .audio-player {
            border-color: var(--border); color: var(--text); background: transparent;
            text-shadow: none;
        }
        html.light .actions-bar .audio-player:hover { background: var(--bg2); border-color: var(--muted); }

        /* ── Sticky bar on a phone ───────────────────────────────────────────
           POSITION IS LOAD-BEARING. This block must come after every rule it overrides:
           the shared `.show-gallery-btn, .back-to-collection, .slideshow-btn` set, the
           `.critique-indicator` base rule, and the wide `.actions-bar .audio-player`
           variant just above. A media query adds no specificity, so at equal specificity
           only source order decides. Putting it earlier is exactly the bug this fixes,
           and putting it earlier again silently reverts three of the four rules below,
           which is easy to miss because the fourth keeps working.

           It sizes the three bar buttons identically, which they never were
           (.slideshow-btn had no ≤768px rule at all and stayed at 13px/18px between 481
           and 768px while its neighbours shrank), and drops the montage button's 16px
           icon to the 14px its neighbours use.

           The ellipsis workaround that used to live here is gone: the back link drops its
           label under 480px instead of truncating. The montage button's label is NOT
           dropped at any width, since losing it on scroll is the morph the wide variant
           exists to prevent. */
        @media (max-width: 768px) {
            .back-to-collection,
            .actions-bar .audio-player,
            .slideshow-btn {
                font-size: 11px;
                padding: 9px 10px;
                gap: 6px;
            }
            .back-to-collection svg,
            .actions-bar .audio-player svg,
            .slideshow-btn svg {
                width: 14px;
                height: 14px;
            }
        }

        /* Under 480px the bar cannot hold three labels, so one has to go. It is the back
           link's: a back ARROW is unambiguous, which is exactly what the two play triangles
           were not. The width is spent where the ambiguity actually hurt. */
        @media (max-width: 480px) {
            .back-to-collection span { display: none; }
            /* No flex override here: `margin-right: auto` must keep doing its job or the
               arrow slides over to the right-hand cluster. Padding only. */
            .back-to-collection { padding: 9px 11px; }
            /* The critique chip is a passive indicator, and every photo already carries its
               number, so its word is the cheapest thing in the bar to drop. It is also the
               single most expensive item when shown: 101px measured. */
            .critique-indicator { font-size: 0; padding: 9px 9px; gap: 0; }
        }
        /* Below 360px even the chip's icon does not fit alongside three controls. */
        @media (max-width: 359px) {
            .critique-indicator { display: none !important; }
        }

        /* Lightbox desktop: bare 20px icon continuing the right-hand control stack. */
        .lightbox .audio-player {
            position: absolute; top: 170px; right: 20px;
            width: 20px; height: 20px;
            color: rgba(255,255,255,0.7);
            transition: color 0.2s, opacity 0.14s ease, transform 0.14s ease;
        }
        .lightbox .audio-player:hover { color: #fff; }
        .lightbox .audio-player svg { width: 18px; height: 18px; }
        /* Lightbox mobile: a normal .lb-bottom-bar entry, so it inherits the bar's
           auto-hide for free. Reset the absolute placement used on desktop. */
        .lb-bottom-bar .audio-player {
            position: relative; top: auto; right: auto;
            width: 44px; height: 44px; border-radius: 50%;
            background: rgba(0,0,0,0.45); color: #fff;
            backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
        }
        .lb-bottom-bar .audio-player svg { width: 20px; height: 20px; }
    </style>
</head>
<body>
    <!-- Hero Section -->
    <section class="hero" id="heroSection" style="display: none;">
        <img class="hero-bg" id="heroBg">
        <img src="/api/logo" alt="Logo" class="hero-logo">
        <h1 id="eventTitle"></h1>
        <div class="hero-actions">
            <button class="show-gallery-btn" id="showGalleryBtn" onclick="scrollToGallery()">
                <span id="showGalleryText"></span>
            </button>
            <!-- Audio stacked directly ABOVE Download All, in a column that stretches
                 both to the same width. When downloads are disabled the existing code
                 hides #downloadAllBtn, and a display:none flex item consumes no gap —
                 so the audio button simply lands where Download All was, with no
                 conditional layout code. -->
            <div class="hero-actions-stack">
                <span id="heroAudioSlot">
                    <!-- Headphones, and deliberately NOT a play/pause pair. This glyph says
                         WHAT the button is; the label ("Lancer l'audio" / "Mettre en pause")
                         and the 2px progress bar say what it is DOING. The old play triangle
                         was byte-for-byte the slideshow button's icon, and in the slideshow
                         toolbar it sat right next to the slideshow's own play control. Outline
                         style matches the back arrow beside it (chrome icons are stroked here;
                         only real transport controls are filled). -->
                    <button class="audio-player" id="audioPlayer" onclick="toggleMontage()">
                        <svg id="audioIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-7a9 9 0 0 1 18 0v7a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3"/></svg>
                        <span class="audio-btn-label" id="audioBtnText"></span>
                    </button>
                </span>
                <a class="download-all-btn" id="downloadAllBtn" href="#">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                    <span id="downloadAllText"></span>
                </a>
            </div>
        </div>
    </section>

    <!-- Actions Bar -->
    <div class="actions-bar" id="actionsBar" style="display: none;">
        <a class="back-to-collection" id="backToCollection" href="#" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5m0 0l7 7m-7-7l7-7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            <span id="backToCollectionText"></span>
        </a>
        <span class="critique-indicator" id="critiqueIndicator" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><line x1="10" y1="6" x2="21" y2="6"/><line x1="10" y1="12" x2="21" y2="12"/><line x1="10" y1="18" x2="21" y2="18"/><path d="M4 6h1v4M4 10h2M6 18H4c0-1 2-2 2-3s-1-1.5-2-1" stroke-linecap="round" stroke-linejoin="round"/></svg>
            Critique
        </span>
        <span id="barAudioSlot"></span>
        <!-- A screen with a play triangle inside it. The bare triangle this replaces was
             identical to the audio button's. Keeping a triangle but enclosing it says
             "plays full screen" rather than just "play", and it is now the only triangle
             in the bar. Outline frame, filled triangle, legible down to 14px. -->
        <button class="slideshow-btn" id="slideshowBtn" onclick="openSlideshow()" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M12 17v4M8 21h8"/><path d="M10 8.5l4 2.5-4 2.5z" fill="currentColor" stroke="none"/></svg>
            <span id="slideshowBtnText"></span>
        </button>
    </div>

    <!-- Gallery Grid -->
    <div class="gallery-container" id="galleryContainer" style="display: none;">
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <!-- Lightbox -->
    <!-- Slideshow overlay. A sibling of .lightbox, never a child: this element is the
         one passed to requestFullscreen(), and the audio button has to be re-parented
         INTO it (see placeAudioButton) or it would vanish in fullscreen. -->
    <div class="slideshow" id="slideshow">
        <div class="ss-stage" id="ssStage"></div>
        <div class="ss-progress" id="ssProgress"></div>
        <div class="ss-toolbar" id="ssToolbar">
            <button class="ss-btn" id="ssPrevBtn" onclick="slideshowPrev()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button class="ss-btn" id="ssPlayBtn" onclick="toggleSlideshowPlay()">
                <svg id="ssPlayIcon" viewBox="0 0 24 24" fill="currentColor"></svg>
            </button>
            <button class="ss-btn" id="ssNextBtn" onclick="slideshowNext()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <span class="ss-counter" id="ssCounter"></span>
            <span id="ssAudioSlot"></span>
            <button class="ss-btn" id="ssCloseBtn" onclick="closeSlideshow()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18" stroke-linecap="round"/><line x1="6" y1="6" x2="18" y2="18" stroke-linecap="round"/></svg>
            </button>
        </div>
    </div>

    <div class="lightbox" id="lightbox">
        <!-- Desktop Controls -->
        <button class="lightbox-close" onclick="closeLightbox()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>

            document.getElementById('lightboxSocialToggleBtn').setAttribute('aria-label', t.socialLinks);
            document.getElementById('slideshowBtnText').textContent = t.slideshow;
            document.getElementById('slideshowBtn').title = t.slideshowHint;
            document.getElementById('slideshowBtn').setAttribute('aria-label', t.slideshow);
            [['ssPrevBtn', t.slideshowPrev], ['ssNextBtn', t.slideshowNext], ['ssCloseBtn', t.slideshowClose]]
                .forEach(([id, label]) => {
                    const el = document.getElementById(id);
                    el.title = label;
                    el.setAttribute('aria-label', label);
                });
            // The play/pause button is deliberately NOT labelled here: its label depends
            // on playback state, and reading that state from this function would touch a
            // `let` declared further down — applyStaticTranslations() runs at load time,
            // so that would be a temporal-dead-zone ReferenceError aborting the script.
            // openSlideshow() labels it instead, by which point everything is initialised.
        }
        applyStaticTranslations();

        function scrollToGallery() {
            const gallery = document.getElementById('galleryContainer');
            const actionsBar = document.querySelector('.actions-bar');
            const offset = actionsBar ? actionsBar.offsetHeight : 0;
            const top = gallery.getBoundingClientRect().top + window.scrollY - offset;
            window.scrollTo({ top, behavior: 'smooth' });
        }

        applyTheme();

        // This document serves BOTH /preview/:id and /collection/:id. In collection
        // mode it renders the collection index itself and mounts galleries in place
        // on #/gallery/:id — so the audio montage below is never torn down by a
        // navigation, which a separate collection page could not achieve.
        const _pathSegments = window.location.pathname.split('/').filter(Boolean);
        const _isCollectionMode = _pathSegments[0] === 'collection';
        const collectionId = _isCollectionMode ? _pathSegments[1] : null;

        const _params = new URLSearchParams(window.location.search);
        // Still honoured for a gallery opened by direct link from a collection.
        const fromCollection = _params.get('from');
        const critiqueMode = _params.get('critique') === '1';

        // Mutable: reassigned each time a gallery is mounted in collection mode.
        let galleryId = _isCollectionMode ? null : _pathSegments[_pathSegments.length - 1];
        let photos = [];
        let currentPhotoIndex = 0;
        let _collectionData = null;

        // ── VIDEO HELPERS ──
        const VIDEO_EXTENSIONS = ['mp4', 'mov', 'webm', 'm4v'];
        function isVideoPhoto(photo) {
            if (photo.type) return photo.type === 'video';
            const ext = (photo.filename.split('.').pop() || '').toLowerCase();
            return VIDEO_EXTENSIONS.includes(ext);
        }
        function formatDuration(seconds) {
            const m = Math.floor(seconds / 60), s = Math.floor(seconds % 60);
            return `${m}:${String(s).padStart(2, '0')}`;
        }

        // Visitor identity — persisted in localStorage, shared across all galleries
        function getVisitorId() {
            let id = localStorage.getItem('delyvr_visitor_id');
            if (!id) {
                id = 'v-' + Math.random().toString(36).slice(2, 10) + '-' + Date.now().toString(36);
                localStorage.setItem('delyvr_visitor_id', id);
            }
            return id;
        }
        const visitorId = getVisitorId();

        // Commenter display name — separate from visitorId, optional, self-declared
        function getCommenterName() {
            return localStorage.getItem('delyvr_commenter_name') || '';
        }
        function setCommenterName(name) {
            if (name) localStorage.setItem('delyvr_commenter_name', name);
            else localStorage.removeItem('delyvr_commenter_name');
        }

        // Favorites state — only this visitor's favorites
        let localFavorites = new Set();
        let commentsEnabled = true;

        let _toastTimer = null;
        function showToast(message) {
            const el = document.getElementById('favToast');
            if (!el) return;
            el.textContent = message;
            el.classList.add('visible');
            clearTimeout(_toastTimer);
            _toastTimer = setTimeout(() => el.classList.remove('visible'), 2000);
        }
        function showFavToast(added) {
            showToast(added ? t.favAdded : t.favRemoved);
        }

        async function toggleFavorite(filename) {
            const wasFavorited = localFavorites.has(filename);
            // Optimistic update
            if (wasFavorited) { localFavorites.delete(filename); } else { localFavorites.add(filename); }
            showFavToast(!wasFavorited);

            // Update card button
            const btn = document.querySelector(`.photo-favorite[data-filename="${CSS.escape(filename)}"]`);
            if (btn) {
                btn.classList.toggle('favorited', !wasFavorited);
            }

            // Update lightbox button if same photo is open
            if (photos[currentPhotoIndex] && photos[currentPhotoIndex].filename === filename) {
                const favBtn = document.getElementById('lightboxFavorite');
                favBtn.classList.toggle('favorited', !wasFavorited);
                favBtn.querySelector('svg').setAttribute('fill', wasFavorited ? 'none' : 'white');
                // Sync mobile bar fav button
                const mobileBarFav = document.getElementById('lbMobileFav');
                if (mobileBarFav) {
                    mobileBarFav.classList.toggle('favorited', !wasFavorited);
                    mobileBarFav.querySelector('svg').setAttribute('fill', wasFavorited ? 'none' : '#dc3250');
                }
            }

            // Sync to server
            try {
                await fetch(`/api/gallery/${galleryId}/favorites`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, visitorId })
                });
            } catch (e) {
                // Revert on network error
                if (wasFavorited) { localFavorites.add(filename); } else { localFavorites.delete(filename); }
                if (btn) {
                    btn.classList.toggle('favorited', wasFavorited);
                }
            }
        }

        function toggleFavoriteFromLightbox() {
            const photo = photos[currentPhotoIndex];
            if (photo) toggleFavorite(photo.filename);
        }

        // ── COMMENTS ──
        let _commentDrawerFilename = null;
        let _commentDrawerComments = [];

        function setCommentButtonsVisible(visible) {
            const display = visible ? '' : 'none';
            document.getElementById('lightboxCommentBtn').style.display = display;
            const mobileBtn = document.getElementById('lbMobileComment');
            if (mobileBtn) mobileBtn.style.display = display;
        }

        function updateCommentButtonBadges(count) {
            [document.getElementById('lightboxCommentCount'), document.getElementById('lbMobileCommentCount')].forEach(el => {
                if (!el) return;
                el.textContent = count > 0 ? (count > 99 ? '99+' : String(count)) : '';
                el.classList.toggle('visible', count > 0);
            });
        }

        // Updates the grid badge, the lightbox button badge (if viewing this photo),
        // and the in-memory photos[] cache so subsequent re-renders stay correct.
        function updateCommentBadge(filename, count) {
            const photo = photos.find(p => p.filename === filename);
            if (photo) photo.commentCount = count;

            const card = document.querySelector(`.photo-card[data-filename="${CSS.escape(filename)}"]`);
            if (card) {
                let badge = card.querySelector('.comment-count-badge');
                if (count > 0) {
                    if (!badge) {
                        badge = document.createElement('div');
                        badge.className = 'comment-count-badge';
                        badge.innerHTML = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg><span></span>';
                        card.appendChild(badge);
                    }
                    badge.querySelector('span').textContent = count;
                } else if (badge) {
                    badge.remove();
                }
            }

            if (photos[currentPhotoIndex] && photos[currentPhotoIndex].filename === filename) {
                updateCommentButtonBadges(count);
            }
        }

        function formatRelativeTime(iso) {
            const diffMs = Date.now() - new Date(iso).getTime();
            const mins = Math.floor(diffMs / 60000);
            if (mins < 1) return locale === 'fr' ? 'À l\'instant' : 'Just now';
            if (mins < 60) return `${mins}m`;
            const hours = Math.floor(mins / 60);
            if (hours < 24) return `${hours}h`;
            const days = Math.floor(hours / 24);
            if (days < 7) return `${days}d`;
            return new Date(iso).toLocaleDateString(locale);
        }

        // Built via textContent only — comment text/name are free-form user input,
        // never inserted as innerHTML.
        function renderCommentRow(c) {
            const row = document.createElement('div');
            row.className = 'comment-row';
            const head = document.createElement('div');
            head.className = 'comment-row-head';
            const nameEl = document.createElement('span');
            nameEl.className = 'comment-row-name';
            nameEl.textContent = c.name || t.commentGuest;
            const timeEl = document.createElement('span');
            timeEl.className = 'comment-row-time';
            timeEl.textContent = formatRelativeTime(c.createdAt);
            head.appendChild(nameEl);
            head.appendChild(timeEl);
            const textEl = document.createElement('div');
            textEl.className = 'comment-row-text';
            textEl.textContent = c.text;
            row.appendChild(head);
            row.appendChild(textEl);
            return row;
        }

        function refreshCommentNameUI() {
            const name = getCommenterName();
            const asRow = document.getElementById('commentAsRow');
            const nameInput = document.getElementById('commentNameInput');
            if (name) {
                document.getElementById('commentAsText').textContent = name;
                asRow.style.display = 'flex';
                nameInput.style.display = 'none';
            } else {
                asRow.style.display = 'none';
                nameInput.style.display = '';
            }
        }
        document.getElementById('commentChangeNameBtn').addEventListener('click', () => {
            document.getElementById('commentAsRow').style.display = 'none';
            const nameInput = document.getElementById('commentNameInput');
            nameInput.style.display = '';
            nameInput.value = getCommenterName();
            nameInput.focus();
        });
        document.getElementById('commentTextInput').addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                submitComment();
            }
        });

        // Drawer geometry. The photo is NEVER resized when the drawer opens:
        // the lightbox reserves no space, the content is shifted left instead.
        const DRAWER_WIDTH = 300;
        const DRAWER_SHIFT = DRAWER_WIDTH / 2; // re-centres content in the space left over

        function isDrawerMobile() {
            return window.matchMedia('(max-width: 768px), (max-height: 500px)').matches;
        }

        // Shifts .lightbox-content left so the drawer doesn't sit on top of the
        // photo — without touching its size (a transform doesn't affect layout).
        // Clamped to the free margin actually available on the left, otherwise a
        // very wide photo would be pushed off the left edge of the screen.
        function updateDrawerShift() {
            const content = document.querySelector('.lightbox-content');
            if (!content) return;
            const open = document.getElementById('lightbox').classList.contains('drawer-open');
            content.style.transform = '';               // measure untransformed
            if (!open || isDrawerMobile()) return;
            const left = content.getBoundingClientRect().left;
            const shift = Math.min(DRAWER_SHIFT, Math.max(0, left));
            if (shift > 0) content.style.transform = `translateX(-${shift}px)`;
        }

        function openCommentDrawer() {
            if (!commentsEnabled) return;
            const photo = photos[currentPhotoIndex];
            if (!photo) return;
            _commentDrawerFilename = photo.filename;
            document.getElementById('commentDrawer').classList.add('open');
            // Backdrop on mobile only — on desktop it would dim the very photo
            // we are keeping visible next to the thread.
            if (isDrawerMobile()) document.getElementById('commentDrawerBackdrop').classList.add('open');
            document.getElementById('lightbox').classList.add('drawer-open');
            updateDrawerShift();
            refreshCommentNameUI();
            loadCommentsForCurrentPhoto();
        }

        function closeCommentDrawer() {
            document.getElementById('commentDrawer').classList.remove('open');
            document.getElementById('commentDrawerBackdrop').classList.remove('open');
            document.getElementById('lightbox').classList.remove('drawer-open');
            updateDrawerShift();
        }

        // Recompute the shift whenever the content box changes size — covers the
        // async preview load, switching photos and window resizes in one place.
        // A transform doesn't alter the observed box, so this can't loop.
        if (window.ResizeObserver) {
            const _lbContent = document.querySelector('.lightbox-content');
            if (_lbContent) new ResizeObserver(() => updateDrawerShift()).observe(_lbContent);
        }

        function renderCommentDrawerList() {
            const list = document.getElementById('commentDrawerList');
            list.innerHTML = '';
            document.getElementById('commentDrawerTitle').textContent = `${t.comments} (${_commentDrawerComments.length})`;
            if (_commentDrawerComments.length === 0) {
                const empty = document.createElement('div');
                empty.className = 'comment-empty';
                empty.textContent = t.commentEmpty;
                list.appendChild(empty);
                return;
            }
            _commentDrawerComments.forEach(c => list.appendChild(renderCommentRow(c)));
            list.scrollTop = list.scrollHeight;
        }

        async function loadCommentsForCurrentPhoto() {
            const filename = _commentDrawerFilename;
            try {
                const res = await fetch(`/api/gallery/${galleryId}/comments-public?filename=${encodeURIComponent(filename)}`);
                const json = res.ok ? await res.json() : { comments: [] };
                if (_commentDrawerFilename !== filename) return; // navigated away while loading
                _commentDrawerComments = json.comments || [];
            } catch (e) {
                if (_commentDrawerFilename !== filename) return;
                _commentDrawerComments = [];
            }
            renderCommentDrawerList();
        }

        async function submitComment() {
            const textInput = document.getElementById('commentTextInput');
            const text = textInput.value.trim();
            if (!text || !_commentDrawerFilename) return;
            const filename = _commentDrawerFilename;
            const nameInput = document.getElementById('commentNameInput');
            const name = (nameInput.style.display !== 'none' ? nameInput.value.trim() : getCommenterName()) || '';

            const optimistic = { id: 'tmp-' + Date.now(), name: name || null, text, createdAt: new Date().toISOString() };
            _commentDrawerComments.push(optimistic);
            renderCommentDrawerList();
            textInput.value = '';
            updateCommentBadge(filename, _commentDrawerComments.length);

            try {
                const res = await fetch(`/api/gallery/${galleryId}/comments`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename, visitorId, name, text })
                });
                if (!res.ok) throw new Error('failed');
                const json = await res.json();
                const idx = _commentDrawerComments.findIndex(c => c.id === optimistic.id);
                if (idx !== -1 && json.comment) _commentDrawerComments[idx] = json.comment;
                if (_commentDrawerFilename === filename) renderCommentDrawerList();
                if (name) { setCommenterName(name); refreshCommentNameUI(); }
                showToast(t.commentPosted);
            } catch (e) {
                _commentDrawerComments = _commentDrawerComments.filter(c => c.id !== optimistic.id);
                if (_commentDrawerFilename === filename) renderCommentDrawerList();
                updateCommentBadge(filename, _commentDrawerComments.length);
                showToast(t.commentError);
            }
        }

        // Switching galleries in collection mode reuses this same document, so
        // anything the previous gallery hid or left open has to be put back
        // explicitly. The window/document listeners are attached once and read
        // module state, so they are deliberately NOT re-attached here — doing so
        // would stack a new handler per gallery.
        function resetGalleryViewState() {
            photos = [];
            currentPhotoIndex = 0;
            localFavorites = new Set();
            _commentDrawerFilename = null;
            _commentDrawerComments = [];
            closeLightbox();
            closeSlideshow();   // `photos` was just emptied — a running slideshow would be stale
            resetZoom();
            closeCommentDrawer();
            document.getElementById('notFound').classList.remove('active');
            document.getElementById('passwordGate').classList.remove('active');
            document.getElementById('loadingState').style.display = '';
            document.getElementById('galleryGrid').innerHTML = '';
            const heroBg = document.getElementById('heroBg');
            heroBg.classList.remove('loaded');
            heroBg.removeAttribute('src');
            // Clear the parallax offset left by the previous gallery. Written
            // directly rather than through requestHeroParallax(): this function runs
            // synchronously at the top of loadGallery(), which the bootstrap calls
            // before the parallax state further down the script is initialised.
            heroBg.style.transform = '';
            // A previous gallery with downloads disabled hid these — restore them,
            // the new gallery decides for itself below.
            ['downloadAllBtn', 'lightboxDownload', 'lbMobileDownload'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.style.display = '';
            });
            window.scrollTo(0, 0);
        }

        async function loadGallery() {
            resetGalleryViewState();
            try {
                // Get gallery info
                const infoRes = await fetch(`/api/gallery/${galleryId}/info`);
                if (infoRes.status === 401) return showPasswordGate();
                if (infoRes.status === 410) return showExpiredState();
                if (!infoRes.ok) throw new Error('Not found');
                const info = await infoRes.json();
                applyGalleryAppearance(info); // before renderGallery() reads getTargetRowHeight()/getRowGap()

                // Finalize locale from the gallery's resolved client language
                locale = resolveClientLocale(info.clientLanguage);
                t = translations[locale];
                applyStaticTranslations();

                // Get photos list
                const photosRes = await fetch(`/api/gallery/${galleryId}/photos`);
                if (!photosRes.ok) throw new Error('Failed to load photos');
                const data = await photosRes.json();
                
                photos = data.photos;
                commentsEnabled = data.commentsEnabled !== false;
                setCommentButtonsVisible(commentsEnabled);

                // Hide loading, show content
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('heroSection').style.display = 'flex';
