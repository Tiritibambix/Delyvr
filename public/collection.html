<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Collection</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Fraunces:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg:      #0a0a0b;
            --bg2:     #111113;
            --bg3:     #161618;
            --border:  #1e1e21;
            --border2: #2a2a2e;
            --text:    #f2f2f4;
            --muted:   #9898a2;
            --muted2:  #6b6b72;
            --accent:  #c9a962;
            --accent-h:#dfc07a;
        }

        html.light {
            --bg:      #f5f4f0;
            --bg2:     #eceae5;
            --bg3:     #e4e2dd;
            --border:  #dddbd6;
            --border2: #ccc9c3;
            --text:    #000000;
            --muted:   #1c1c1c;
            --muted2:  #242424;
            --accent:  #c9a962;
            --accent-h:#dfc07a;
        }

        html { height: 100%; }
        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Instrument Sans', -apple-system, sans-serif;
            min-height: 100%;
            line-height: 1.5;
            display: flex;
            flex-direction: column;
        }

        /* BG IMAGE PLEINE PAGE */
        .bg-image {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transition: opacity 1.2s ease;
            z-index: 0;
            pointer-events: none;
        }
        .bg-image.loaded { opacity: 0.3; }
        html.light .bg-image.loaded { opacity: 0.45; }

        .bg-overlay {
            position: fixed;
            inset: 0;
            background: linear-gradient(to bottom, rgba(10,10,11,0.15) 0%, rgba(10,10,11,0.7) 100%);
            z-index: 1;
            pointer-events: none;
        }
        html.light .bg-overlay {
            background: rgba(245,244,240,0.35);
        }

        /* SITE HEADER */
        .site-header {
            position: relative;
            z-index: 10;
            border-bottom: 1px solid var(--border);
            padding: 20px 32px;
            text-align: center;
            overflow: hidden;
        }

        .site-header > *:not(.header-bg) {
            position: relative;
            z-index: 1;
        }

        .logo-wrap { text-align: center; margin-bottom: 20px; }
        .logo {
            display: inline-block;
            height: auto;
            max-height: 96px;
            max-width: min(380px, 75vw);
            width: auto;
            object-fit: contain;
        }

        .collection-title {
            font-family: 'Fraunces', serif;
            font-size: clamp(1.6rem, 4vw, 2.4rem);
            font-weight: 300;
            letter-spacing: -0.01em;
            color: var(--text);
            margin-bottom: 6px;
            opacity: 0;
            transform: translateY(12px);
            animation: fadeUp 0.6s ease 0.1s forwards;
        }

        .collection-meta {
            font-size: 12px;
            color: var(--muted);
            letter-spacing: 0.06em;
            opacity: 0;
            animation: fadeUp 0.6s ease 0.2s forwards;
        }

        @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }

        /* DOWNLOAD ALL */
        .download-all-wrap {
            padding: 20px 32px 0;
            display: flex;
            justify-content: center;
            position: relative;
            z-index: 10;
        }

        .download-all-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #c9a962;
            border: none;
            color: #0a0a0b;
            padding: 9px 20px;
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            transition: background 0.2s;
        }

        .download-all-btn:hover {
            background: #dfc07a;
        }

        .download-all-btn svg { width: 14px; height: 14px; }

        /* GALLERIES CONTAINER */
        .galleries-container {
            max-width: 1100px;
            margin: 0 auto;
            padding: 32px 32px 64px;
            position: relative;
            z-index: 10;
        }

        /* GALLERY GRID — cards 3:2 */
        .galleries-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        @media (max-width: 800px) {
            .galleries-grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
        }
        @media (max-width: 480px) {
            .galleries-grid { grid-template-columns: 1fr; gap: 12px; }
        }

        .gallery-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: 6px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: border-color 0.2s;
        }
        .gallery-card:hover { border-color: var(--border2); }

        /* Cover 3:2 */
        .gallery-card-cover {
            display: block;
            position: relative;
            aspect-ratio: 3 / 2;
            overflow: hidden;
            cursor: pointer;
            background: var(--bg3);
            text-decoration: none;
            flex-shrink: 0;
        }

        .gallery-card-cover img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }
        .gallery-card-cover:hover img { transform: scale(1.03); }

        .gallery-card-cover-placeholder {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
        }
        .gallery-card-cover-placeholder svg {
            width: 32px; height: 32px; color: var(--border2);
        }

        /* Overlay "Parcourir" au survol de la cover */
        .gallery-card-cover-overlay {
            position: absolute; inset: 0;
            background: rgba(10,10,11,0.45);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; transition: opacity 0.2s;
        }
        .gallery-card-cover:hover .gallery-card-cover-overlay { opacity: 1; }
        .gallery-card-cover-overlay span {
            font-size: 12px; font-weight: 600;
            letter-spacing: 0.1em; text-transform: uppercase;
            color: #fff;
        }

        /* Card body */
        .gallery-card-body {
            padding: 12px 14px 14px;
            display: flex; flex-direction: column; gap: 10px;
            flex: 1;
        }

        .gallery-card-info { flex: 1; }

        .gallery-card-name {
            font-size: 14px; font-weight: 500;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 3px;
        }

        .gallery-card-meta {
            font-size: 11px; color: var(--muted);
            letter-spacing: 0.03em;
        }

        /* Actions */
        .gallery-card-actions {
            display: flex; gap: 7px; align-items: center;
        }

        .btn-card-icon {
            flex: 1;
            height: 32px;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px;
            background: transparent;
            border: 1px solid var(--border2);
            border-radius: 3px;
            cursor: pointer;
            color: var(--muted);
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.05em; text-transform: uppercase;
            font-family: inherit;
            transition: color 0.15s, border-color 0.15s;
            white-space: nowrap;
        }
        .btn-card-icon svg { width: 13px; height: 13px; flex-shrink: 0; }
        .btn-card-icon:hover { color: var(--text); border-color: var(--muted); }

        .btn-card-dl {
            flex: 1;
            height: 32px;
            display: inline-flex; align-items: center; justify-content: center;
            gap: 6px;
            background: #c9a962;
            border: none;
            border-radius: 3px;
            cursor: pointer;
            color: #0a0a0b;
            font-size: 11px; font-weight: 600;
            letter-spacing: 0.05em; text-transform: uppercase;
            font-family: inherit;
            transition: background 0.15s;
            text-decoration: none;
            white-space: nowrap;
        }
        .btn-card-dl svg { width: 13px; height: 13px; flex-shrink: 0; }
        .btn-card-dl:hover { background: #dfc07a; }

        /* tick vert copy */
        .btn-card-icon.copied { color: var(--success, #52a878); border-color: var(--success, #52a878); }
        .btn-card-icon.copied svg { display: none; }
        .btn-card-icon.copied::after {
            content: '';
            display: block; width: 13px; height: 13px;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 24 24' fill='none' stroke='%2352a878' stroke-width='3' xmlns='http://www.w3.org/2000/svg'%3E%3Cpolyline points='20 6 9 17 4 12'/%3E%3C/svg%3E");
            background-size: contain; background-repeat: no-repeat;
        }

        /* NOT FOUND */
        .not-found {
            display: none;
            text-align: center;
            padding: 80px 32px;
        }

        .not-found.active { display: block; }

        .not-found h2 {
            font-family: 'Fraunces', serif;
            font-weight: 300;
            font-size: 1.6rem;
            margin-bottom: 10px;
        }

        .not-found p { font-size: 13px; color: var(--muted); }

        /* SOCIAL FOOTER */
        .social-footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            z-index: 90;
            padding: 12px 24px;
            border-top: 1px solid var(--border);
            text-align: center;
            background: rgba(10,10,11,0.75);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        html.light .social-footer { background: rgba(245,244,240,0.85); }
        /* Push content above fixed footer */
        .galleries-grid { padding-bottom: 64px; }

        .social-footer-links {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
        }

        .social-footer-links a {
            color: var(--muted);
            display: flex;
            transition: color 0.2s;
        }

        .social-footer-links a:hover { color: var(--accent); }
        .social-footer-links svg { width: 18px; height: 18px; fill: currentColor; }

        @media (max-width: 640px) {
            .site-header { padding: 20px 20px 24px; }
            .galleries-container { padding: 24px 16px 48px; }
            .download-all-wrap { padding: 16px 20px 0; }
        }
    </style>
</head>
<body>

    <img class="bg-image" id="bgImage" alt="">
    <div class="bg-overlay"></div>

    <div class="loading-state" id="loadingState" style="flex:1;text-align:center;padding:80px 32px;font-size:13px;color:var(--muted)">Loading...</div>

    <div id="mainContent" style="display:none; flex: 1;">

        <header class="site-header">
            <div class="logo-wrap">
                <img src="/api/logo" alt="Logo" class="logo">
            </div>
            <h1 class="collection-title" id="collectionTitle"></h1>
            <p class="collection-meta" id="headerMeta"></p>
        </header>

        <div class="download-all-wrap" id="downloadAllWrap" style="display:none;">
            <button class="download-all-btn" onclick="downloadAll()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <span id="downloadAllText"></span>
            </button>
        </div>

        <div class="galleries-container">
            <div class="galleries-grid" id="galleriesGrid"></div>
        </div>

    </div>

    <div class="not-found" id="notFound">
        <h2 id="notFoundTitle"></h2>
        <p id="notFoundText"></p>
    </div>

    <footer class="social-footer" id="socialFooter"></footer>

    <script src="/shared.js"></script>
    <script>
        const translations = {
            en: { loading:'Loading...', photos:'photos', photo:'photo', galleries:'galleries', gallery:'gallery', downloadAll:'Download All', browse:'Browse', download:'Download', copyLink:'Copy Link', copied:'Copied!', notFoundTitle:'Collection Not Found', notFoundText:'This collection may have been removed or the link is incorrect.' },
            fr: { loading:'Chargement...', photos:'photos', photo:'photo', galleries:'galeries', gallery:'galerie', downloadAll:'Tout télécharger', browse:'Parcourir', download:'Télécharger', copyLink:'Copier le lien', copied:'Copié !', notFoundTitle:'Collection introuvable', notFoundText:'Cette collection a peut-être été supprimée ou le lien est incorrect.' },
            es: { loading:'Cargando...', photos:'fotos', photo:'foto', galleries:'galerías', gallery:'galería', downloadAll:'Descargar Todo', browse:'Ver fotos', download:'Descargar', copyLink:'Copiar enlace', copied:'¡Copiado!', notFoundTitle:'Colección No Encontrada', notFoundText:'Esta colección puede haber sido eliminada o el enlace es incorrecto.' },
            pt: { loading:'Carregando...', photos:'fotos', photo:'foto', galleries:'galerias', gallery:'galeria', downloadAll:'Baixar Tudo', browse:'Ver fotos', download:'Baixar', copyLink:'Copiar link', copied:'Copiado!', notFoundTitle:'Coleção Não Encontrada', notFoundText:'Esta coleção pode ter sido removida ou o link está incorreto.' },
            it: { loading:'Caricamento...', photos:'foto', photo:'foto', galleries:'gallerie', gallery:'galleria', downloadAll:'Scarica Tutto', browse:'Sfoglia', download:'Scarica', copyLink:'Copia link', copied:'Copiato!', notFoundTitle:'Collezione Non Trovata', notFoundText:'Questa collezione potrebbe essere stata rimossa o il link non è corretto.' }
        };

        // locale/t are finalized once the collection's resolved clientLanguage
        // is known (see loadCollection()) — these are just safe defaults until then.
        let locale = 'en';
        let t = translations.en;

        function applyStaticTranslations() {
            document.documentElement.lang = locale;
            document.getElementById('loadingState').textContent = t.loading;
            document.getElementById('notFoundTitle').textContent = t.notFoundTitle;
            document.getElementById('notFoundText').textContent = t.notFoundText;
        }
        applyStaticTranslations();

        applyTheme();

        function formatBytes(b) {
            if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
            if (b >= 1048576)    return (b / 1048576).toFixed(0) + ' MB';
            return (b / 1024).toFixed(0) + ' KB';
        }

        const collectionId = window.location.pathname.split('/').pop();
        const critiqueMode = new URLSearchParams(window.location.search).get('critique') === '1';

        function escapeHtml(str) {
            const d = document.createElement('div');
            d.textContent = String(str);
            return d.innerHTML;
        }

        let _downloadUrl = '';

        function downloadAll() {
            if (_downloadUrl) window.location.href = _downloadUrl;
        }

        async function loadCollection() {
            try {
                const res = await fetch(`/api/collection/${collectionId}`);
                if (!res.ok) throw new Error('Not found');
                const data = await res.json();

                locale = resolveClientLocale(data.clientLanguage);
                t = translations[locale];
                applyStaticTranslations();

                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('mainContent').style.display = 'block';

                document.title = data.name || 'Collection';
                document.getElementById('collectionTitle').textContent = data.name || '';

                const totalPhotos = (data.galleries || []).reduce((sum, g) => sum + (g.fileCount || 0), 0);
                const galleryCount = (data.galleries || []).length;
                document.getElementById('headerMeta').textContent =
                    `${galleryCount} ${galleryCount === 1 ? t.gallery : t.galleries} · ${totalPhotos} ${totalPhotos === 1 ? t.photo : t.photos}`;

                if (data.background) {
                    const bgImg = document.getElementById('bgImage');
                    bgImg.onload = () => bgImg.classList.add('loaded');
                    bgImg.src = `/api/collection/${collectionId}/background`;
                }

                const collDownloadsEnabled = data.downloadsEnabled !== false;
                const hasDownloadable = collDownloadsEnabled && (data.galleries || []).some(g => g.downloadsEnabled !== false);
                if (hasDownloadable) {
                    _downloadUrl = `/api/collection/${collectionId}/download`;
                    const sizeLabel = data.totalSizeBytes ? ' · ' + formatBytes(data.totalSizeBytes) : '';
                    document.getElementById('downloadAllText').textContent = t.downloadAll + sizeLabel;
                    document.getElementById('downloadAllWrap').style.display = 'flex';
                }

                const grid = document.getElementById('galleriesGrid');
                grid.innerHTML = '';

                (data.galleries || []).forEach(gallery => {
                    const card = document.createElement('div');
                    card.className = 'gallery-card';

                    const coverInner = gallery.background
                        ? `<img src="/api/gallery/${escapeHtml(gallery.id)}/background?card=1" alt="" loading="lazy">
                           <div class="gallery-card-cover-overlay"><span>${t.browse}</span></div>`
                        : `<div class="gallery-card-cover-placeholder">
                               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
                           </div>
                           <div class="gallery-card-cover-overlay"><span>${t.browse}</span></div>`;

                    const count = gallery.fileCount || 0;
                    const photoLabel = count === 1 ? t.photo : t.photos;

                    const browseUrl = `../preview/${escapeHtml(gallery.id)}?from=${escapeHtml(collectionId)}${critiqueMode ? '&critique=1' : ''}`;
                    const dlUrl = `/api/gallery/${escapeHtml(gallery.id)}/download`;

                    const dlBtn = gallery.downloadsEnabled !== false
                        ? `<a class="btn-card-dl" href="${dlUrl}" onclick="event.stopPropagation()">
                               <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 4v12m0 0l-4-4m4 4l4-4M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2" stroke-linecap="round" stroke-linejoin="round"/></svg>
                               <span>${t.download}</span>
                           </a>`
                        : '';

                    card.innerHTML = `
                        <a class="gallery-card-cover" href="${browseUrl}">
                            ${coverInner}
                        </a>
                        <div class="gallery-card-body">
                            <div class="gallery-card-info">
                                <div class="gallery-card-name">${escapeHtml(gallery.eventName || 'Untitled')}</div>
                                <div class="gallery-card-meta">${count} ${photoLabel}</div>
                            </div>
                            <div class="gallery-card-actions">
                                <button class="btn-card-icon" title="Copy link" onclick="event.stopPropagation(); copyGalleryCustomerLink(this, '${escapeHtml(gallery.id)}')">
                                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
                                    <span>${t.copyLink}</span>
                                </button>
                                ${dlBtn}
                            </div>
                        </div>`;

                    grid.appendChild(card);
                });

            } catch (err) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('notFound').classList.add('active');
            }
        }

        function copyGalleryCustomerLink(btn, galleryId) {
            const url = new URL('../download/' + galleryId, window.location.href).href;
            navigator.clipboard.writeText(url).then(() => {
                btn.classList.add('copied');
                setTimeout(() => btn.classList.remove('copied'), 1800);
            });
        }

        loadCollection();

        document.addEventListener('contextmenu', (e) => {
            if (e.target.tagName === 'IMG') e.preventDefault();
        });

        renderSocialFooter();
    </script>
</body>
</html>
